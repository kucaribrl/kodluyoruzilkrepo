<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1d3a63">
<title>Öz Tekstil — Toptan Yönetim</title>
<style>
  :root{
    --bg:#eef2f8; --card:#fff; --ink:#141d2b; --sub:#67788d; --ln:#e7ecf3; --ln2:#f0f4f9;
    --ind:#24487a; --ind2:#2d6cdf; --thr:#c67b2c; --thr-s:#fbf1e3;
    --good:#0f9d63; --good-s:#e3f6ee; --bad:#e0455f; --bad-s:#fdeaee; --warn:#c8891a; --warn-s:#fbf1d8; --pur:#7a4fd0; --pur-s:#efe9fb;
    --sh:0 1px 2px rgba(20,40,70,.05),0 6px 18px rgba(20,40,70,.07);
    --sh2:0 4px 16px rgba(20,40,70,.1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:76px;font-size:15px;line-height:1.5;overflow-x:hidden}
  .tnum{font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit}

  /* HEADER */
  header{background:linear-gradient(135deg,#1c3760,#2d5aa0);color:#fff;padding:13px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 16px rgba(20,40,70,.22)}
  header .top{display:flex;align-items:center;gap:11px}
  header .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
  header h1{font-size:16px;font-weight:800}
  header .sub{font-size:11px;opacity:.85;margin-top:1px}
  header .role{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
  header .bkbtn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 6px 0 0;display:none}
  header.sub-view .bkbtn{display:block}
  header.sub-view .logo{display:none}

  main{max-width:820px;margin:0 auto;padding:14px}
  .hide{display:none!important}

  /* generic */
  .card{background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
  .sec{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--sub);margin:18px 3px 9px;display:flex;justify-content:space-between;align-items:center}
  .sec a{font-size:11.5px;color:var(--ind2);font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
  .row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
  .row:last-child{border-bottom:none}.row:active{background:var(--ln2)}
  .av{width:40px;height:40px;border-radius:11px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:var(--ind2)}
  .av.p{background:var(--pur)}.av.g{background:var(--good)}.av.o{background:var(--warn)}.av.r{background:var(--bad)}.av.gray{background:#eef2f7;color:#a9b6c6;font-size:19px}
  .mid{flex:1;min-width:0}.mid .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid .s{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .end{text-align:right;flex:0 0 auto}.end .n{font-weight:800;font-size:14px}.end .u{font-size:10.5px;color:var(--sub)}
  .pos{color:var(--good)}.neg{color:var(--bad)}.warnc{color:var(--warn)}
  .pill{display:inline-block;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px}
  .pill.ok{background:var(--good-s);color:var(--good)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.low{background:var(--warn-s);color:var(--warn)}.pill.n{background:var(--ln2);color:var(--sub)}.pill.p{background:var(--pur-s);color:var(--pur)}
  .chips{display:flex;gap:4px;margin-top:5px}.chip{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.12)}
  .tag{font-size:9.5px;font-weight:800;background:var(--ln2);color:var(--sub);padding:2px 6px;border-radius:5px;margin-left:5px}
  .empty{text-align:center;padding:38px 20px;color:var(--sub)}.empty .i{font-size:40px;opacity:.4}.empty p{margin:11px 0 0;font-size:13.5px}
  .mini{font-size:12px;color:var(--sub)}

  .search{width:100%;padding:11px 13px;border:1px solid var(--ln);border-radius:12px;font-size:14px;background:var(--card);margin-bottom:12px;outline:none;box-shadow:var(--sh)}
  .search:focus{border-color:var(--ind2)}
  .segs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}.segs::-webkit-scrollbar{display:none}
  .seg{font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--ln);color:var(--sub);white-space:nowrap;cursor:pointer}
  .seg.on{background:var(--ind);color:#fff;border-color:var(--ind)}
  .tabs{display:flex;background:var(--ln2);border-radius:12px;padding:3px;margin-bottom:13px}
  .tabs .tb{flex:1;text-align:center;padding:9px 4px;font-size:12.5px;font-weight:800;color:var(--sub);border-radius:9px;cursor:pointer}
  .tabs .tb.on{background:var(--card);color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* PANEL / HOME */
  .greet{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .greet .h{font-size:19px;font-weight:800}.greet .d{font-size:12px;color:var(--sub);margin-top:1px}
  .kur{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;margin-bottom:12px;font-size:12.5px;font-weight:800;box-shadow:var(--sh)}
  .kur .up{margin-left:auto;font-size:11px;color:var(--ind2);cursor:pointer}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .tile{border-radius:15px;padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;color:#fff}
  .tile.b1{background:linear-gradient(135deg,#1c7a52,#12a06a)}
  .tile.b2{background:linear-gradient(135deg,#22406e,#2d6cdf)}
  .tile.b3{background:linear-gradient(135deg,#7a4fd0,#9b6ee0)}
  .tile.b4{background:linear-gradient(135deg,#b5701a,#d59433)}
  .tile .l{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;opacity:.9}
  .tile .v{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
  .tile .v.sm{font-size:16px}
  .tile .em{position:absolute;right:-6px;bottom:-10px;font-size:46px;opacity:.16}

  .todo{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
  .todo:last-child{border-bottom:none}
  .todo .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 34px}
  .todo .m{flex:1;min-width:0}.todo .m .t{font-size:13px;font-weight:700}.todo .m .s{font-size:11px;color:var(--sub);margin-top:1px}

  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .mcell{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 4px 9px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative}
  .mcell:active{background:var(--ln2)}
  .mcell .mi{width:36px;height:36px;margin:0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--thr-s)}
  .mcell .mx{font-size:10px;font-weight:700;margin-top:6px;line-height:1.2}
  .mcell .bd{position:absolute;top:6px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .trend{padding:13px}
  .trend .th{display:flex;justify-content:space-between;align-items:baseline}
  .trend .th .a{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--sub)}
  .trend .th .v{font-size:16px;font-weight:800}
  .trend svg{display:block;width:100%;height:46px;margin-top:6px}

  /* NAV / FAB */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 16px rgba(20,40,70,.07)}
  nav button{flex:1;background:none;border:none;padding:5px 2px;color:var(--sub);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button .i{font-size:20px;line-height:1}nav button.on{color:var(--ind2)}
  .fab{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--ind2);color:#fff;border:none;font-size:29px;box-shadow:0 6px 18px rgba(45,108,223,.45);z-index:25;cursor:pointer;display:none;align-items:center;justify-content:center}
  .fab.show{display:flex}.fab:active{transform:scale(.94)}

  /* MODAL */
  .ov{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet .hd{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:2}
  .sheet .hd h3{font-size:17px;font-weight:800}
  .sheet .hd .x{background:var(--ln2);border:none;width:32px;height:32px;border-radius:50%;font-size:17px;color:var(--sub);cursor:pointer}
  .sheet .bd{padding:4px 18px calc(28px + env(safe-area-inset-bottom))}
  label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--sub);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--ln);border-radius:12px;font-size:15px;background:#fbfcfe;outline:none;font-family:inherit;color:var(--ink)}
  input:focus,select:focus{border-color:var(--ind2);background:#fff}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ckrow{display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink);margin:12px 0 2px}
  .ckrow input{width:20px;height:20px;flex:0 0 auto;padding:0}
  .dbox{margin-top:12px;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
  .dline{display:flex;justify-content:space-between;gap:12px;padding:9px 13px;font-size:13.5px;border-top:1px solid var(--ln2)}
  .dline:first-child{border-top:none}.dline span{color:var(--sub)}.dline b{text-align:right;max-width:62%}
  .exhead{display:flex;gap:8px;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--sub);padding:6px 4px;border-bottom:1px solid var(--ln)}
  .exhead span:first-child{flex:1}.exhead span:nth-child(2){width:90px;text-align:right}.exhead span:last-child{width:90px;text-align:right}
  .exrow{display:flex;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ln2)}
  .exl{flex:1;min-width:0}.exl b{font-size:13.5px;font-weight:700}.exl small{display:block;color:var(--sub);font-size:11px}
  .exb{width:90px;text-align:right;font-size:13px;font-weight:700}.exr{width:90px;text-align:right;font-size:13.5px;font-weight:800}
  .exb.neg,.exr.neg{color:var(--bad)}.exb.pos,.exr.pos{color:var(--good)}
  .btn{width:100%;padding:14px;border:none;border-radius:13px;background:var(--ind2);color:#fff;font-size:15px;font-weight:800;margin-top:18px;cursor:pointer}
  .btn:active{opacity:.9}.btn.ghost{background:var(--ln2);color:var(--ind)}.btn.danger{background:var(--bad-s);color:var(--bad)}.btn.g{background:var(--good)}.btn.sm{padding:11px;font-size:13.5px;margin-top:0}
  .seg2{display:flex;background:var(--ln2);border-radius:11px;padding:3px}
  .seg2 .o{flex:1;text-align:center;padding:9px;font-size:12.5px;font-weight:800;color:var(--sub);border-radius:9px;cursor:pointer}
  .seg2 .o.on{background:var(--card);color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}
  .li:last-child{border-bottom:none}
  .li .lt{flex:1;font-size:13.5px}.li .lt small{display:block;color:var(--sub);font-size:11px}
  .del{background:var(--bad-s);color:var(--bad);border:none;width:28px;height:28px;border-radius:8px;font-size:15px;cursor:pointer;flex:0 0 28px}
  .total{background:#eef4fb;border-radius:12px;padding:13px 15px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
  .total .l{font-size:12px;color:var(--sub);font-weight:700}.total .v{font-size:22px;font-weight:800;color:var(--ind)}
  .step{display:flex;align-items:center;gap:9px}
  .step .b{width:34px;height:34px;border-radius:9px;background:var(--ln2);color:var(--ind);border:none;font-size:19px;font-weight:800;cursor:pointer}.step .b.p{background:var(--ind);color:#fff}
  .step input{width:60px;text-align:center;padding:9px}
  .step.sm{gap:5px}.step.sm .b{width:28px;height:28px;font-size:16px;border-radius:7px}.step.sm input{width:44px;padding:6px}
  .renkrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .sw{width:30px;height:30px;flex:0 0 30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
  .sw.sm{width:20px;height:20px;flex:0 0 20px;cursor:default}
  .renkrow .rad{flex:1;margin:0}.renkrow .rst{width:66px;flex:0 0 66px;margin:0;text-align:center}
  .renksel{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--ln)}
  .renksel .rn{font-size:14px;font-weight:700;flex:1}.renksel .rs{font-size:11px;color:var(--sub);font-weight:700;text-align:right}.renksel .rs.bad{color:var(--bad)}
  .bedenbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .bchip{display:inline-flex;align-items:center;gap:5px;background:var(--ind);color:#fff;font-size:12.5px;font-weight:800;padding:6px 8px 6px 11px;border-radius:9px}
  .bchip i{cursor:pointer;font-style:normal;opacity:.75;font-size:11px}
  .binp{width:70px!important;padding:8px 10px!important;margin:0!important}
  .brow{display:flex;align-items:center;gap:8px;margin-top:7px}
  .brow .bn{flex:1;margin:0;font-weight:700}
  .renkcard{border:1px solid var(--ln);border-radius:13px;padding:11px;margin-top:10px;background:#fbfcfe}
  .rc-top{display:flex;align-items:center;gap:8px}.rc-top .rad{flex:1;margin:0}
  .rc-body{display:flex;gap:10px;margin-top:0}
  .rc-foto{width:72px;height:72px;flex:0 0 72px;border:1px dashed var(--ln);border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--sub);font-weight:700;cursor:pointer;overflow:hidden;background:#fff}
  .rc-foto img{width:100%;height:100%;object-fit:cover}
  .rc-fields{flex:1;min-width:0}.rc-fields label{margin:9px 0 4px}.rc-fields input{padding:9px 11px}
  .rc-kirikh{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--ind2);cursor:pointer;user-select:none}
  .rc-kirik{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .kb{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
  .kb span{font-size:11px;font-weight:800;color:var(--sub)}.kb input{width:52px;text-align:center;padding:7px 4px}
  .islemrow{display:flex;gap:7px;align-items:center;margin-top:8px}.islemrow select{flex:1;padding:10px}
  .aclist{display:none;border:1px solid var(--ln);border-radius:11px;margin-top:4px;overflow:hidden;max-height:260px;overflow-y:auto}
  .acitem{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:14px;font-weight:700;cursor:pointer;border-top:1px solid var(--ln2)}
  .acitem:first-child{border-top:none}.acitem:active{background:var(--ln2)}
  .acitem small{display:block;color:var(--sub);font-size:11px;font-weight:600}
  .acitem.yeni{color:var(--ind2)}
  .acav{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--ind2);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .acav img{width:100%;height:100%;object-fit:cover}
  .cfoto{width:58px;height:58px;flex:0 0 58px;border:1px dashed var(--ln);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--sub);cursor:pointer;overflow:hidden;background:#fff}
  .cfoto img{width:100%;height:100%;object-fit:cover}
  .odrow{border:1px solid var(--ln);border-radius:12px;padding:9px;margin-top:8px;background:#fbfcfe}
  .odtop{display:flex;gap:6px;align-items:center}
  .odtop .odt{flex:1;margin:0;padding:10px}.odtop .odpb{width:62px;flex:0 0 62px;margin:0;padding:10px 6px}.odtop .odtur{width:112px;flex:0 0 112px;margin:0;padding:10px 6px}
  .odrow select{margin:0}
  .odcek{border:1px dashed var(--ln);border-radius:9px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#fff}
  .odcek img{width:100%;height:100%;object-fit:cover}
  .svbars{display:flex;gap:3px;flex:0 0 auto}
  .svbar{width:5px;height:40px;border-radius:3px;background:var(--ln2)}
  .svbar.teslim{background:var(--ind2)}.svbar.odendi{background:var(--bad)}
  .bkrow{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--ln)}
  .bksvg{flex:0 0 130px;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:5px}.bkinfo{flex:1}
  .pasifrow{opacity:.5}
  #printarea{display:none}
  @media print{
    body.printing>*{display:none!important}
    body.printing #printarea{display:flex!important;flex-wrap:wrap;gap:6px;padding:6px}
    body.printing .lbl{border:1px solid #000;border-radius:5px;padding:7px 8px;width:210px;text-align:center;page-break-inside:avoid;color:#000}
    body.printing .lbl .l-ad{font-size:12px;font-weight:800;line-height:1.3;margin-bottom:2px}
    body.printing .lbl .l-line{font-size:10px;font-weight:700;line-height:1.4}
    body.printing .lbl svg{margin-top:4px}
    body.printing .fis{width:100%;color:#000;font-size:13px;font-family:ui-sans-serif,system-ui,sans-serif}
    body.printing .fis h2{margin:0 0 4px;font-size:20px}
    body.printing .fis table{width:100%;border-collapse:collapse;margin-top:10px}
    body.printing .fis td{padding:5px 0;border-bottom:1px solid #ddd;vertical-align:top}
    body.printing .fis td.r{text-align:right;white-space:nowrap}
    body.printing .fis small{color:#555}
    body.printing .fis .tot td{font-weight:800;font-size:16px;border-top:2px solid #000;border-bottom:none}
    body.thermal #printarea{display:block!important;padding:0}
    body.thermal .lbl{display:none!important}
    .fisT{font-family:'Courier New',ui-monospace,monospace;color:#000;width:100%;font-size:12px;line-height:1.5;letter-spacing:.2px}
    body.printing .ieA4{display:block!important;color:#000;font-family:ui-sans-serif,system-ui,sans-serif;font-size:12.5px;width:100%}
  }
  .ieA4{color:#000}
  .ieA4 .ieh{display:flex;justify-content:space-between;align-items:flex-start}
  .ieA4 .ien{font-size:22px;font-weight:800}.ieA4 .ies{font-size:11px;color:#333}
  .ieA4 .iet{text-align:right;font-size:17px;font-weight:800;line-height:1.2}
  .ieA4 .ieline{border-top:2px solid #000;margin:8px 0}
  .ieA4 table.iem{width:100%;border-collapse:collapse;margin:6px 0}
  .ieA4 table.iem td{padding:4px 6px;border:1px solid #bbb;font-size:12.5px}
  .ieA4 table.iem td.lb{background:#f0f0f0;font-weight:700;width:70px;white-space:nowrap}
  .ieA4 .iesec{font-weight:800;font-size:12px;letter-spacing:1px;margin:12px 0 3px;border-bottom:1px solid #000;padding-bottom:2px}

  d.seq.ie=Math.max(d.seq.ie||0,mx(d.isemirleri,1000));
  d.seq.h=Math.max(d.seq.h||0,mx(d.hammadde,1000));
  d.seq.oh=Math.max(d.seq.oh||0,mx(d.hesaplar,1000));
  // eski id-çakışması onarımı: aynı id'li cari varsa yeni id ver, referansları isimle taşı
  const gorulen={};
  (d.cariler||[]).forEach(c=>{
    if(gorulen[c.id]){const oldId=c.id,newId=d.seq.c++;
      (d.satislar||[]).forEach(s=>{if(s.mid===oldId&&s.mus===c.ad)s.mid=newId});
      (d.cekler||[]).forEach(k=>{if(k.cariId===oldId&&k.cari===c.ad)k.cariId=newId});
      c.id=newId;
    }else gorulen[c.id]=1;
  });
  // eski string renkleri obje formuna çevir (renk renk stok için)
  const NM={'#111111':'Siyah','#f2f2ee':'Beyaz','#ffffff':'Beyaz','#1d2f52':'Lacivert','#8a8f98':'Gri','#e8e2d4':'Bej','#5a1220':'Bordo','#2b2b2b':'Antrasit','#0f9d63':'Yeşil','#c8891a':'Hardal','#7a4fd0':'Mor','#e0455f':'Kırmızı'};
  (d.urunler||[]).forEach(u=>{
    if(!Array.isArray(u.renkler))return;
    const hasStr=u.renkler.some(r=>typeof r==='string');
    if(hasStr&&!u.renkler.some(r=>r&&typeof r==='object')){
      const n=u.renkler.length,pay=Math.floor((u.stok||0)/n);
      u.renkler=u.renkler.map((hex,i)=>({ad:NM[hex]||('Renk '+(i+1)),hex,foto:'',barkod:'869'+(100000000+((u.id||0)*100+i)%900000000),stok:i===0?((u.stok||0)-pay*(n-1)):pay,kirik:null}));
    }
  });
}

function stokPill(u){const s=stokTop(u);if(s<=0)return '<span class="pill bad">Tükendi</span>';if(s<=u.kritik)return '<span class="pill low">Azaldı</span>';return '<span class="pill ok">Var</span>'}

function kasaHareket(hesapId,yon,tutar,tur,aciklama,cariId){const h=hesap(hesapId);
  if(yon==='out'&&h&&h.bakiye<tutar-0.001){toast('⚠️ '+h.ad+' bakiyesi yetersiz ('+TL(h.bakiye)+'). Hesap eksiye düşemez.');return false}
  if(h)h.bakiye+=(yon==='in'?tutar:-tutar);
  db.hareketler.push({id:nid('hr'),tarih:Date.now(),hesapId,yon,tutar,tur:tur||'',aciklama:aciklama||'',cariId:cariId||null});return true;}
function hesapYeter(hesapId,tutar){const h=hesap(hesapId);return !h||h.bakiye>=tutar-0.001}
function hesapTurToplam(t){return db.hesaplar.filter(h=>h.tur===t).reduce((a,h)=>a+h.bakiye,0)}
function toplamAlacak(){return db.cariler.filter(c=>c.tip==='musteri').reduce((a,c)=>a+Math.max(0,c.bakiye),0)}

function bugunSatis(){const b=new Date().setHours(0,0,0,0);return db.satislar.filter(s=>s.tarih>=b).reduce((a,s)=>a+s.tutar,0)}

  ortak:{ad:'Ortak',ic:'🤝',kar:true,para:true,urunYaz:true,hammadde:true,views:'panel,satis,stok,cari,kasa,cek,uretim,portal,rapor,ayarlar,daha'},
  magaza:{ad:'Mağaza Elemanı',ic:'🏪',kar:false,para:false,urunYaz:false,hammadde:false,views:'panel,satis,stok,cari,ayarlar,daha'},

  const list=db.urunler.filter(u=>(stokKat==='Tümü'||u.kat===stokKat)&&(u.ad.toLowerCase().includes(q)||u.kod.toLowerCase().includes(q)||(u.marka||'').toLowerCase().includes(q))).sort((a,b)=>(a.pasif?1:0)-(b.pasif?1:0));

function emp(i,t){return `<div class="empty"><div class="i">${i}</div><p>${t}</p></div>`}

function urunKapak(u){const r=(u.renkler||[]).find(x=>x&&typeof x==='object'&&x.foto);return r?r.foto:''}
function urunDetay(id){

    ['Yıl · Mevsim',[u.yil,u.sezon].filter(Boolean).join(' · ')],
    ['Kumaş',u.kumas],u.agirlik?['Ağırlık',u.agirlik+' gr']:null,

    ['Tedarikçi',(u.tedarikciId&&cari(u.tedarikciId))?cari(u.tedarikciId).ad:''],
    ['RAF',u.raf],['Kaynak',u.kaynak==='alim'?'Hazır Alınan':'Kendi Üretimi'],
  ].filter(x=>x&&x[1]);
  const oz=urunSatisOzet(id);
  open_(u.ad,`
    ${kapak?`<img src="${kapak}" style="width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}
    <div class="total"><div><div class="l">Satış${u.promosyon?' · promo '+money(u.promosyon,pb):''}</div><div class="v">${money(u.satis,pb)}<span style="font-size:12px;color:var(--sub)">/${u.birim}</span></div></div><div style="text-align:right"><div class="l">Toplam Stok</div><div class="v ${u.stok<=0?'neg':u.stok<=u.kritik?'':'pos'}">${u.stok} ${u.birim}</div></div></div>
    ${karGoster()?`<div class="kv" style="margin-top:8px"><span class="k">Alış / Kâr</span><span class="v">${money(u.alis,pb)} · <span class="pos">${money(kar,pb)} (%${karY})</span></span></div>`:''}
    ${oz.seri>0?`<div class="infobox" style="margin-top:10px;background:var(--good-s);color:var(--good)">📈 Bu üründen <b>${oz.seri} ${u.birim}</b> satıldı${oz.best?` · en çok <b>${esc(oz.best[0])}</b> (${oz.best[1]})`:''}${karGoster()?` · ciro <b>${TL(oz.ciro)}</b>`:''}${oz.sonTarih?` · son ${dstr(oz.sonTarih)}`:''}</div>`:'<div class="mini" style="margin-top:10px">📈 Bu üründen henüz satış yok</div>'}
    <div class="dbox" style="margin-top:12px">${infoRows.map(([k,v])=>`<div class="dline"><span>${k}</span><b>${esc(''+v)}</b></div>`).join('')}</div>
    ${hasRenkStok(u)?`<div class="sec" style="margin-top:14px">Renk & Stok</div><div class="card" style="padding:6px 12px">${renkObjs(u).map(r=>{const kt=kirikTop(r);return `<div class="renksel"><span class="sw sm" style="background:${r.hex}"></span>${r.foto?`<img src="${r.foto}" style="width:34px;height:34px;border-radius:7px;object-fit:cover">`:''}<span class="rn">${esc(r.ad||'—')}${r.barkod?`<small style="display:block;color:var(--sub);font-weight:600">${esc(r.barkod)}</small>`:''}</span><span class="rs ${r.stok<=0?'bad':''}">${r.stok||0} seri${kt?`<br><span style="color:var(--thr)">+${kt} kırık</span>`:''}</span></div>`}).join('')}</div>`:''}
    ${u.islemler&&u.islemler.length?`<div class="sec" style="margin-top:14px">🧵 İşlem Takibi</div><div class="dbox">${u.islemler.map(it=>`<div class="dline"><span>${esc(it.islem)}</span><b>${esc((cari(it.fasonId)||{}).ad||'—')}</b></div>`).join('')}</div>`:''}
    ${u.not?`<div class="infobox" style="margin-top:12px">📝 ${esc(u.not)}</div>`:''}
    ${(canUrunYaz()||canSee('satis'))?`<div class="g2" style="margin-top:16px">${canUrunYaz()?`<button class="btn ghost sm" onclick="formUrun(${id})">✏️ Düzenle</button>`:''}${canSee('satis')?`<button class="btn sm" onclick="closeM();go('satis');setTimeout(()=>formSatis(${id}),150)">🧾 Satışa Ekle</button>`:''}</div>`:''}
    ${canSayim()?`<button class="btn ghost sm" style="margin-top:10px" onclick="closeM();setTimeout(()=>formSayim(${id}),120)">📋 Sayım / Raf Gir</button>`:''}
    ${canUrunYaz()?`<div class="g2" style="margin-top:10px"><button class="btn ghost sm" onclick="cogaltUrun(${id})">📄 Çoğalt</button>${hasRenkStok(u)?`<button class="btn ghost sm" onclick="barkodYazdir(${id})">🏷️ Barkod Yazdır</button>`:''}</div>
    <button class="btn ghost sm" style="margin-top:10px;color:${u.pasif?'var(--good)':'var(--bad)'}" onclick="urunAktifToggle(${id});closeM()">${u.pasif?'✅ Aktif Et':'🗄️ Pasife Al (arşivle)'}</button>`:''}
  `);
}

/* ---- Depo Sayımı (raf + fiziksel sayım, depocu girer) ---- */
function canSayim(){return db.rol==='depocu'||canUrunYaz()}
function depoSayim(){if(!canSayim())return toast('Yetkiniz yok');
  const list=[...db.urunler].filter(u=>!u.pasif).sort((a,b)=>(a.sonSayim||0)-(b.sonSayim||0));
  const today=new Date().toDateString();
  const bugunN=list.filter(u=>u.sonSayim&&new Date(u.sonSayim).toDateString()===today).length;
  const rows=list.map(u=>{const st=hasRenkStok(u)?stokTop(u):(u.stok||0);
    const sayilmis=u.sonSayim&&new Date(u.sonSayim).toDateString()===today;
    return `<div class="row" onclick="formSayim(${u.id},1)"><div class="av ${sayilmis?'g':'gray'}">${sayilmis?'✅':'📦'}</div><div class="mid"><div class="t">${esc(u.ad)}</div><div class="s">${esc(u.kod)} · 📍 ${u.raf?esc(u.raf):'<span style="color:var(--bad)">raf yok</span>'} · ${u.sonSayim?'son '+dstr(u.sonSayim):'hiç sayılmadı'}</div></div><div class="end"><div class="n">${st}</div><div class="u">${u.birim}</div></div></div>`}).join('');
  open_('📋 Depo Sayımı',`
    <div class="infobox">Her ürünü tek tek say; adedini ve rafını gir. Fark çıkarsa sistem otomatik düzeltir. En son sayılanlar en altta.</div>
    <div class="depoprog" style="margin-top:10px"><div class="bar"><i style="width:${list.length?Math.round(bugunN/list.length*100):0}%"></i></div><span class="lbl">${bugunN}/${list.length} bugün</span></div>
    <div class="card" style="margin-top:8px">${rows||emp('📦','Ürün yok')}</div>
  `);
}
function formSayim(id,fromList){const u=urun(id);if(!u)return;if(!canSayim())return toast('Yetkiniz yok');
  const cols=hasRenkStok(u);
  const rows=cols?renkObjs(u).map((r,i)=>`<div class="syrow"><span class="sw sm" style="background:${r.hex}"></span><span class="synm">${esc(r.ad||'—')}<small>sistemde ${r.stok||0} ${u.birim}</small></span><input id="sy-${i}" type="number" inputmode="numeric" min="0" value="${r.stok||0}" oninput="sayFark()" class="syin"></div>`).join('')
    :`<div class="syrow"><span class="synm">${esc(u.ad)}<small>sistemde ${u.stok||0} ${u.birim}</small></span><input id="sy-0" type="number" inputmode="numeric" min="0" value="${u.stok||0}" oninput="sayFark()" class="syin"></div>`;
  open_('📋 Sayım · '+u.ad,`
    <label>📍 RAF / Depo Yeri</label><input id="sy-raf" value="${esc(u.raf||'')}" placeholder="A-12">
    <div class="sec" style="margin-top:12px">Saydığın Adet ${cols?'<span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--sub)">— renk renk</span>':''}</div>
    <div class="card" style="padding:6px 12px">${rows}</div>
    <div class="mini" id="sy-fark" style="margin-top:8px"></div>
    <button class="btn" onclick="kaydetSayim(${id},${fromList?1:0})">✓ Sayımı Kaydet</button>
    ${fromList?`<button class="btn ghost sm" style="margin-top:8px" onclick="depoSayim()">← Sayım listesine dön</button>`:''}
  `);
  window._sayU=u; sayFark();
}
function sayFark(){const u=window._sayU;if(!u)return;const el=$('sy-fark');if(!el)return;
  const cols=hasRenkStok(u);let sis=0,say=0;
  if(cols)renkObjs(u).forEach((r,i)=>{sis+=(+r.stok||0);say+=Math.max(0,+($('sy-'+i)?.value||0))});
  else{sis=+u.stok||0;say=Math.max(0,+($('sy-0')?.value||0))}
  const f=say-sis;
  el.innerHTML=`Sistemde <b>${sis}</b> · saydın <b>${say}</b> · fark <b style="color:${f===0?'var(--good)':f<0?'var(--bad)':'var(--thr)'}">${f>0?'+':''}${f}</b>${f?' '+(f<0?'(eksik/kayıp)':'(fazla)'):' ✓'}`;
}
function kaydetSayim(id,fromList){const u=urun(id);if(!u)return;
  u.raf=($('sy-raf')?.value||'').trim();
  const cols=hasRenkStok(u);let sis=0,fark=0;
  if(cols){renkObjs(u).forEach((r,i)=>{sis+=(+r.stok||0);r.stok=Math.max(0,+($('sy-'+i)?.value||0))});u.stok=stokTop(u);fark=u.stok-sis}
  else{const c=Math.max(0,+($('sy-0')?.value||0));sis=+u.stok||0;fark=c-sis;u.stok=c}
  u.sonSayim=Date.now();save();
  toast(fark===0?'Sayım kaydedildi ✓ fark yok':`Sayım kaydedildi · fark ${fark>0?'+':''}${fark} ${u.birim}`);
  if(fromList)depoSayim();else{closeM();render()}
}

function resizeImg(file,cb,max=900,q=0.72){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{cb(c.toDataURL('image/jpeg',q))}catch(e){cb(r.result)}};img.src=r.result};r.readAsDataURL(file)}

function setKaynak(k){uKaynak=k;const a=$('kn-uretim'),b=$('kn-alim');if(a)a.classList.toggle('on',k==='uretim');if(b)b.classList.toggle('on',k==='alim');const tw=$('ted-wrap');if(tw)tw.style.display=k==='alim'?'':'none';const n=$('kaynak-not');if(n)n.textContent=k==='alim'?'Ürünü hazır aldın — geldiği firmayı (tedarikçi) aşağıda seç.':'Ürünü kendin üretiyorsun — kumaş/aksesuar Hammadde\'den, kesim/dikim/nakış takibi Üretim modülünden gelir.'}
function urunTab(t){uTab=t;$('upane-genel').style.display=t==='genel'?'':'none';$('upane-stok').style.display=t==='stok'?'':'none';$('ut-genel').classList.toggle('on',t==='genel');$('ut-stok').classList.toggle('on',t==='stok')}

function kaydetUrun(id){

  const bedenler=birim==='seri'?fBeden.filter(x=>x.beden).map(x=>({beden:x.beden.trim(),adet:Math.max(1,+x.adet||1)})):[];

  const kat=$('u-kat').value.trim();if(!kat){urunTab('genel');$('u-kat')&&$('u-kat').focus();return toast('Kategori gir')}

  const oldStok=id?(urun(id)?.stok||0):0;
  const kaydet2=()=>{
    if(id){Object.assign(urun(id),o)}else{o.id=nid('u');db.urunler.push(o)}
    save();closeM();

    if(uKaynak==='alim'&&ted&&delta>0&&o.alis>0){
      const tutar=delta*o.alis, pb=o.pb||'TL';
      render();toast('Ürün kaydedildi ✓');
      askConfirm(`${delta} ${o.birim} × ${money(o.alis,pb)} = ${money(tutar,pb)}\n${ted.ad} firmasına borç yazılsın mı?`,()=>{

        else if(pb==='EUR'){ted.bakiye=(ted.bakiye||0)+tutar*db.kurEUR}
        else{ted.bakiye=(ted.bakiye||0)+tutar}

      },'Borç Yaz');
      return;
    }
    render();toast('Ürün kaydedildi ✓');
  };
  if(satis<alis)askConfirm(`Satış fiyatı (${money(satis,uPB)}) maliyetin (${money(alis,uPB)}) altında — zararına satış.\nYine de kaydedilsin mi?`,kaydet2,'Kaydet');
  else kaydet2();
}

const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128Bseq(text){const codes=[104];let sum=104;for(let i=0;i<text.length;i++){const v=text.charCodeAt(i)-32;codes.push(v);sum+=v*(i+1)}codes.push(sum%103);codes.push(106);return codes.map(c=>C128[c]).join('')}
function barkodSVG(text,h=48){const seq=code128Bseq(''+text);const q=10;let x=q,rects='',bar=true;for(const ch of seq){const w=+ch;if(bar)rects+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w;bar=!bar}const W=x+q;return `<svg viewBox="0 0 ${W} ${h+15}" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:230px;height:auto"><rect x="0" y="0" width="${W}" height="${h+15}" fill="#fff"/><g fill="#000">${rects}</g><text x="${W/2}" y="${h+12}" font-size="11" text-anchor="middle" fill="#000" font-family="monospace" letter-spacing="1">${esc(''+text)}</text></svg>`}
function barkodYazdir(id){const u=urun(id);let changed=false;renkObjs(u).forEach(r=>{if(!r.barkod){r.barkod=genBarkod();changed=true}});if(changed)save();const renkler=renkObjs(u);if(!renkler.length)return toast('Bu üründe renk yok');

    <button class="btn" onclick="barkodYap(${id})">🖨️ Yazdır</button>
    <div class="mini" style="margin-top:8px">Not: Yazdır penceresi açılmazsa (önizleme kısıtı), uygulamayı kendi ekranında açtığında sorunsuz çalışır.</div>
  `);
}
function seriStr(u){if(u.birim!=='seri')return 'Tekli ürün';if(u.bedenler&&u.bedenler.length)return 'Seri: '+u.bedenler.map(x=>typeof x==='object'?x.beden+(x.adet>1?'×'+x.adet:''):x).join('·')+' ('+u.seri+')';return u.seri+"'li seri"}
function barkodYap(id){const u=urun(id);const renkler=renkObjs(u).filter(r=>r.barkod);let cells='';const sstr=seriStr(u);

function attachSwipe(){
  document.querySelectorAll('#stok-list .row[data-uid]').forEach(row=>{
    let sx=0,dx=0,active=false;
    const start=x=>{sx=x;dx=0;active=true;row.style.transition=''};
    const move=x=>{if(!active)return;dx=x-sx;if(dx<0)dx=0;row.style.transform=`translateX(${Math.min(dx,100)}px)`;row.style.background=dx>60?'var(--good-s)':''};
    const end=()=>{if(!active)return;active=false;row.style.transition='transform .2s';const go=dx>60;row.style.transform='';row.style.background='';if(go)urunAktifToggle(+row.dataset.uid)};
    row.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});
    row.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
    row.addEventListener('touchend',end);
  });
}

function urunSatisOzet(id){let seri=0,ciro=0,sonTarih=0;const renkSay={};
  db.satislar.forEach(s=>s.kalemler.forEach(k=>{if(k.uid===id){seri+=k.mik;ciro+=k.mik*k.fiyat;if(s.tarih>sonTarih)sonTarih=s.tarih;if(k.renkler)k.renkler.forEach(r=>{renkSay[r.ad]=(renkSay[r.ad]||0)+r.mik})}}));
  const best=Object.entries(renkSay).sort((a,b)=>b[1]-a[1])[0];
  return {seri,ciro,sonTarih,best};
}

let satisFilt='tum';
function rSatis(){
  let list=[...db.satislar].sort((a,b)=>b.tarih-a.tarih);

  else if(satisFilt==='teslim')list=list.filter(s=>(s.teslimDurum||'teslim')==='teslim');
  else if(satisFilt==='depo')list=list.filter(s=>s.depo);
  const ayr=db.satislar.filter(s=>s.teslimDurum==='ayrildi').length;
  const depoBek=depoBekleyen().length;
  const tabs=[['tum','Tümü'],['depo','📦 Depo'+(depoBek?' ('+depoBek+')':'')],['ayrildi','🔖 Ayrılan'+(ayr?' ('+ayr+')':'')],['teslim','✓ Teslim']];
  let html=`<div class="tabs">`+tabs.map(t=>`<div class="tb ${satisFilt===t[0]?'on':''}" onclick="satisFilt='${t[0]}';rSatis()">${t[1]}</div>`).join('')+`</div>`;
  if(satisFilt==='depo')html+=`<div class="mini" style="margin:2px 3px 0">📦 Depocuya gönderilen toplama emirleri. <b>Ayrılıyor</b> = bekliyor, <b>✓ Hazır</b> = depocu ayırdı.</div>`;
  html+=`<div class="sec">Satışlar <a onclick="formSatis()">+ Yeni</a></div><div class="card">`+(list.length?list.map(s=>{
    const ayrildi=s.teslimDurum==='ayrildi';const teslim=!ayrildi;const odendi=s.odenen>=s.tutar;
    const depoBadge=s.depo==='bekliyor'?'<span class="pill low" style="margin-left:5px">📦 ayrılıyor</span>':s.depo==='hazir'?'<span class="pill ok" style="margin-left:5px">✓ hazır</span>':'';
    return `<div class="row" onclick="satisFis(${s.id})"><div class="svbars"><i class="svbar ${teslim?'teslim':''}" title="Teslim edildi"></i><i class="svbar ${odendi?'odendi':''}" title="Parası alındı"></i></div><div class="av ${ayrildi?'o':'g'}">${ayrildi?'🔖':'🧾'}</div><div class="mid"><div class="t">${esc(s.mus)}${depoBadge}</div><div class="s">${tstr(s.tarih)} · ${s.kalemler.map(k=>esc(k.urun)).join(', ')}</div></div><div class="end"><div class="n">${money(s.tutar,s.pb)}</div><div class="u">${ayrildi?'🔖 ayrıldı':teslim?'✓ teslim':''}${odendi?' · 💰':''}</div></div></div>`}).join(''):emp('🧾',satisFilt==='depo'?'Depoda bekleyen sipariş yok.':'Kayıt yok.'))+`</div>`;
  $('app').innerHTML=html;

async function kameraTara(){
  if(!('BarcodeDetector' in window)){toast('Bu cihaz kamerayla taramayı desteklemiyor — kod/isim yazabilirsin');return}
  try{
    const det=new window.BarcodeDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.createElement('video');v.srcObject=stream;v.setAttribute('playsinline','');await v.play();
    open_('Barkod Tara','<div class="mini">Barkodu kameraya gösterin</div><div id="cam-wrap" style="margin-top:10px;border-radius:12px;overflow:hidden;background:#000"></div>');
    $('cam-wrap').appendChild(v);v.style.width='100%';
    let done=false;const tick=async()=>{if(done)return;try{const codes=await det.detect(v);if(codes.length){done=true;stream.getTracks().forEach(t=>t.stop());const val=codes[0].rawValue;closeM();setTimeout(()=>{if($('s-urun-in')){$('s-urun-in').value=val;urunEnter()}},200);return}}catch(e){}requestAnimationFrame(tick)};tick();
    $('ov').addEventListener('click',function h(e){if(e.target.id==='ov'){done=true;stream.getTracks().forEach(t=>t.stop());$('ov').removeEventListener('click',h)}});
  }catch(e){toast('Kameraya erişilemedi')}
}
const MUS_GRUP=['Bayi','Toptancı','Aracı','Perakende','Özel'];

function satisHesap(){
  const ara=sepet.reduce((a,k)=>a+k.mik*k.fiyat,0);
  const isk=+($('s-isk')?.value||0), vf=vadeFarkiYuzde(), kdv=+($('s-kdv')?.value||0), tasima=+($('s-tasima')?.value||0);

  const malPB=mal/div, kdvPB=kdvTutar/div;

  return {ara,isk,vf,kdv,tasima,div,malPB,kdvPB,tutar};

  if(s.kdv)t+=`KDV %${s.kdv}: +${money(s.kdvTutar||0,s.pb)}\n`;

function fisTermalHTML(s){

  const m=cari(s.mid);
  // ürün tablosu (Kod · Ürün / Adet · Fiyat · Toplam)
  let toplamAdet=0;
  const items=s.kalemler.map(k=>{
    const u=urun(k.uid);const kod=(u&&u.kod)||'—';toplamAdet+=k.mik;
    const cl=k.renkler&&k.renkler.length?k.renkler.map(r=>esc(r.ad)+'×'+r.mik).join(' '):'';
    return `<tr class="itr"><td class="knm">${esc(kod)}</td><td colspan="4">${esc(k.urun)}</td></tr>
      <tr><td colspan="2" class="cl">${cl}</td><td class="r">${k.mik}</td><td class="r">${money(k.fiyat,s.pb)}</td><td class="r">${money(k.mik*k.fiyat,s.pb)}</td></tr>`;
  }).join('');
  // toplamlar
  const iskT=(s.araToplam||0)*(s.iskonto||0)/100;
  const kalan=Math.max(0,s.tutar-s.odenen-(s.kesik||0));
  // cari bakiye (TL) — bu satıştan önce / sonra
  const div=pbKur(s.pb);const netTL=(s.tutar-s.odenen-(s.kesik||0))*div;
  const sonBk=m?m.bakiye:null;const oncekiBk=sonBk!=null?sonBk-netTL:null;
  const sat=(db.satici||'').trim();
  const not=(s.sevkiyat||'').trim();
  return `<div class="fisT">
    ${db.firmaLogo?`<div class="th-logo"><img src="${db.firmaLogo}"></div>`:`<div class="th-name">${esc((db.firma||'ÖZ TEKSTİL').toLocaleUpperCase('tr-TR'))}</div>`}
    <div class="rs"></div>
    <div class="th-title">Sipariş Fişi</div>
    <div class="rs"></div>
    ${db.firmaTel?`<div class="th-ct"><span class="ci">📞</span><span>Tel: ${esc(db.firmaTel)}</span></div>`:''}
    ${db.firmaWp?`<div class="th-ct"><span class="ci">🟢</span><span>WhatsApp: ${esc(db.firmaWp)}</span></div>`:''}
    <div class="th-ct"><span class="ci">🏪</span><span>${esc(db.firma||'')}</span></div>
    ${db.firmaAdres?`<div class="th-ct"><span class="ci">📍</span><span>${esc(db.firmaAdres)}</span></div>`:''}
    <div class="mbox">
      <div class="mtop"><span><b>Müşteri:</b></span><span>${tarih}</span></div>
      <div class="mn">${esc(s.mus)}</div>
      <div class="ml">${esc([m&&m.ulke,m&&(m.sehir||m.il)].filter(Boolean).join(' — ')||'—')}</div>
      ${m&&m.tel?`<div class="ml">${esc(m.tel)}</div>`:''}
    </div>
    <div class="sat"><span>Satıcı: ${esc(sat||db.firma||'')}</span><span>No. ${s.id}</span></div>
    <table class="it">
      <thead><tr><th>Kod</th><th>Ürün</th><th class="r">Adet</th><th class="r">Fiyat</th><th class="r">Toplam</th></tr></thead>
      <tbody>${items}</tbody>
    </table>
    <div class="toplamadet">Toplam Adet: ${toplamAdet}</div>
    <div class="tbox">
      ${rw('Sipariş Tutarı',money(s.araToplam||s.tutar,s.pb))}
      ${s.iskonto?rw('Fark / İndirim','−'+money(iskT,s.pb)):''}
      ${s.tasima?rw('Taşıma / Kargo','+'+money(s.tasima,s.pb)):''}
      ${s.kesik?rw('Kesik','−'+money(s.kesik,s.pb)):''}
      ${(s.kdv!=null)?rw('KDV %'+(s.kdv||0),money(s.kdvTutar||0,s.pb)):''}
      ${rw('TOPLAM',money(s.tutar,s.pb),'big')}
    </div>
    <div class="tbox">
      ${rw('Ödeme',money(s.odenen,s.pb))}
      ${rw('Kalan',money(kalan,s.pb))}
      ${oncekiBk!=null?rw('Önceki Bakiye',money(oncekiBk,'TL')):''}
      ${sonBk!=null?rw('Son Bakiye',money(sonBk,'TL')):''}
    </div>
    <div class="notbox">Not: ${esc(not)}</div>
    <div class="ft">Bizi tercih ettiğiniz için teşekkür ederiz 🙏</div>

/* ---- Depo toplama/ayırma emri ---- */
function depoBekleyen(){return db.satislar.filter(s=>s.depo==='bekliyor').sort((a,b)=>a.tarih-b.tarih)}
function depoLines(s){ // rafa göre sıralı, tek tek toplanacak satırlar
  const lines=[];
  s.kalemler.forEach((k,ki)=>{const u=urun(k.uid);const raf=(u&&u.raf)?u.raf:'—';
    if(k.renkler&&k.renkler.length)k.renkler.forEach((r,ri)=>lines.push({key:ki+'_'+ri,urun:k.urun,renk:r.ad,mik:r.mik,birim:k.birim,raf}));
    else lines.push({key:ki+'_x',urun:k.urun,renk:'',mik:k.mik,birim:k.birim,raf});
  });
  return lines.sort((a,b)=>(''+a.raf).localeCompare(''+b.raf,'tr')||a.urun.localeCompare(b.urun,'tr'));
}
function depoEmri(id){const s=db.satislar.find(x=>x.id===id);if(!s)return;
  if(!s.depoCheck)s.depoCheck={};
  const lines=depoLines(s);const toplam=lines.length;const yapilan=lines.filter(l=>s.depoCheck[l.key]).length;
  const bitti=s.depo==='hazir';const pct=toplam?Math.round(yapilan/toplam*100):0;
  const rows=lines.map(l=>{const done=bitti||s.depoCheck[l.key];
    return `<div class="depoline ${done?'done':''}" ${bitti?'':`onclick="depoTik(${id},'${l.key}')"`}>
      <span class="dchk">${done?'✅':'⬜'}</span>
      <div class="dmid"><div class="du">${esc(l.urun)}${l.renk?' · '+esc(l.renk):''}</div><div class="dr">📍 RAF ${esc(l.raf)}</div></div>
      <b class="dmik">${l.mik} ${esc(l.birim)}</b>
    </div>`}).join('');
  open_('📦 Toplama Emri · İrsaliye #'+id,`
    <div class="mini">${esc(s.mus)} · ${tstr(s.tarih)}</div>
    ${bitti?'<div class="okbox">✓ Bu sipariş hazırlandı</div>':`<div class="infobox">Her ürünü rafından topla, ayırdıkça üstüne dokun ✅. Liste raf sırasına dizildi.</div>
    <div class="depoprog"><div class="bar"><i style="width:${pct}%"></i></div><span class="lbl">${yapilan}/${toplam}</span></div>`}
    <div class="card" style="padding:2px 4px;margin-top:8px">${rows}</div>
    ${s.sevkiyat?`<div class="okbox" style="margin-top:10px">📦 Sevkiyat: ${esc(s.sevkiyat)}</div>`:''}
    ${bitti?'':`<button class="btn ${yapilan===toplam?'g':'ghost'}" style="margin-top:12px" onclick="depoHazirla(${id})">✓ Hazırladım / Ayırdım</button>`}
  `);
}
function depoTik(id,key){const s=db.satislar.find(x=>x.id===id);if(!s||s.depo==='hazir')return;
  if(!s.depoCheck)s.depoCheck={};s.depoCheck[key]=!s.depoCheck[key];save();depoEmri(id)}
function depoHazirla(id){const s=db.satislar.find(x=>x.id===id);if(!s)return;
  const lines=depoLines(s);const eksik=lines.filter(l=>!(s.depoCheck&&s.depoCheck[l.key]));
  const bitir=()=>{s.depo='hazir';save();closeM();render();toast('Sipariş hazırlandı ✓ Patrona bildirildi')};
  if(eksik.length)askConfirm(`${eksik.length} kalem henüz işaretlenmedi (toplam ${lines.length}).\nYine de "hazırlandı" olarak kapatılsın mı?`,bitir,'Yine de kapat');
  else bitir();
}
function silSatis(id){askConfirm('Satış iptal edilsin mi? Stok, bakiye, ödeme ve çek geri alınır.',()=>{
  const s=db.satislar.find(x=>x.id===id);revertSatis(s);
  db.satislar=db.satislar.filter(x=>x.id!==id);save();closeM();go('satis');toast('İptal edildi')})}

let cariTab='musteri';
function rCari(){
  const fasoncu=db.rol==='fason';
  const tabs=fasoncu?[['fason','🧵 Fason'],['tedarikci','🚚 Tedarikçi']]:[['musteri','👥 Müşteri'],['tedarikci','🚚 Tedarikçi'],['fason','🧵 Fason'],['gider','☕ Gider']];
  if(fasoncu&&(cariTab==='musteri'||cariTab==='gider'))cariTab='fason';
  let html=`<div class="tabs">`+tabs.map(t=>`<div class="tb ${cariTab===t[0]?'on':''}" onclick="cariTab='${t[0]}';rCari()">${t[1]}</div>`).join('')+`</div>`;
  html+=`<input class="search" id="ara-cari" placeholder="🔍 Ara..." oninput="rCariList()">`;
  if(cariTab==='musteri'){
    const borclu=db.cariler.filter(c=>c.tip==='musteri'&&c.bakiye>0).length;
    const cuma=new Date().getDay()===5;
    html+=`<button class="btn ${cuma?'g':'ghost'} sm" style="margin-bottom:10px" onclick="tahsilatHatirlat()">🔔 Tahsilat Hatırlatma${borclu?' ('+borclu+')':''}${cuma?' · Bugün Cuma!':''}</button>`;
    const tk=db.cariler.filter(c=>c.tip==='musteri').reduce((a,c)=>a+(c.kesikToplam||0),0);if(tk>0)html+=`<div class="warnbox" style="margin-bottom:10px">✂️ Tüm müşterilerin toplam kesiği (zararın): <b>${TL(tk)}</b></div>`;
  }
  html+=`<div class="card" id="cari-list"></div>`;
  $('app').innerHTML=html;rCariList();
}
function rCariList(){
  const q=($('ara-cari')?.value||'').toLowerCase();
  const list=db.cariler.filter(c=>c.tip===cariTab&&(c.ad.toLowerCase().includes(q)||(c.tel||'').includes(q))).sort((a,b)=>Math.abs(b.bakiye)-Math.abs(a.bakiye));
  const isMus=cariTab==='musteri';
  $('cari-list').innerHTML=list.length?list.map(c=>{
    const usd=c.doviz==='USD'&&c.bakiyeUSD;
    const b=c.bakiye,cls=b>0?(isMus?'neg':'neg'):b<0?'pos':'',lbl=isMus?(b>0?'borç':b<0?'alacaklı':'kapalı'):(b>0?'borcun':b<0?'alacağın':'kapalı');
    const avc=c.tip==='tedarikci'?'o':c.tip==='fason'?'p':c.tip==='gider'?'g':'';
    const sub=c.tip==='tedarikci'?(c.tedTur||c.sehir||c.tel||''):c.tip==='fason'?(c.fasIslem||c.durak||c.sehir||''):c.tip==='gider'?[c.gidKat,c.tekrarli?'· aylık':''].filter(Boolean).join(' '):(c.sehir||c.tel||'');
    return `<div class="row" onclick="cariKart(${c.id})"><div class="av ${avc}" style="overflow:hidden;${c.foto?'padding:0':''}">${c.foto?`<img src="${c.foto}" style="width:100%;height:100%;object-fit:cover">`:(c.tip==='gider'?'☕':ii(c.ad))}</div><div class="mid"><div class="t">${esc(c.ad)}</div><div class="s">${esc(sub)}</div></div><div class="end"><div class="n ${cls}">${usd?USD(c.bakiyeUSD):TL(Math.abs(b))}</div><div class="u">${lbl}${usd?' ($)':''}</div></div></div>`}).join(''):emp('👥','Kayıt yok. + ile ekle.');
}

function kaydetCari(tip,id){const ad=$('c-ad').value.trim();if(!ad)return toast('Ad gerekli');
  if(tip==='musteri'&&!($('c-tel')?.value||'').trim()){$('c-tel')&&$('c-tel').focus();return toast('Telefon gerekli')}

function cariEkstre(id){
  const c=cari(id);const evs=[];const isMus=c.tip==='musteri';
  db.satislar.filter(s=>s.mid===id).forEach(s=>{const div=satisDiv(s);
    evs.push({t:s.tarih,ad:'Satış',det:s.kalemler.map(k=>k.urun).join(', ').slice(0,40),borc:s.tutar*div,sid:s.id});
    if(s.odenen>0)evs.push({t:s.tarih+1,ad:'Ödeme (satışta)',det:s.odemeTur||'',alacak:s.odenen*div});
    if(s.kesik>0)evs.push({t:s.tarih+2,ad:'Kesik',det:'müşteri kırdı',alacak:s.kesik*div});
  });
  (db.hareketler||[]).filter(h=>h.cariId===id).forEach(h=>{
    const isTah=h.tip==='tahsilat';
    if(h.tutar>0)evs.push({t:h.tarih,ad:isTah?'Tahsilat':'Ödeme',det:h.tur||'',[isMus===isTah?'alacak':'borc']:h.tutar});
    if(h.kesik>0)evs.push({t:h.tarih+1,ad:'Kesik',det:'müşteri kırdı',alacak:h.kesik});
  });
  evs.sort((a,b)=>a.t-b.t);
  const net=evs.reduce((a,e)=>a+(e.borc||0)-(e.alacak||0),0);
  const devir=(c.bakiye||0)-net;
  return {evs,devir};
}

function rKasa(){

  const giren=(db.hareketler||[]).filter(x=>x.yon==='in'&&new Date(x.tarih).toDateString()===bugun).reduce((a,x)=>a+x.tutar,0);
  const cikan=(db.hareketler||[]).filter(x=>x.yon==='out'&&new Date(x.tarih).toDateString()===bugun).reduce((a,x)=>a+x.tutar,0);
  const nakit=hesapTurToplam('nakit'),banka=hesapTurToplam('banka'),pos=hesapTurToplam('pos');
  const now=new Date(),ay=now.getMonth(),yil=now.getFullYear();
  const buAy=x=>{const d=new Date(x.tarih);return d.getMonth()===ay&&d.getFullYear()===yil};
  const ayGiren=(db.hareketler||[]).filter(x=>x.yon==='in'&&buAy(x)).reduce((a,x)=>a+x.tutar,0);
  const ayCikan=(db.hareketler||[]).filter(x=>x.yon==='out'&&buAy(x)).reduce((a,x)=>a+x.tutar,0);
  const giderGrup={};(db.hareketler||[]).filter(x=>x.yon==='out'&&buAy(x)&&(x.tur==='Gider'||x.tur==='Ortak Harcama'||x.tur==='odeme')).forEach(x=>{const k=x.tur==='Ortak Harcama'?'Ortak Harcama':x.tur==='odeme'?'Fason/Tedarik':((x.aciklama||'Diğer').split('·')[0].trim()||'Diğer');giderGrup[k]=(giderGrup[k]||0)+x.tutar});
  const topGider=Object.entries(giderGrup).sort((a,b)=>b[1]-a[1]).slice(0,5);
  let html=`<div class="tiles"><div class="tile b1" style="grid-column:1/-1"><div class="l">Toplam Elimizde (likit)</div><div class="v">${TL(toplam)}</div><div class="em">🏦</div><div style="font-size:11px;opacity:.9;margin-top:4px">💵 Nakit ${TL(nakit)} · 🏦 Banka ${TL(banka)}${pos?' · POS '+TL(pos):''} · vadeli çek +${TL(bekleyenCek)}</div></div></div>
    <div class="g2"><div class="card" style="padding:11px;margin:0;text-align:center"><div class="mini">Bugün Giren</div><div style="font-weight:800;font-size:17px;color:var(--good)">+${TL(giren)}</div></div><div class="card" style="padding:11px;margin:0;text-align:center"><div class="mini">Bugün Çıkan</div><div style="font-weight:800;font-size:17px;color:var(--bad)">−${TL(cikan)}</div></div></div>
    <div class="g2" style="margin-top:10px"><button class="btn sm" onclick="formTransfer()">⇄ Transfer</button><button class="btn ghost sm" onclick="formKasaHareket()">➕ Gelir / Gider</button></div>
    <div class="sec">Bu Ay Nakit Akışı</div><div class="card" style="padding:12px 13px">
      <div style="display:flex;gap:8px;text-align:center"><div style="flex:1"><div class="mini">Giren</div><div style="font-weight:800;color:var(--good)">+${TL(ayGiren)}</div></div><div style="flex:1"><div class="mini">Çıkan</div><div style="font-weight:800;color:var(--bad)">−${TL(ayCikan)}</div></div><div style="flex:1"><div class="mini">Net</div><div style="font-weight:800;color:${ayGiren-ayCikan>=0?'var(--good)':'var(--bad)'}">${ayGiren-ayCikan>=0?'+':'−'}${TL(Math.abs(ayGiren-ayCikan))}</div></div></div>
      ${topGider.length?`<div class="mini" style="margin:10px 0 4px;font-weight:700">En çok gider:</div>`+topGider.map(([k,v])=>{const pct=ayCikan?Math.round(v/ayCikan*100):0;return `<div style="margin-top:5px"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(k)}</span><b>${TL(v)}</b></div><div style="height:6px;border-radius:5px;background:var(--ln2);overflow:hidden;margin-top:2px"><i style="display:block;height:100%;width:${pct}%;background:var(--bad)"></i></div></div>`}).join(''):''}
    </div>
    <div class="sec">Hesaplar <a onclick="formHesap()">+ Hesap</a></div><div class="card">`+db.hesaplar.map(h=>`<div class="row" onclick="hesapDetay(${h.id})"><div class="av" style="background:${h.tur==='nakit'?'var(--good)':h.tur==='pos'?'var(--thr)':'var(--ind)'}">${h.tur==='nakit'?'💵':h.tur==='pos'?'💳':'🏦'}</div><div class="mid"><div class="t">${esc(h.ad)}</div><div class="s">${h.tur}</div></div><div class="end"><div class="n ${h.bakiye<0?'neg':''}">${TL(h.bakiye)}</div></div></div>`).join('')+`</div>`;
  html+=`<div class="sec">Ortak Harcamaları</div><div class="card">`+(()=>{const grp={};db.ortakHarcama.forEach(o=>grp[o.ortak]=(grp[o.ortak]||0)+o.tutar);return Object.keys(grp).length?Object.keys(grp).map(k=>`<div class="row"><div class="av p">⚖️</div><div class="mid"><div class="t">${esc(k)}</div><div class="s">çektiği toplam</div></div><div class="end"><div class="n neg">${TL(grp[k])}</div></div></div>`).join(''):emp('⚖️','Kayıt yok')})()+`</div>
    <div style="margin-top:12px"><button class="btn ghost sm" onclick="formHarcama()">➕ Ortak Harcaması Ekle</button></div>`;
  html+=`<div class="sec">Nakit Takvimi (yaklaşan)</div><div class="card">`+takvimList()+`</div>`;
  $('app').innerHTML=html;
}

  const c=db.cekler.find(x=>x.id===id);
  if(c.durum!=='portfoyde')return open_('Çek',`<div class="kv"><span class="k">Kişi</span><span class="v">${esc(c.cari)}</span></div><div class="kv"><span class="k">Tutar</span><span class="v">${TL(c.tutar)}</span></div><div class="kv"><span class="k">Vade</span><span class="v">${dstr(c.vade)}</span></div><div class="kv"><span class="k">Durum</span><span class="v">${c.durum}</span></div>`);

function cekTahsil(id){
  const c=db.cekler.find(x=>x.id===id);
  if(c.tip==='alinan'){c.durum='tahsil';const h=db.hesaplar[0];if(h)h.bakiye+=c.tutar;toast('Tahsil edildi ✓ '+TL(c.tutar))}
  else{ // verilen - B yöntemi kur farkı
    const h=db.hesaplar.find(x=>x.tur==='banka')||db.hesaplar[0];
    if(h&&h.bakiye<c.tutar-0.001)return toast('⚠️ '+h.ad+' bakiyesi yetersiz. Çek ödenemez (hesap eksiye düşemez).');
    c.durum='tahsil';if(h)h.bakiye-=c.tutar;
    if(c.verilisKur){const su=c.tutar/db.kurUSD, il=c.tutar/c.verilisKur;const fark=il-su;const cc=cari(c.cariId);

      else toast('Ödendi ✓')}
    else toast('Ödendi ✓');
  }
  save();closeM();rCek();

function ieFasonMaliyet(i){const c=ieCarpan(i);return (i.duraklar||[]).reduce((a,d)=>a+(+d.ucret||0)*(+d.gelen||0)*c,0)}
function ieGenelGider(i){return (+i.genelGiderBirim||0)*ieSaglam(i)*ieCarpan(i)}
function ieAdet(i,seri){return (seri==null?ieSaglam(i):seri)*ieCarpan(i)}
function ieToplamMaliyet(i){return ieMalMaliyet(i)+ieFasonMaliyet(i)+ieGenelGider(i)}
const RENK_LISTE=['Siyah','Beyaz','Lacivert','Gri','Bej','Bordo','Antrasit','Yeşil','Hardal','Mor','Kırmızı','Mavi','Kahverengi','Sarı','Pembe','Turuncu','Füme','Ekru','Haki','Vizon'];
function ieSaglam(i){const ds=i.duraklar||[];for(let k=ds.length-1;k>=0;k--)if((+ds[k].gelen||0)>0)return +ds[k].gelen;return 0}
function ieBirimMaliyet(i){const s=ieSaglam(i);return s>0?ieToplamMaliyet(i)/s:0}
function ieDefo(i){return (i.duraklar||[]).reduce((a,d)=>a+(+d.defolu||0),0)}
function ieAktifDurak(i){return (i.duraklar||[]).find(d=>d.durum==='devam')||(i.duraklar||[]).find(d=>d.durum==='bekliyor')}
function durakYolda(d){return Math.max(0,(+d.gonderilen||0)-(+d.gelen||0)-(+d.defolu||0))}
function ieFasondaki(i){return (i.duraklar||[]).filter(d=>d.durum==='devam'&&d.fasonId&&(+d.gonderilen||0)>0)}
function ieGecikme(i){return Math.floor((Date.now()-(i.baslangic+(i.gun||0)*86400000))/86400000)}
function ieBorcGuncelle(d){if(!d.fasonId)return;
  if(d.borclanan==null)d.borclanan=d.borclandi?Math.round((+d.ucret||0)*(+d.gelen||0)):0;
  const target=Math.round((+d.ucret||0)*(+d.gelen||0));const delta=target-(+d.borclanan||0);
  if(delta!==0){const f=cari(d.fasonId);if(f)f.bakiye=(f.bakiye||0)+delta;d.borclanan=target;d.borclandi=target>0}
}
const DURAK_IC={'Kesim':'✂️','Nakış':'🎨','Baskı':'🖨️','Dikim':'🧵','Ütü / Paket':'👔'};
function fasonKarne(fid){let is=0,adet=0,defo=0,gunTop=0,gunN=0,acikIs=0,acikAdet=0;
  db.isemirleri.forEach(i=>{(i.duraklar||[]).forEach(d=>{if(d.fasonId!==fid)return;
    const yap=(+d.gelen||0)+(+d.defolu||0);
    if(d.durum==='devam'&&durakYolda(d)>0){acikIs++;acikAdet+=durakYolda(d)}
    if(yap>0){is++;adet+=+d.gelen||0;defo+=+d.defolu||0;
      if(d.baslama&&d.teslimatlar&&d.teslimatlar.length){const son=d.teslimatlar[d.teslimatlar.length-1].tarih;const g=Math.round((son-d.baslama)/86400000);if(g>=0){gunTop+=g;gunN++}}}
  })});
  const firePct=(adet+defo)>0?Math.round(defo/(adet+defo)*100):0;
  return {is,adet,defo,firePct,ortGun:gunN?Math.round(gunTop/gunN):null,acikIs,acikAdet};
}

  open_('📊 Fason Karnesi',`<div class="mini">İş sayısı, fire oranı ve ortalama teslim süresine göre. Düşük fire + hızlı = iyi fason.</div>`+

    }).join(''):emp('🧵','Fason firma yok. Cari › Fason\'dan ekle.')));
}

function uretimListe(tur){
  const aktif=db.isemirleri.filter(i=>i.durum!=='tamam');let title,items=[];
  if(tur==='fasonda'||tur==='firma'){const wip=[];aktif.forEach(i=>ieFasondaki(i).forEach(d=>wip.push({i,d})));
    title=tur==='firma'?'🏭 Firmadaki Mallar':'🧵 Fasondaki Mallar';
    items=wip.map(({i,d})=>({id:i.id,ic:DURAK_IC[d.ad]||'🏭',t:(fasonAd(d)||'firma yok')+' · '+d.ad,s:i.urun+' · '+durakYolda(d)+' '+(i.birim||'ad')+' fasonda'}));
  }else if(tur==='geciken'){title='⏱️ Geciken İşler';
    items=aktif.filter(i=>ieGecikme(i)>0).sort((a,b)=>ieGecikme(b)-ieGecikme(a)).map(i=>{const ad=ieAktifDurak(i);return {id:i.id,ic:'⏱️',t:'#'+i.id+' · '+i.urun,s:ieGecikme(i)+' gün geç · '+(ad?ad.ad+(fasonAd(ad)?' ('+fasonAd(ad)+')':''):'')}});
  }else{title='📋 Aktif İş Emirleri';
    items=aktif.map(i=>{const ad=ieAktifDurak(i);return {id:i.id,ic:'📋',t:'#'+i.id+' · '+i.urun,s:(ad?ad.ad:'—')+' · '+ieSaglam(i)+'/'+i.hedef+' '+(i.birim||'ad')}});}
  open_(title,items.length?items.map(m=>`<div class="row" onclick="closeM();setTimeout(()=>uretimDetay(${m.id}),120)"><div class="av gray">${m.ic}</div><div class="mid"><div class="t">${esc(m.t)}</div><div class="s">${esc(m.s)}</div></div><span style="color:var(--sub)">›</span></div>`).join(''):emp('✅','Kayıt yok'));
}

function msHesap(){const g=id=>+($(id)?.value||0);
  const adet=g('ms-adet')||1,fire=g('ms-fire'),saglam=Math.max(1,Math.round(adet*(1-fire/100)));
  const fasonBirim=g('ms-kes')+g('ms-nak')+g('ms-dik')+g('ms-utu');
  const toplam=g('ms-mal')+fasonBirim*adet+g('ms-gg')*adet;
  const birim=toplam/saglam;const kar=g('ms-kar');const satis=birim*(1+kar/100);const hazir=g('ms-hazir');
  const el=$('ms-sonuc');if(!el)return;let cmp='';
  if(hazir>0){const fark=hazir-birim;cmp=fark>=0?`<div class="okbox" style="margin-top:8px">✅ Üretim <b>${TL(fark)}/adet</b> daha ucuz (${TL(birim)} vs hazır ${TL(hazir)}) — <b>üretmek mantıklı</b>.</div>`:`<div class="warnbox" style="margin-top:8px">⚠️ Hazır alım <b>${TL(-fark)}/adet</b> daha ucuz (${TL(hazir)} vs üretim ${TL(birim)}) — <b>almak mantıklı</b>.</div>`;}
  el.innerHTML=`<div class="total"><div><div class="l">Net Birim Maliyet</div><div class="v">${TL(birim)}</div></div><div style="text-align:right"><div class="l">Önerilen Satış +%${kar}</div><div class="v pos">${TL(satis)}</div></div></div>
    <div class="card" style="margin-top:8px;padding:4px 13px"><div class="kv"><span class="k">Toplam maliyet</span><span class="v">${TL(toplam)}</span></div><div class="kv"><span class="k">Sağlam adet (fire sonrası)</span><span class="v">${saglam} / ${adet}</span></div><div class="kv"><span class="k">Fason işçilik / adet</span><span class="v">${TL(fasonBirim)}</span></div></div>${cmp}`;
}

function ieToplam(){return ieRenk.reduce((a,r)=>a+(+r.adet||0),0)}
function ieToplamCiz(){const el=$('ie-toplam-box');if(!el)return;const t=ieToplam();const seri=$('ie-birim')?.value==='seri';const sa=Math.max(1,+($('ie-seriadet')?.value||1));
  el.innerHTML=t>0?`<span>📦 Toplam Üretim</span><b>${t} ${seri?'seri':'adet'}${seri&&sa>1?' = '+(t*sa)+' adet':''}</b>`:`<span style="color:var(--sub)">Renk adedi gir — toplam burada çıkacak</span>`;
}
function ieUrunAra(){const ad=($('ie-ad')?.value||'').trim().toLowerCase();const u=db.urunler.find(x=>!x.pasif&&x.ad.toLowerCase()===ad);
  if(u&&u.id!==ieUrunId){ieUrunId=u.id;if($('ie-kod'))$('ie-kod').value=u.kod||'';if($('ie-birim'))$('ie-birim').value=u.birim||'seri';
    if($('ie-seriadet')&&u.birim==='seri')$('ie-seriadet').value=u.seri||6;
    ieFoto=urunKapak(u)||ieFoto;ieRenk=renkObjs(u).map(r=>({ad:r.ad,adet:0}));cizIeRenk();cizIeFoto();ieKodKontrol();ieToplamCiz();}
  else if(!u&&ieUrunId){ieUrunId=0;ieKodKontrol();}
}
function ieKodKontrol(){const el=$('ie-kod-uyari');if(!el)return;const kod=($('ie-kod')?.value||'').trim();
  if(ieUrunId){el.innerHTML='<span style="color:var(--sub)">Mevcut ürüne üretim — kod sabit</span>';return}
  if(!kod){el.innerHTML='';return}
  const cak=db.urunler.find(u=>u.kod&&u.kod.toLowerCase()===kod.toLowerCase());
  el.innerHTML=cak?`<span style="color:var(--bad)">⚠️ "${esc(kod)}" kodu zaten var (${esc(cak.ad)}) — başka kod gir</span>`:`<span style="color:var(--good)">✓ Kod uygun</span>`;
}
function cizIeFoto(){const b=$('ie-foto-box');if(!b)return;
  b.innerHTML=`<div class="satfoto" onclick="$('ie-foto-in').click()">${ieFoto?`<img src="${ieFoto}"><span class="rm" onclick="event.stopPropagation();ieFoto='';cizIeFoto()">✕</span>`:'<span class="ph">📷 Numune / ürün fotoğrafı</span>'}</div><input type="file" id="ie-foto-in" accept="image/*" capture="environment" style="display:none" onchange="ieFotoSec(this)">`;
}
function ieFotoSec(input){const f=input.files&&input.files[0];if(!f)return;resizeImg(f,d=>{ieFoto=d;cizIeFoto()},1200,0.75)}
function ieDurakFiyat(x){const fid=+($('dkfas-'+x)?.value||0);const uc=$('dkuc-'+x);if(!fid||!uc)return;const f=cari(fid);const s=ISTASYON[x];
  if(f&&f.fiyatlar&&f.fiyatlar[s])uc.value=f.fiyatlar[s];}
function ieKesimFiyat(){const fid=+($('dk-kesim-fas')?.value||0);const uc=$('dk-kesim-uc');if(!fid||!uc)return;const f=cari(fid);if(f&&f.fiyatlar&&f.fiyatlar['Kesim'])uc.value=f.fiyatlar['Kesim'];}
/* --- Sonraki durak ekle (dinamik pipeline) --- */
function formDurakEkle(id){const i=db.isemirleri.find(v=>v.id===id);if(!i||i.durum==='tamam')return;const fs=fasonlar();
  const secenek=ISTASYON.filter(s=>s!=='Kesim');
  open_('➕ Sonraki Durak Ekle · #'+id,`
    <div class="mini">Mal şimdi nereye gidiyor? İşlemi seç, fasonu ve ücreti gir. Önceki duraktan çıkan mal buraya akar.</div>
    <label>İşlem</label><select id="de-islem" onchange="deFiyat()">${secenek.map(s=>`<option>${s}</option>`).join('')}<option value="__x">Diğer (yaz)</option></select>
    <input id="de-ozel" placeholder="işlem adı" style="display:none;margin-top:6px">
    <div class="g2"><div><label>Fason firma</label><select id="de-fas" onchange="deFiyat()"><option value="0">— seç / dışarı —</option>${fs.map(f=>`<option value="${f.id}">${esc(f.ad)}</option>`).join('')}</select></div><div><label>₺ / adet</label><input id="de-uc" type="number" inputmode="numeric" placeholder="0"></div></div>
    <button class="btn" onclick="durakEkleKaydet(${id})">Durağı Ekle</button>`);
  const sel=$('de-islem');if(sel)sel.onchange=function(){$('de-ozel').style.display=this.value==='__x'?'block':'none';deFiyat()};
}
function deFiyat(){const fid=+($('de-fas')?.value||0);const uc=$('de-uc');const op=$('de-islem')?.value;if(!fid||!uc||op==='__x')return;const f=cari(fid);if(f&&f.fiyatlar&&f.fiyatlar[op]&&!uc.value)uc.value=f.fiyatlar[op];}
function durakEkleKaydet(id){const i=db.isemirleri.find(v=>v.id===id);const op=$('de-islem').value;const ad=op==='__x'?($('de-ozel').value||'').trim():op;
  if(!ad)return toast('İşlem adı gir');
  const yeni={ad,fasonId:+($('de-fas').value||0)||null,ucret:+($('de-uc').value||0)||0,gonderilen:0,gelen:0,defolu:0,gonderilenRenk:{},renkGelen:{},renkDefo:{},durum:'bekliyor',borclandi:false,borclanan:0,foto:'',not:''};
  const prev=i.duraklar[i.duraklar.length-1];i.duraklar.push(yeni);
  if(prev&&prev.durum==='tamam'){yeni.gonderilenRenk={...prev.renkGelen};yeni.gonderilen=prev.gelen;yeni.durum='devam';yeni.baslama=Date.now()}
  save();closeM();uretimDetay(id);toast(ad+' durağı eklendi ✓');
}
function ieRenkEkle(){ieRenk.push({ad:'',adet:0});cizIeRenk();ieToplamCiz()}
function ieRenkSil(i){ieRenk.splice(i,1);cizIeRenk();ieToplamCiz()}
function ieRenkSet(i,k,v){const r=ieRenk[i];if(!r)return;if(k==='adet'){r.adet=+v||0;ieToplamCiz()}else{r.ad=v;const sw=document.querySelector('#ie-renk .rrow[data-i="'+i+'"] .sw');if(sw)sw.style.background=hexFromAd(v)||'#ccc'}}
function cizIeRenk(){const b=$('ie-renk');if(!b)return;
  b.innerHTML=ieRenk.length?`<div class="card" style="padding:6px 12px">`+ieRenk.map((r,i)=>`<div class="syrow rrow" data-i="${i}"><span class="sw sm" style="background:${hexFromAd(r.ad)||'#ccc'}"></span><input list="ie-renk-dl" value="${esc(r.ad||'')}" placeholder="renk" oninput="ieRenkSet(${i},'ad',this.value)" style="flex:1;margin:0;padding:8px"><input type="number" inputmode="numeric" value="${r.adet||''}" placeholder="adet" oninput="ieRenkSet(${i},'adet',this.value)" class="syin" style="width:78px">${ieRenk.length?`<button class="del" onclick="ieRenkSil(${i})">✕</button>`:''}</div>`).join('')+`</div>`:'<div class="mini">İstersen "+ renk" ile renk dağılımı gir. Boş bırakırsan tek parça gider.</div>';
}
function ieMalEkle(){ieMal.push({ad:'',mik:0,birim:'kg',tutar:0,pb:'TL',durum:'var'});cizIeMal()}
function ieMalSil(i){ieMal.splice(i,1);cizIeMal()}
function ieMalHint(i){const m=ieMal[i];const row=document.querySelector('#ie-mal .mrow[data-i="'+i+'"]');if(!row||!m)return;
  const ad=(m.ad||'').trim();const h=db.hammadde.find(x=>x.ad.toLowerCase()===ad.toLowerCase());
  if(h)m.birim=h.birim;const bl=row.querySelector('.mbir');if(bl)bl.textContent=m.birim?'('+esc(m.birim)+')':'';
  const hint=row.querySelector('.mrowhint');if(hint)hint.innerHTML=!ad?'':h?'<span class="mini" style="color:var(--good)">✓ stokta kayıtlı</span>':`<a onclick="ieMalStokEkle(${i})" style="font-size:12px;color:var(--ind2);font-weight:800">＋ "${esc(ad)}" stoğa tanımla</a>`;
}
function ieMalSet(i,k,v){const m=ieMal[i];if(!m)return;if(k==='mik'||k==='tutar')m[k]=+v||0;else m[k]=v;
  if(k==='ad')ieMalHint(i);
  if(k==='birim'||k==='pb')cizIeMal();
}
function ieMalStokEkle(i){const m=ieMal[i];if(!m||!(m.ad||'').trim())return;const ad=m.ad.trim();
  if(db.hammadde.some(h=>h.ad.toLowerCase()===ad.toLowerCase()))return toast('Zaten kayıtlı');
  db.hammadde.push({id:nid('h'),ad,detay:'',kat:'Kumaş',birim:m.birim||'kg',stok:+m.mik||0,kritik:0,alis:(m.tutar&&m.mik)?Math.round(m.tutar*(m.pb==='USD'?db.kurUSD:1)/m.mik):0});
  m.durum='var';save();
  const dl=$('ie-ham-dl');if(dl)dl.innerHTML=db.hammadde.map(x=>`<option value="${esc(x.ad)}">`).join('');
  cizIeMal();toast(ad+' stoğa tanımlandı ✓');
}
function cizIeMal(){const b=$('ie-mal');if(!b)return;
  b.innerHTML=ieMal.length?ieMal.map((m,i)=>{const ad=(m.ad||'').trim();const h=db.hammadde.find(x=>x.ad.toLowerCase()===ad.toLowerCase());
   return `<div class="card mrow" data-i="${i}" style="padding:8px 10px;margin-bottom:6px">
    <div style="display:flex;gap:6px;align-items:center"><input list="ie-ham-dl" value="${esc(m.ad||'')}" placeholder="Kumaş / aksesuar adı yaz..." oninput="ieMalSet(${i},'ad',this.value)" style="flex:1;margin:0;padding:9px"><button class="del" onclick="ieMalSil(${i})">✕</button></div>
    <div class="mrowhint" style="margin-top:4px;min-height:15px">${!ad?'':h?'<span class="mini" style="color:var(--good)">✓ stokta kayıtlı</span>':`<a onclick="ieMalStokEkle(${i})" style="font-size:12px;color:var(--ind2);font-weight:800">＋ "${esc(ad)}" stoğa tanımla</a>`}</div>
    <div class="g2" style="margin-top:2px"><div><label style="margin-top:0">Miktar</label><input type="number" inputmode="numeric" value="${m.mik||''}" oninput="ieMalSet(${i},'mik',this.value)"></div><div><label style="margin-top:0">Birim</label><select onchange="ieMalSet(${i},'birim',this.value)">${MAL_BIRIM.map(u=>`<option ${(m.birim||'kg')===u?'selected':''}>${u}</option>`).join('')}</select></div></div>
    <div class="g2" style="margin-top:6px"><div><label style="margin-top:0">Tutar</label><input type="number" inputmode="numeric" value="${m.tutar||''}" oninput="ieMalSet(${i},'tutar',this.value)"></div><div><label style="margin-top:0">Döviz</label><select onchange="ieMalSet(${i},'pb',this.value)">${['TL','USD','EUR'].map(x=>`<option ${(m.pb||'TL')===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    ${(m.pb==='USD'||m.pb==='EUR')&&m.tutar?`<div class="mini" style="margin-top:3px;color:var(--ind2)">≈ ${TL(m.tutar*(m.pb==='USD'?db.kurUSD:db.kurEUR))} (kur ${(m.pb==='USD'?db.kurUSD:db.kurEUR).toFixed(2)})</div>`:''}
    <label class="ckrow" style="margin:8px 0 0"><input type="checkbox" ${m.durum==='alinacak'?'checked':''} onchange="ieMalSet(${i},'durum',this.checked?'alinacak':'var')"><span>🛒 Bu malzeme alınacak (elimde yok)</span></label>
  </div>`}).join(''):'<div class="mini">Kumaş/malzeme eklemek için "+ malzeme".</div>';
}
function kaydetIsEmri(){
  const ad=($('ie-ad').value||'').trim();if(!ad)return toast('Ürün adı gir');
  const kod=($('ie-kod').value||'').trim();
  if(!ieUrunId){if(!kod)return toast('Ürün kodu gir');
    if(db.urunler.some(u=>u.kod&&u.kod.toLowerCase()===kod.toLowerCase()))return toast('Bu kod zaten kullanılıyor — başka kod gir');}
  const renkDagilim=ieRenk.filter(r=>(r.ad||'').trim()&&r.adet>0).map(r=>({ad:r.ad.trim(),adet:r.adet}));
  if(!renkDagilim.length)return toast('En az bir renk ve adet gir (toplam buradan hesaplanır)');
  const hedef=renkDagilim.reduce((a,r)=>a+r.adet,0);
  const gun=+$('ie-gun').value||15;const birim=$('ie-birim').value||'seri';
  const renkMap={};renkDagilim.forEach(r=>renkMap[r.ad]=r.adet);
  // sadece Kesim ile başla — sonraki duraklar üretim ilerledikçe eklenir
  const duraklar=[{ad:'Kesim',fasonId:+($('dk-kesim-fas')?.value||0)||null,ucret:+($('dk-kesim-uc')?.value||0)||0,gonderilen:hedef,gelen:0,defolu:0,gonderilenRenk:{...renkMap},renkGelen:{},renkDefo:{},durum:'devam',borclandi:false,borclanan:0,baslama:Date.now(),foto:'',not:''}];
  const malzeme=ieMal.filter(m=>(m.ad||'').trim()).map(m=>{const h=db.hammadde.find(x=>x.ad.toLowerCase()===m.ad.trim().toLowerCase());return {ad:m.ad.trim(),mik:+m.mik||0,birim:m.birim||(h?h.birim:'kg'),tutar:+m.tutar||0,pb:m.pb||'TL',durum:m.durum||'var',hid:h?h.id:null}});
  malzeme.forEach(m=>{if(m.durum==='var'&&m.hid){const h=db.hammadde.find(x=>x.id===m.hid);if(h)h.stok=Math.max(0,h.stok-m.mik)}});
  const seriAdet=birim==='seri'?Math.max(1,+$('ie-seriadet').value||1):1;
  db.isemirleri.push({id:nid('ie'),urunId:ieUrunId||null,urun:ad,kod,foto:ieFoto,birim,seriAdet,hedef,renkDagilim,malzeme,duraklar,genelGiderBirim:+$('ie-gg').value||0,baslangic:Date.now(),gun,durum:'devam',stoklandi:false});
  save();closeM();rUretim();toast('İş emri açıldı ✓ · '+hedef+' '+birim);
}
/* --- İş emri detay --- */
function uretimDetay(id){
  const i=db.isemirleri.find(x=>x.id===id);if(!i)return;
  const kar=karGoster();const saglam=ieSaglam(i);const birim=ieBirimMaliyet(i);
  const durIc={tamam:'✅',devam:'🔵',bekliyor:'⬜'};
  let html=`<div class="card" style="padding:14px"><div style="display:flex;gap:12px">
      ${i.foto?`<img src="${i.foto}" style="width:64px;height:64px;border-radius:10px;object-fit:cover;flex:0 0 auto">`:''}
      <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="font-weight:800;font-size:16px">${esc(i.urun)}${i.urunId?'':' <span class="pill low" style="vertical-align:middle">numune</span>'}</div><span class="pill ${i.durum==='tamam'?'ok':'low'}">${i.durum==='tamam'?'Tamam':'Devam'}</span></div>
      <div class="mini" style="margin-top:2px">${esc(i.kod||'')} · başladı ${dstr(i.baslangic)} · hedef ${i.hedef} ${esc(i.birim||'adet')}${i.birim==='seri'&&ieCarpan(i)>1?' ('+(i.hedef*ieCarpan(i))+' adet)':''}</div></div></div>
    ${i.renkDagilim&&i.renkDagilim.length?`<div class="mini" style="margin-top:8px">🎨 ${i.renkDagilim.map(r=>esc(r.ad)+' '+r.adet).join(' · ')}</div>`:''}</div>
    <div class="g2" style="margin-top:10px"><button class="btn ghost sm" onclick="isEmriA4(${id})">📄 İş Emri Formu (A4)</button><button class="btn g sm" onclick="isEmriPaylas(${id})">📤 Fasona Gönder</button></div>`;
  if(kar){const gg=ieGenelGider(i);html+=`<div class="total" style="margin-top:12px"><div><div class="l">Toplam Maliyet</div><div class="v">${TL(ieToplamMaliyet(i))}</div></div><div style="text-align:right"><div class="l">Birim Maliyet</div><div class="v pos">${birim?TL(birim):'—'} ${birim?'/'+esc(i.birim||'ad'):''}</div></div></div>
    <div class="card" style="margin-top:8px;padding:4px 13px">
      <div class="kv"><span class="k">🧵 Malzeme / Kumaş</span><span class="v">${TL(ieMalMaliyet(i))}</span></div>
      <div class="kv"><span class="k">✂️ Fason işçilik${i.birim==='seri'&&ieCarpan(i)>1?' (adet başı)':''}</span><span class="v">${TL(ieFasonMaliyet(i))}</span></div>
      ${i.genelGiderBirim?`<div class="kv"><span class="k">⚙️ Genel gider (₺${i.genelGiderBirim}/ad)</span><span class="v">${TL(gg)}</span></div>`:''}
      <div class="kv"><span class="k">📦 Tamamlanan (sağlam)</span><span class="v">${saglam} / ${i.hedef} ${esc(i.birim||'')}${i.birim==='seri'&&ieCarpan(i)>1?' ('+ieAdet(i)+' adet)':''}</span></div>
      <div class="kv"><span class="k">🔥 Toplam defo/fire</span><span class="v" style="color:var(--bad)">${ieDefo(i)}</span></div>
    </div>`;}
  html+=`<div class="sec">Üretim Hattı</div><div class="card" style="padding:2px 14px">`;
  i.duraklar.forEach((d,x)=>{const tutar=(+d.ucret||0)*(+d.gelen||0);const fad=fasonAd(d);
    html+=`<div style="display:flex;gap:12px;padding:12px 0;${x<i.duraklar.length-1?'border-bottom:1px solid var(--ln)':''}">
      <div style="flex:0 0 auto;font-size:22px;line-height:1">${durIc[d.durum]||'⬜'}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14.5px">${x+1}. ${esc(d.ad)}</b>${kar&&tutar?`<span class="mini" style="font-weight:800;color:var(--ink)">${TL(tutar)}</span>`:''}</div>
        <div class="mini" style="margin-top:2px">${fad?esc(fad):'<span style="color:var(--sub)">fason atanmadı</span>'}${d.gonderilen?` · ${d.gonderilen} gönderildi → ${d.gelen} geldi${d.defolu?' · '+d.defolu+' defo':''}`:''}${d.ucret?` · ₺${d.ucret}/ad`:''}</div>
        ${(d.renkGelen&&Object.keys(d.renkGelen).length)?`<div class="mini" style="margin-top:2px">🎨 ${Object.keys(durakGonderRenk(i,x)).map(c=>esc(c)+' '+(d.renkGelen[c]||0)+'/'+(durakGonderRenk(i,x)[c]||0)).join(' · ')}</div>`:''}
        ${durakYolda(d)>0&&d.durum==='devam'?`<div class="mini" style="margin-top:2px;color:var(--thr);font-weight:700">📍 ${durakYolda(d)} ${esc(i.birim||'ad')} hâlâ fasonda</div>`:''}
        ${d.defolu>0&&d.eksikNeden?`<div class="mini" style="margin-top:2px;color:var(--bad)">⚠️ ${d.defolu} defo · neden: ${esc(d.eksikNeden)}</div>`:''}
        ${d.teslimatlar&&d.teslimatlar.length>1?`<div class="mini" style="margin-top:2px">Teslimatlar: ${d.teslimatlar.map(t=>t.adet+(t.defo?'/-'+t.defo:'')+' ('+dstr(t.tarih)+')').join(' · ')}</div>`:''}
        ${d.not?`<div class="mini" style="margin-top:2px">📝 ${esc(d.not)}</div>`:''}
        ${d.foto?`<img src="${d.foto}" style="width:70px;height:70px;border-radius:8px;object-fit:cover;margin-top:6px">`:''}
        ${i.durum!=='tamam'?`<div style="display:flex;gap:7px;margin-top:7px;flex-wrap:wrap">${d.durum==='devam'?`<button class="btn g sm" style="width:auto;padding:7px 13px;margin:0" onclick="durakTeslimAl(${id},${x})">📥 Teslim Al</button>`:''}<button class="btn ghost sm" style="width:auto;padding:7px 12px;margin:0" onclick="durakGuncelle(${id},${x})">${d.gonderilen?'Düzenle':'Fason / Ücret'}</button>${fad?`<button class="btn ghost sm" style="width:auto;padding:7px 12px;margin:0" onclick="isEmriPaylas(${id},${x})">📤 Gönder</button>`:''}</div>`:''}
      </div></div>`;
  });
  html+=`</div>`;
  if(i.durum!=='tamam'){const sonD=i.duraklar[i.duraklar.length-1];const sonBitti=sonD&&sonD.durum==='tamam';
    html+=`<button class="btn ${sonBitti?'g':'ghost'} sm" style="margin-top:10px" onclick="formDurakEkle(${id})">➕ Sonraki Durak Ekle${sonBitti?' — mal '+ieSaglam(i)+' '+(i.birim||'ad')+' hazır, nereye?':' (dikim / nakış / baskı / ütü...)'}</button>`;}
  html+=`<div class="sec">Malzeme / Kumaş <a onclick="ieMalDuzenle(${id})">${i.durum==='tamam'?'':'+ ekle / düzenle'}</a></div><div class="card" style="padding:4px 13px">`+((i.malzeme&&i.malzeme.length)?i.malzeme.map(m=>`<div class="kv"><span class="k">${esc(m.ad)}${m.durum==='alinacak'?' <span class="pill low">🛒 alınacak</span>':''}</span><span class="v">${m.mik?m.mik.toLocaleString('tr-TR')+' '+esc(m.birim||''):''}${kar&&m.tutar?' · '+money(m.tutar,m.pb||'TL'):''}</span></div>`).join(''):'<div class="mini" style="padding:8px 0">Malzeme eklenmedi.</div>')+`</div>`;
  if(i.durum!=='tamam'){html+=`<button class="btn g" style="margin-top:14px" onclick="isEmriTamamla(${id})">📦 Tamamla → ${saglam||'?'} ${esc(i.birim||'adet')} stoğa al</button>`;}

function dagit(total,weights){const keys=Object.keys(weights);const sumW=keys.reduce((a,k)=>a+(weights[k]||0),0);const out={};
  if(total<=0)return out;if(sumW<=0){if(keys.length)out[keys[0]]=total;return out}
  let acc=0;keys.forEach((k,idx)=>{if(idx===keys.length-1)out[k]=Math.max(0,total-acc);else{const v=Math.round(total*(weights[k]||0)/sumW);out[k]=v;acc+=v}});return out;
}

function durakTeslimKaydet(id,x){
  const i=db.isemirleri.find(v=>v.id===id);const d=i.duraklar[x];const gr=durakGonderRenk(i,x);

      const di=el.parentElement.querySelector('input[id^="td-"]');const defo=Math.max(0,+((di&&di.value)||0));

    Object.keys(bd).forEach(c=>d.renkDefo[c]=(d.renkDefo[c]||0)+bd[c]);

let rapDonem='ay', rapTab='ozet';
