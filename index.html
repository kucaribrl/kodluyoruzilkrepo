<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a5f">
<title>Tekstil Toptan Yönetim</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1c2b3a; --muted:#6b7c8f;
    --brand:#1e3a5f; --brand2:#2d6cdf; --line:#e4e9f0;
    --ok:#1a9c62; --warn:#c9820a; --bad:#d1435b; --okbg:#e6f6ee; --badbg:#fdeaee;
    --shadow:0 1px 3px rgba(20,40,70,.08),0 6px 18px rgba(20,40,70,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:74px}
  h1,h2,h3{margin:0}
  header{background:linear-gradient(135deg,var(--brand),#274b78);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(20,40,70,.18)}
  header .brand{display:flex;align-items:center;gap:10px}
  header .logo{width:34px;height:34px;border-radius:9px;background:#fff2;display:flex;align-items:center;justify-content:center;font-size:19px}
  header h1{font-size:17px;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:11.5px;opacity:.8;margin-top:1px}
  main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat .val{font-size:20px;font-weight:800;margin-top:5px}
  .stat .val.small{font-size:16px}
  .stat.full{grid-column:1/-1}

  .sec-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px}
  .sec-title h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .av{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;background:var(--brand2)}
  .row .av.p{background:#7a4fd0}.row .av.g{background:#1a9c62}.row .av.o{background:#c9820a}
  .row .mid{flex:1;min-width:0}
  .row .mid .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mid .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .end{text-align:right;flex:0 0 auto}
  .row .end .n{font-weight:700;font-size:14.5px}
  .row .end .u{font-size:11.5px;color:var(--muted)}
  .pos{color:var(--ok)}.neg{color:var(--bad)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
  .pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.low{background:#fff3e0;color:var(--warn)}

  .empty{text-align:center;padding:34px 20px;color:var(--muted)}
  .empty .ico{font-size:38px;opacity:.5}
  .empty p{margin:10px 0 0;font-size:13.5px}

  .search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:var(--card);margin-bottom:12px;outline:none}
  .search:focus{border-color:var(--brand2)}

  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 14px rgba(20,40,70,.06)}
  nav button{flex:1;background:none;border:none;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button .ic{font-size:20px;line-height:1}
  nav button.on{color:var(--brand2)}

  .fab{position:fixed;right:16px;bottom:80px;width:56px;height:56px;border-radius:50%;background:var(--brand2);color:#fff;border:none;font-size:28px;box-shadow:0 6px 18px rgba(45,108,223,.45);z-index:25;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.94)}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet .hd{padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card)}
  .sheet .hd h3{font-size:16px}
  .sheet .hd button{background:#eef1f6;border:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted);cursor:pointer}
  .sheet .bd{padding:6px 18px 20px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font-size:15px;background:#fbfcfe;outline:none;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--brand2);background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--brand2);color:#fff;font-size:15px;font-weight:700;margin-top:18px;cursor:pointer}
  .btn:active{opacity:.9}
  .btn.ghost{background:#eef1f6;color:var(--brand)}
  .btn.danger{background:var(--badbg);color:var(--bad)}
  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .line-item{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
  .line-item .li-t{flex:1;font-size:13.5px}
  .li-del{background:var(--badbg);color:var(--bad);border:none;width:26px;height:26px;border-radius:8px;font-size:15px;cursor:pointer}
  .total-box{background:#f0f4fb;border-radius:12px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
  .total-box .tl{font-size:13px;color:var(--muted);font-weight:600}
  .total-box .tv{font-size:22px;font-weight:800;color:var(--brand)}
  .mini{font-size:12px;color:var(--muted);margin-top:4px}
  .tag{font-size:11px;background:#eef1f6;color:var(--muted);padding:2px 7px;border-radius:6px;font-weight:600;margin-left:6px}
  .toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#1c2b3a;color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.show{opacity:1;bottom:170px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">🧵</div>
    <div>
      <h1 id="firmName">Tekstil Toptan</h1>
      <div class="sub">Toptan Satış & Cari Takip</div>
    </div>
  </div>
</header>

<main>
  <!-- PANEL -->
  <section class="view active" id="v-panel">
    <div class="cards">
      <div class="stat"><div class="lbl">Toplam Alacak</div><div class="val pos" id="s-alacak">₺0</div></div>
      <div class="stat"><div class="lbl">Bugünkü Satış</div><div class="val" id="s-gunluk">₺0</div></div>
      <div class="stat"><div class="lbl">Müşteri Sayısı</div><div class="val small" id="s-musteri">0</div></div>
      <div class="stat"><div class="lbl">Stok Değeri</div><div class="val small" id="s-stok">₺0</div></div>
    </div>
    <div class="sec-title"><h2>Son Hareketler</h2></div>
    <div class="card" id="son-hareketler"></div>
    <div class="sec-title"><h2>Kritik Stok</h2></div>
    <div class="card" id="kritik-stok"></div>
  </section>

  <!-- MÜŞTERİLER -->
  <section class="view" id="v-musteri">
    <input class="search" id="ara-musteri" placeholder="🔍 Müşteri ara...">
    <div class="card" id="liste-musteri"></div>
  </section>

  <!-- ÜRÜNLER -->
  <section class="view" id="v-urun">
    <input class="search" id="ara-urun" placeholder="🔍 Ürün / kod ara...">
    <div class="card" id="liste-urun"></div>
  </section>

  <!-- SATIŞLAR -->
  <section class="view" id="v-satis">
    <div class="card" id="liste-satis"></div>
  </section>
</main>

<button class="fab" id="fab" onclick="fabAction()">+</button>

<nav>
  <button data-v="panel" class="on" onclick="go('panel')"><span class="ic">📊</span>Panel</button>
  <button data-v="musteri" onclick="go('musteri')"><span class="ic">👥</span>Müşteri</button>
  <button data-v="urun" onclick="go('urun')"><span class="ic">📦</span>Stok</button>
  <button data-v="satis" onclick="go('satis')"><span class="ic">🧾</span>Satış</button>
</nav>

<!-- MODAL -->
<div class="ov" id="ov"><div class="sheet"><div class="hd"><h3 id="m-title">Başlık</h3><button onclick="closeModal()">✕</button></div><div class="bd" id="m-body"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ VERİ KATMANI ============ */
const DB_KEY='tekstil_db_v1';
const seed={
  firma:'Tekstil Toptan',
  musteriler:[
    {id:1,ad:'Yılmaz Tekstil',tel:'0532 111 22 33',sehir:'İstanbul / Laleli',bakiye:12500},
    {id:2,ad:'Demir Kumaş',tel:'0533 444 55 66',sehir:'Bursa / İnegöl',bakiye:-3200},
    {id:3,ad:'Aksoy Konfeksiyon',tel:'0505 777 88 99',sehir:'İzmir / Kemeraltı',bakiye:8750},
  ],
  urunler:[
    {id:1,ad:'Pamuklu Süprem',kod:'SPR-001',renk:'Beyaz',birim:'kg',stok:340,alis:95,satis:135},
    {id:2,ad:'Likralı Kaşkorse',kod:'KSK-014',renk:'Siyah',birim:'kg',stok:28,alis:110,satis:160},
    {id:3,ad:'Gabardin Kumaş',kod:'GBR-220',renk:'Lacivert',birim:'metre',stok:1200,alis:48,satis:72},
    {id:4,ad:'Polar Kumaş',kod:'PLR-005',renk:'Gri',birim:'top',stok:15,alis:420,satis:590},
  ],
  satislar:[
    {id:1,musteriId:1,musteri:'Yılmaz Tekstil',tarih:Date.now()-86400000,kalemler:[{urun:'Pamuklu Süprem',mik:50,birim:'kg',fiyat:135}],tutar:6750,odenen:0},
  ],
  seq:{m:4,u:5,s:2}
};
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(DB_KEY));return d||JSON.parse(JSON.stringify(seed));}catch(e){return JSON.parse(JSON.stringify(seed));}}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function nid(k){return db.seq[k]++;}

/* ============ YARDIMCI ============ */
const TL=n=>'₺'+Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:2});
const $=id=>document.getElementById(id);
const init=s=>s.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function tarihStr(ts){const d=new Date(ts);return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});}

/* ============ NAVİGASYON ============ */
let cur='panel';
function go(v){cur=v;document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));$('v-'+v).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo(0,0);}

/* ============ RENDER ============ */
function render(){
  $('firmName').textContent=db.firma;
  if(cur==='panel')renderPanel();
  if(cur==='musteri')renderMusteri();
  if(cur==='urun')renderUrun();
  if(cur==='satis')renderSatis();
}
function renderPanel(){
  const alacak=db.musteriler.reduce((a,m)=>a+Math.max(0,m.bakiye),0);
  const bugun=new Date().setHours(0,0,0,0);
  const gunluk=db.satislar.filter(s=>s.tarih>=bugun).reduce((a,s)=>a+s.tutar,0);
  const stokDeger=db.urunler.reduce((a,u)=>a+u.stok*u.alis,0);
  $('s-alacak').textContent=TL(alacak);
  $('s-gunluk').textContent=TL(gunluk);
  $('s-musteri').textContent=db.musteriler.length;
  $('s-stok').textContent=TL(stokDeger);

  const sh=[...db.satislar].sort((a,b)=>b.tarih-a.tarih).slice(0,5);
  $('son-hareketler').innerHTML=sh.length?sh.map(s=>`
    <div class="row" onclick="satisDetay(${s.id})">
      <div class="av g">🧾</div>
      <div class="mid"><div class="t">${s.musteri}</div><div class="s">${tarihStr(s.tarih)} · ${s.kalemler.length} kalem</div></div>
      <div class="end"><div class="n">${TL(s.tutar)}</div><div class="u">${s.odenen>=s.tutar?'<span class="pill ok">Ödendi</span>':'<span class="pill bad">Açık</span>'}</div></div>
    </div>`).join(''):emptyBox('🧾','Henüz satış yok');

  const kritik=db.urunler.filter(u=>u.stok<=30);
  $('kritik-stok').innerHTML=kritik.length?kritik.map(u=>`
    <div class="row">
      <div class="av o">📦</div>
      <div class="mid"><div class="t">${u.ad}</div><div class="s">${u.kod} · ${u.renk}</div></div>
      <div class="end"><div class="n">${u.stok} ${u.birim}</div><div class="u"><span class="pill low">Az kaldı</span></div></div>
    </div>`).join(''):emptyBox('✅','Kritik stok yok');
}
function renderMusteri(){
  const q=($('ara-musteri').value||'').toLowerCase();
  const list=db.musteriler.filter(m=>m.ad.toLowerCase().includes(q)||(m.tel||'').includes(q));
  $('liste-musteri').innerHTML=list.length?list.map(m=>{
    const b=m.bakiye,cls=b>0?'neg':b<0?'pos':'',lbl=b>0?'Borçlu':b<0?'Alacaklı':'Kapalı';
    return `<div class="row" onclick="musteriDetay(${m.id})">
      <div class="av">${init(m.ad)}</div>
      <div class="mid"><div class="t">${m.ad}</div><div class="s">${m.sehir||''} ${m.tel?'· '+m.tel:''}</div></div>
      <div class="end"><div class="n ${cls}">${TL(Math.abs(b))}</div><div class="u">${lbl}</div></div>
    </div>`;}).join(''):emptyBox('👥','Müşteri bulunamadı');
}
function renderUrun(){
  const q=($('ara-urun').value||'').toLowerCase();
  const list=db.urunler.filter(u=>u.ad.toLowerCase().includes(q)||u.kod.toLowerCase().includes(q)||u.renk.toLowerCase().includes(q));
  $('liste-urun').innerHTML=list.length?list.map(u=>{
    const low=u.stok<=30;
    return `<div class="row" onclick="urunDetay(${u.id})">
      <div class="av p">${init(u.ad)}</div>
      <div class="mid"><div class="t">${u.ad} <span class="tag">${u.kod}</span></div><div class="s">${u.renk} · Satış ${TL(u.satis)}/${u.birim}</div></div>
      <div class="end"><div class="n ${low?'neg':''}">${u.stok}</div><div class="u">${u.birim}${low?' ⚠️':''}</div></div>
    </div>`;}).join(''):emptyBox('📦','Ürün bulunamadı');
}
function renderSatis(){
  const list=[...db.satislar].sort((a,b)=>b.tarih-a.tarih);
  $('liste-satis').innerHTML=list.length?list.map(s=>`
    <div class="row" onclick="satisDetay(${s.id})">
      <div class="av g">🧾</div>
      <div class="mid"><div class="t">${s.musteri}</div><div class="s">${tarihStr(s.tarih)} · ${s.kalemler.map(k=>k.urun).join(', ')}</div></div>
      <div class="end"><div class="n">${TL(s.tutar)}</div><div class="u">${s.odenen>=s.tutar?'<span class="pill ok">Ödendi</span>':'<span class="pill bad">'+TL(s.tutar-s.odenen)+' açık</span>'}</div></div>
    </div>`).join(''):emptyBox('🧾','Henüz satış kaydı yok. Sağ alttaki + ile yeni satış ekle.');
}
function emptyBox(i,t){return `<div class="empty"><div class="ico">${i}</div><p>${t}</p></div>`;}

/* ============ MODAL ============ */
function openModal(title,html){$('m-title').textContent=title;$('m-body').innerHTML=html;$('ov').classList.add('show');}
function closeModal(){$('ov').classList.remove('show');}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});

function fabAction(){
  if(cur==='musteri')formMusteri();
  else if(cur==='urun')formUrun();
  else formSatis();
}

/* ---- Müşteri ---- */
function formMusteri(m){
  m=m||{};
  openModal(m.id?'Müşteri Düzenle':'Yeni Müşteri',`
    <label>Firma / Ad Soyad</label><input id="f-ad" value="${m.ad||''}" placeholder="Örn: Yılmaz Tekstil">
    <div class="grid2">
      <div><label>Telefon</label><input id="f-tel" value="${m.tel||''}" placeholder="0532...">
      </div><div><label>Şehir / Bölge</label><input id="f-sehir" value="${m.sehir||''}" placeholder="İstanbul / Laleli"></div>
    </div>
    <label>Açılış Bakiyesi (Borç +)</label><input id="f-bak" type="number" value="${m.bakiye||0}">
    <button class="btn" onclick="kaydetMusteri(${m.id||0})">Kaydet</button>
    ${m.id?`<button class="btn danger" onclick="silMusteri(${m.id})">Müşteriyi Sil</button>`:''}
  `);
}
function kaydetMusteri(id){
  const ad=$('f-ad').value.trim();if(!ad)return toast('Ad gerekli');
  const o={ad,tel:$('f-tel').value.trim(),sehir:$('f-sehir').value.trim(),bakiye:+$('f-bak').value||0};
  if(id){Object.assign(db.musteriler.find(x=>x.id===id),o);}
  else{o.id=nid('m');db.musteriler.push(o);}
  save();closeModal();render();toast('Müşteri kaydedildi ✓');
}
function silMusteri(id){db.musteriler=db.musteriler.filter(x=>x.id!==id);save();closeModal();render();toast('Silindi');}
function musteriDetay(id){
  const m=db.musteriler.find(x=>x.id===id);
  const sat=db.satislar.filter(s=>s.musteriId===id).sort((a,b)=>b.tarih-a.tarih);
  const b=m.bakiye,cls=b>0?'neg':b<0?'pos':'',lbl=b>0?'Borçlu':b<0?'Alacaklı':'Bakiye kapalı';
  openModal(m.ad,`
    <div class="total-box"><div><div class="tl">${lbl}</div><div class="tv ${cls}">${TL(Math.abs(b))}</div></div>
      <div style="text-align:right"><div class="mini">${m.sehir||''}</div><div class="mini">${m.tel||''}</div></div></div>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn ghost" style="margin:0" onclick="formTahsilat(${id})">💰 Tahsilat</button>
      <button class="btn ghost" style="margin:0" onclick="formMusteri(db.musteriler.find(x=>x.id===${id}))">✏️ Düzenle</button>
    </div>
    <div class="sec-title" style="margin-top:18px"><h2>Satışlar (${sat.length})</h2></div>
    ${sat.length?sat.map(s=>`<div class="line-item"><div class="li-t">${tarihStr(s.tarih)} · ${s.kalemler.length} kalem</div><b>${TL(s.tutar)}</b></div>`).join(''):'<div class="mini">Bu müşteriye ait satış yok.</div>'}
  `);
}
function formTahsilat(id){
  const m=db.musteriler.find(x=>x.id===id);
  openModal('Tahsilat · '+m.ad,`
    <div class="mini">Güncel borç: <b>${TL(Math.max(0,m.bakiye))}</b></div>
    <label>Tahsil Edilen Tutar</label><input id="t-tut" type="number" placeholder="0">
    <label>Not (opsiyonel)</label><input id="t-not" placeholder="Nakit / Havale...">
    <button class="btn" onclick="kaydetTahsilat(${id})">Tahsilatı Kaydet</button>
  `);
}
function kaydetTahsilat(id){
  const t=+$('t-tut').value;if(!t||t<=0)return toast('Tutar girin');
  const m=db.musteriler.find(x=>x.id===id);m.bakiye-=t;save();closeModal();render();toast('Tahsilat alındı ✓ '+TL(t));
}

/* ---- Ürün ---- */
function formUrun(u){
  u=u||{};
  openModal(u.id?'Ürün Düzenle':'Yeni Ürün',`
    <label>Ürün Adı</label><input id="u-ad" value="${u.ad||''}" placeholder="Örn: Pamuklu Süprem">
    <div class="grid2">
      <div><label>Kod</label><input id="u-kod" value="${u.kod||''}" placeholder="SPR-001"></div>
      <div><label>Renk</label><input id="u-renk" value="${u.renk||''}" placeholder="Beyaz"></div>
    </div>
    <div class="grid2">
      <div><label>Birim</label><select id="u-birim">
        ${['metre','kg','top','adet','paket'].map(x=>`<option ${u.birim===x?'selected':''}>${x}</option>`).join('')}
      </select></div>
      <div><label>Stok Miktarı</label><input id="u-stok" type="number" value="${u.stok||0}"></div>
    </div>
    <div class="grid2">
      <div><label>Alış Fiyatı</label><input id="u-alis" type="number" value="${u.alis||0}"></div>
      <div><label>Satış Fiyatı</label><input id="u-satis" type="number" value="${u.satis||0}"></div>
    </div>
    <button class="btn" onclick="kaydetUrun(${u.id||0})">Kaydet</button>
    ${u.id?`<button class="btn danger" onclick="silUrun(${u.id})">Ürünü Sil</button>`:''}
  `);
}
function kaydetUrun(id){
  const ad=$('u-ad').value.trim();if(!ad)return toast('Ürün adı gerekli');
  const o={ad,kod:$('u-kod').value.trim(),renk:$('u-renk').value.trim(),birim:$('u-birim').value,stok:+$('u-stok').value||0,alis:+$('u-alis').value||0,satis:+$('u-satis').value||0};
  if(id){Object.assign(db.urunler.find(x=>x.id===id),o);}
  else{o.id=nid('u');db.urunler.push(o);}
  save();closeModal();render();toast('Ürün kaydedildi ✓');
}
function silUrun(id){db.urunler=db.urunler.filter(x=>x.id!==id);save();closeModal();render();toast('Silindi');}
function urunDetay(id){formUrun(db.urunler.find(x=>x.id===id));}

/* ---- Satış ---- */
let sepet=[];
function formSatis(){
  sepet=[];
  if(!db.musteriler.length)return toast('Önce müşteri ekleyin');
  if(!db.urunler.length)return toast('Önce ürün ekleyin');
  openModal('Yeni Satış',`
    <label>Müşteri</label><select id="s-mus">${db.musteriler.map(m=>`<option value="${m.id}">${m.ad}</option>`).join('')}</select>
    <label>Ürün Ekle</label>
    <div class="grid2">
      <select id="s-urun">${db.urunler.map(u=>`<option value="${u.id}">${u.ad} (${u.renk})</option>`).join('')}</select>
      <input id="s-mik" type="number" placeholder="Miktar">
    </div>
    <button class="btn ghost" onclick="sepeteEkle()">+ Sepete Ekle</button>
    <div id="sepet-liste" style="margin-top:14px"></div>
    <div class="total-box"><div class="tl">TOPLAM</div><div class="tv" id="s-toplam">₺0</div></div>
    <label>Bu Satışta Ödenen</label><input id="s-odenen" type="number" value="0" placeholder="0 = tamamı borç">
    <button class="btn" onclick="kaydetSatis()">Satışı Tamamla</button>
  `);
  cizSepet();
}
function sepeteEkle(){
  const u=db.urunler.find(x=>x.id==+$('s-urun').value);const mik=+$('s-mik').value;
  if(!mik||mik<=0)return toast('Miktar girin');
  sepet.push({urunId:u.id,urun:u.ad,mik,birim:u.birim,fiyat:u.satis});
  $('s-mik').value='';cizSepet();
}
function cizSepet(){
  $('sepet-liste').innerHTML=sepet.map((k,i)=>`<div class="line-item">
    <div class="li-t">${k.urun}<div class="mini">${k.mik} ${k.birim} × ${TL(k.fiyat)}</div></div>
    <b style="margin-right:8px">${TL(k.mik*k.fiyat)}</b>
    <button class="li-del" onclick="sepetSil(${i})">✕</button></div>`).join('')||'<div class="mini">Sepet boş</div>';
  $('s-toplam').textContent=TL(sepet.reduce((a,k)=>a+k.mik*k.fiyat,0));
}
function sepetSil(i){sepet.splice(i,1);cizSepet();}
function kaydetSatis(){
  if(!sepet.length)return toast('Sepet boş');
  const m=db.musteriler.find(x=>x.id==+$('s-mus').value);
  const tutar=sepet.reduce((a,k)=>a+k.mik*k.fiyat,0);
  const odenen=Math.min(+$('s-odenen').value||0,tutar);
  const sat={id:nid('s'),musteriId:m.id,musteri:m.ad,tarih:Date.now(),kalemler:sepet.map(k=>({urun:k.urun,mik:k.mik,birim:k.birim,fiyat:k.fiyat})),tutar,odenen};
  db.satislar.push(sat);
  // stok düş
  sepet.forEach(k=>{const u=db.urunler.find(x=>x.id===k.urunId);if(u)u.stok-=k.mik;});
  // bakiye artır (kalan borç)
  m.bakiye+=(tutar-odenen);
  save();closeModal();go('satis');toast('Satış kaydedildi ✓ '+TL(tutar));
}
function satisDetay(id){
  const s=db.satislar.find(x=>x.id===id);
  openModal('Satış Fişi',`
    <div class="mini">${s.musteri} · ${tarihStr(s.tarih)}</div>
    <div style="margin-top:12px">${s.kalemler.map(k=>`<div class="line-item"><div class="li-t">${k.urun}<div class="mini">${k.mik} ${k.birim} × ${TL(k.fiyat)}</div></div><b>${TL(k.mik*k.fiyat)}</b></div>`).join('')}</div>
    <div class="total-box"><div class="tl">TOPLAM</div><div class="tv">${TL(s.tutar)}</div></div>
    <div class="grid2" style="margin-top:10px">
      <div class="mini">Ödenen: <b>${TL(s.odenen)}</b></div>
      <div class="mini" style="text-align:right">Kalan: <b class="${s.tutar-s.odenen>0?'neg':'pos'}">${TL(s.tutar-s.odenen)}</b></div>
    </div>
    <button class="btn danger" onclick="silSatis(${id})">Satışı İptal Et</button>
  `);
}
function silSatis(id){
  const s=db.satislar.find(x=>x.id===id);
  s.kalemler.forEach(k=>{const u=db.urunler.find(x=>x.ad===k.urun);if(u)u.stok+=k.mik;});
  const m=db.musteriler.find(x=>x.id===s.musteriId);if(m)m.bakiye-=(s.tutar-s.odenen);
  db.satislar=db.satislar.filter(x=>x.id!==id);save();closeModal();render();toast('Satış iptal edildi');
}

/* arama */
['ara-musteri','ara-urun'].forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id)render();}));

render();
</script>
</body>
</html>
