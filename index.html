    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px"><span>Tahsil edilen <b style="color:var(--good)">${TL(R.tahsil)}</b></span><span>Açık <b style="color:var(--warn)">${TL(R.acikDonem)}</b></span></div>
    <div style="height:12px;border-radius:8px;background:var(--warn-s);overflow:hidden;display:flex"><i style="height:100%;width:${Math.min(100,R.tahOran)}%;background:var(--good)"></i></div>
    <div class="mini" style="margin-top:6px">Bu dönem satışların <b>%${R.tahOran}</b>'i tahsil edildi · toplam açık müşteri alacağın <b>${TL(R.acikAlacak)}</b></div></div>`;
  const yBuk=[{ad:'0–30 gün',mn:0,mx:30,v:0,renk:RAP_PAL[2]},{ad:'30–60 gün',mn:30,mx:60,v:0,renk:'#c8a01a'},{ad:'60–90 gün',mn:60,mx:90,v:0,renk:'#d9781f'},{ad:'90+ gün',mn:90,mx:1e12,v:0,renk:RAP_PAL[1]}];
  const yList=[];
  db.cariler.filter(c=>c.tip==='musteri'&&c.bakiye>0.5).forEach(c=>{const g=gecikmeGun(c.id);const b=yBuk.find(b=>g>=b.mn&&g<b.mx)||yBuk[3];b.v+=c.bakiye;yList.push({ad:c.ad,bakiye:c.bakiye,gun:g,id:c.id})});
  const yTop=yBuk.reduce((a,b)=>a+b.v,0);yList.sort((a,b)=>b.gun-a.gun);
  h+=`<div class="sec">Alacak Yaşlandırma <span class="mini" style="text-transform:none;font-weight:600">bugün itibarıyla</span></div><div class="card" style="padding:14px">`;
  if(yTop){
    h+=`<div style="height:14px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:10px">`+yBuk.filter(b=>b.v>0).map(b=>`<i title="${b.ad}" style="height:100%;width:${(b.v/yTop*100).toFixed(1)}%;background:${b.renk}"></i>`).join('')+`</div>`;
    h+=yBuk.map(b=>`<div style="display:flex;align-items:center;gap:7px;margin:5px 0"><span style="width:11px;height:11px;border-radius:3px;background:${b.renk};flex:0 0 11px"></span><span style="flex:1;font-size:12.5px;font-weight:600">${b.ad}</span><b style="font-size:12.5px">${TL(b.v)}</b><span class="mini" style="width:34px;text-align:right">%${yTop?Math.round(b.v/yTop*100):0}</span></div>`).join('');
    const vadesi=yList.filter(x=>x.gun>=60).slice(0,6);
    if(vadesi.length)h+=`<div class="mini" style="margin:10px 0 4px;font-weight:700;color:var(--bad)">⚠️ En çok geciken müşteriler:</div>`+vadesi.map(x=>`<div class="exrow" onclick="cariKart(${x.id})" style="cursor:pointer"><div class="exl"><b>${esc(x.ad)}</b><small>${x.gun} gündür ödemedi</small></div><div class="exb neg">${TL(x.bakiye)}</div></div>`).join('');
  }else h+=`<div class="mini">Açık müşteri alacağı yok 👍</div>`;
  h+=`</div>`;
  const proj=[30,60,90].map(w=>({w,gir:0,cik:0}));
  db.cekler.filter(c=>c.durum==='portfoyde').forEach(c=>{const g=gunFark(c.vade);proj.forEach(r=>{if(g<=r.w){if(c.tip==='alinan')r.gir+=c.tutar;else r.cik+=c.tutar}})});
  const fasonBorc=db.cariler.filter(c=>(c.tip==='fason'||c.tip==='tedarikci')&&c.bakiye>0).reduce((a,c)=>a+c.bakiye,0);
  h+=`<div class="sec">Nakit Akış Projeksiyonu <span class="mini" style="text-transform:none;font-weight:600">çek vadelerine göre</span></div><div class="card" style="padding:6px 4px"><div style="display:flex;text-align:center">`+proj.map((r,i)=>{const net=r.gir-r.cik;return `<div style="flex:1;padding:9px 4px;${i<2?'border-right:1px solid var(--ln2)':''}"><div class="mini" style="font-weight:700">${r.w} gün</div><div style="font-size:12px;color:var(--good);margin-top:3px">+${kisaTL(r.gir)}</div><div style="font-size:12px;color:var(--bad)">−${kisaTL(r.cik)}</div><div style="font-weight:800;font-size:14px;margin-top:3px;color:${net>=0?'var(--good)':'var(--bad)'}">${net>=0?'+':'−'}${kisaTL(Math.abs(net))}</div></div>`}).join('')+`</div></div>`;
  h+=`<div class="mini" style="margin:6px 3px">Vadesiz beklenen: müşteri alacağı <b style="color:var(--good)">+${TL(R.acikAlacak)}</b> · fason/tedarik borcu <b style="color:var(--bad)">−${TL(fasonBorc)}</b></div>`;
  // limit aşan / yaklaşan riskli müşteriler
  const risk=db.cariler.filter(c=>c.tip==='musteri'&&c.limit>0&&c.bakiye>c.limit*0.8).map(c=>({ad:c.ad,id:c.id,bakiye:c.bakiye,limit:c.limit,oran:c.bakiye/c.limit,asti:c.bakiye>c.limit})).sort((a,b)=>b.oran-a.oran);
  if(risk.length){
    h+=`<div class="sec">Riskli Müşteriler <span class="mini" style="text-transform:none;font-weight:600">limit aşan / yaklaşan</span></div><div class="card" style="padding:4px 13px">`+risk.slice(0,8).map(x=>`<div class="exrow" onclick="cariKart(${x.id})" style="cursor:pointer"><div class="exl"><b>${esc(x.ad)}</b><small>${TL(x.bakiye)} / ${TL(x.limit)} limit · %${Math.round(x.oran*100)}</small></div><span class="pill ${x.asti?'bad':'low'}">${x.asti?'aştı':'yaklaştı'}</span></div>`).join('')+`<div class="mini" style="padding:8px 0 4px">⚠️ Limit aşan müşterilere mal keserken dikkat — tahsilat riski</div></div>`;
  }
  return h;
}
function rapGider(R){let h='';
  const gGrup={};(db.hareketler||[]).filter(x=>x.yon==='out'&&x.tur!=='Transfer'&&R.inRange(x.tarih)).forEach(x=>{
    const k=x.tur==='Ortak Harcama'?'Ortak Harcama':(x.tur==='odeme'||x.tip==='odeme')?'Fason / Tedarik':((x.aciklama||x.tur||'Diğer').split('·')[0].trim()||'Diğer');
    gGrup[k]=(gGrup[k]||0)+(+x.tutar||0);
  });
  const gRows=Object.entries(gGrup).sort((a,b)=>b[1]-a[1]).map(([ad,v])=>({ad,v}));
  const gToplam=gRows.reduce((a,r)=>a+r.v,0);
  h+=`<div class="sec">Gider Dağılımı · ${R.donemAd} <span style="color:var(--bad);font-weight:800">${TL(gToplam)}</span></div>`;
  if(gRows.length){
    h+=`<div class="card" style="padding:14px;display:flex;gap:14px;align-items:center">${svgDonut(gRows)}<div style="flex:1;min-width:0">`+gRows.slice(0,8).map((r,i)=>`<div style="display:flex;align-items:center;gap:7px;margin:5px 0"><span style="width:11px;height:11px;border-radius:3px;background:${RAP_PAL[i%RAP_PAL.length]};flex:0 0 11px"></span><span style="flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.ad)}</span><b style="font-size:12.5px">${kisaTL(r.v)}</b><span class="mini" style="width:34px;text-align:right">%${gToplam>0?Math.round(r.v/gToplam*100):0}</span></div>`).join('')+`</div></div>`;
  }else h+=`<div class="card" style="padding:14px"><div class="mini">Bu dönemde gider kaydı yok</div></div>`;
  if(R.kar){const net=R.brutKar-gToplam;
    h+=`<div class="card" style="margin-top:10px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;background:${net>=0?'var(--good-s)':'var(--bad-s)'};border-color:${net>=0?'var(--good)':'var(--bad)'}"><div><div style="font-size:11.5px;font-weight:700;color:var(--sub)">NET KÂR (brüt − giderler)</div><div class="mini">${TL(R.brutKar)} kâr − ${TL(gToplam)} gider</div></div><div style="font-size:21px;font-weight:800;color:${net>=0?'var(--good)':'var(--bad)'}">${TL(net)}</div></div>`;
  }
  // ortak harcama
  const oGrp={};db.ortakHarcama.forEach(o=>{if(!R.inRange(o.tarih))return;oGrp[o.ortak]=(oGrp[o.ortak]||0)+(+o.tutar||0)});
  const oRows=Object.entries(oGrp).sort((a,b)=>b[1]-a[1]);
  if(oRows.length)h+=`<div class="sec">Ortak Harcamaları <span class="mini" style="text-transform:none;font-weight:600">${R.donemAd}</span></div><div class="card" style="padding:4px 13px">`+oRows.map(([ad,v])=>`<div class="exrow"><div class="exl"><b>${esc(ad)}</b><small>bu dönem çektiği</small></div><div class="exb neg">−${TL(v)}</div></div>`).join('')+`</div>`;
  return h;
}
function rapStok(R){let h='';
  // kritik / tükenen stok
  const kritik=db.urunler.filter(u=>(+u.stok||0)<=(+u.kritik||0)).map(u=>({ad:u.ad,stok:+u.stok||0,kritik:+u.kritik||0,kaynak:u.kaynak})).sort((a,b)=>a.stok-b.stok);
  const tuken=kritik.filter(x=>x.stok<=0).length;
  h+=`<div class="sec">Kritik / Tükenen Stok ${kritik.length?`<span style="color:var(--bad);font-weight:800">${kritik.length} ürün</span>`:''}</div><div class="card" style="padding:${kritik.length?'4px 13px':'14px'}">`;
  if(kritik.length){
    h+=kritik.slice(0,10).map(x=>{const bitti=x.stok<=0;return `<div class="exrow"><div class="exl"><b>${esc(x.ad)}</b><small>${bitti?'stok bitti':x.stok+' adet kaldı'} · kritik ${x.kritik}${x.kaynak==='alim'?' · al':' · üret'}</small></div><span class="pill ${bitti?'bad':'low'}">${bitti?'tükendi':'kritik'}</span></div>`}).join('');
    h+=`<div class="mini" style="padding:8px 0 4px">${tuken?'🔴 '+tuken+' ürün tükendi · ':''}⚠️ ${kritik.length-tuken} ürün kritik seviyede — acil ${db.urunler.some(u=>(+u.stok||0)<=(+u.kritik||0)&&u.kaynak==='alim')?'al/üret':'üret'}</div>`;
  }else h+=`<div class="mini">Tüm stoklar yeterli 👍</div>`;
  h+=`</div>`;
  if(R.kar){
    const marjList=db.urunler.map(u=>{const bk=(+u.satis||0)-(+u.alis||0);return {ad:u.ad,bk,m:u.satis?Math.round(bk/u.satis*100):0,satis:+u.satis||0}}).filter(x=>x.satis>0);
    const enKarli=[...marjList].sort((a,b)=>b.m-a.m).slice(0,8);
    if(enKarli.length){
      h+=`<div class="sec">Ürün Kâr Marjı <span class="mini" style="text-transform:none;font-weight:600">birim bazında</span></div><div class="card" style="padding:4px 13px">`+enKarli.map(x=>`<div class="exrow"><div class="exl"><b>${esc(x.ad)}</b><small>birim kâr +₺${Math.round(x.bk).toLocaleString('tr-TR')}</small></div><div class="exb" style="color:${x.m>=30?'var(--good)':x.m>=15?'var(--warn)':'var(--bad)'};font-weight:800">%${x.m}</div></div>`).join('')+`</div>`;
      const dusuk=marjList.filter(x=>x.m<20).sort((a,b)=>a.m-b.m).slice(0,3);
      if(dusuk.length)h+=`<div class="mini" style="margin:6px 3px">⚠️ Düşük marjlı: ${dusuk.map(x=>esc(x.ad)+' (%'+x.m+')').join(' · ')} — fiyat gözden geçir</div>`;
    }
  }
  const uSon={};db.satislar.forEach(s=>s.kalemler.forEach(k=>{if(!uSon[k.uid]||s.tarih>uSon[k.uid])uSon[k.uid]=s.tarih}));
  const olu=db.urunler.filter(u=>u.stok>0).map(u=>{const son=uSon[u.id]||0;const g=son?Math.floor((Date.now()-son)/86400000):999;return {ad:u.ad,stok:u.stok,birim:u.birim,g,bagli:u.stok*(+u.alis||0),son}}).filter(x=>x.g>=45).sort((a,b)=>b.bagli-a.bagli).slice(0,8);
  const oluTop=olu.reduce((a,b)=>a+b.bagli,0);
  if(olu.length)h+=`<div class="sec">Ölü / Yavaş Stok <span class="mini" style="text-transform:none;font-weight:600">45+ gündür satılmayan</span></div><div class="card" style="padding:4px 13px">`+olu.map(x=>`<div class="exrow"><div class="exl"><b>${esc(x.ad)}</b><small>${x.stok} ${esc(x.birim||'adet')} · ${x.son?x.g+' gündür satılmadı':'hiç satılmadı'}</small></div><div class="exb" style="color:var(--warn);font-weight:800">${kisaTL(x.bagli)}</div></div>`).join('')+`<div class="mini" style="padding:8px 0 4px">💤 Bu stoklarda <b style="color:var(--warn)">${TL(oluTop)}</b> bağlı — indirim/kampanya düşünebilirsin</div></div>`;
  else h+=`<div class="sec">Ölü / Yavaş Stok</div><div class="card" style="padding:14px"><div class="mini">45+ gündür satılmayan stok yok 👍</div></div>`;
  const stMal=db.urunler.reduce((a,u)=>a+u.stok*(+u.alis||0),0);
  const stSat=db.urunler.reduce((a,u)=>a+u.stok*(+u.satis||0),0);
  h+=`<div class="sec">Toplam Stok Değeri</div><div class="g2"><div class="card" style="padding:12px;margin:0;text-align:center"><div class="mini">Maliyet değeri</div><div style="font-weight:800;font-size:17px">${TL(stMal)}</div></div><div class="card" style="padding:12px;margin:0;text-align:center"><div class="mini">Satış değeri</div><div style="font-weight:800;font-size:17px;color:var(--good)">${TL(stSat)}</div></div></div><div class="mini" style="margin:6px 3px">📦 Elindeki mal satılırsa potansiyel <b style="color:var(--good)">${TL(stSat-stMal)}</b> brüt kâr</div>`;
  return h;
}
function rapMusteri(R){let h='';
  if(R.kar){
    const musKar={};R.sat.forEach(s=>{let kr=0;s.kalemler.forEach(k=>{const u=urun(k.uid);const mal=u?(+u.alis||0)*k.mik*(k.birim==='seri'?(u.seri||1):1):0;kr+=(+k.mik||0)*(+k.fiyat||0)*pbKur(s.pb)-mal});musKar[s.mus||'—']=(musKar[s.mus||'—']||0)+kr});
    const topKar=Object.entries(musKar).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([ad,v])=>({ad,v:Math.max(0,v),g:kisaTL(v)}));
    h+=`<div class="sec">Müşteri Kârlılığı <span class="mini" style="text-transform:none;font-weight:600">kâra göre · ${R.donemAd}</span></div><div class="card" style="padding:14px">${barsHtml(topKar,'linear-gradient(90deg,#0f9d63,#6fce9f)')}</div>`;
  }
  // müşteri × ürün çapraz — "kim ne alıyor"
  const musList=[...new Set(R.sat.map(s=>s.mid).filter(Boolean))].map(id=>({id,ad:(cari(id)||{}).ad||'—',ciro:R.sat.filter(s=>s.mid===id).reduce((a,s)=>a+R.toTL(s),0)})).sort((a,b)=>b.ciro-a.ciro);
  if(musList.length){
    const mid=rapMusId&&musList.some(m=>m.id===rapMusId)?rapMusId:musList[0].id;
    const uMap={};R.sat.filter(s=>s.mid===mid).forEach(s=>s.kalemler.forEach(k=>{(uMap[k.urun]=uMap[k.urun]||{adet:0,ciro:0}).adet+=(+k.mik||0);uMap[k.urun].ciro+=(+k.mik||0)*(+k.fiyat||0)*pbKur(s.pb)}));
    const topU=Object.entries(uMap).sort((a,b)=>b[1].ciro-a[1].ciro).slice(0,8).map(([ad,v])=>({ad,v:v.ciro,g:v.adet+' · '+kisaTL(v.ciro)}));
    h+=`<div class="sec">Müşteri Ne Alıyor? <span class="mini" style="text-transform:none;font-weight:600">seç → en çok aldıkları</span></div><div class="card" style="padding:12px 13px"><select onchange="rapMusId=+this.value;rRapor()">`+musList.map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.ad)} · ${kisaTL(m.ciro)}</option>`).join('')+`</select><div style="margin-top:10px">${barsHtml(topU,'linear-gradient(90deg,#7a4fd0,#b9a3ea)')}</div></div>`;
  }
  // en sık alan (işlem sayısı)
  const sikMap={};R.sat.forEach(s=>{const key=s.mus||'—';sikMap[key]=(sikMap[key]||0)+1});
  const topSik=Object.entries(sikMap).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([ad,v])=>({ad,v,g:v+' sipariş'}));
  if(topSik.length)h+=`<div class="sec">En Sık Alışveriş Yapanlar <span class="mini" style="text-transform:none;font-weight:600">${R.donemAd}</span></div><div class="card" style="padding:14px">${barsHtml(topSik,'linear-gradient(90deg,var(--thr),#e6b06a)')}</div>`;
  // uyuyan
  const musSon={};db.satislar.forEach(s=>{if(!s.mid)return;if(!musSon[s.mid]||s.tarih>musSon[s.mid])musSon[s.mid]=s.tarih});
  const uyuyan=db.cariler.filter(c=>c.tip==='musteri').map(c=>({c,son:musSon[c.id]||0})).filter(x=>x.son&&Math.floor((Date.now()-x.son)/86400000)>=30).map(x=>({ad:x.c.ad,id:x.c.id,gun:Math.floor((Date.now()-x.son)/86400000),bakiye:x.c.bakiye})).sort((a,b)=>b.gun-a.gun).slice(0,8);
  h+=`<div class="sec">Uyuyan Müşteriler <span class="mini" style="text-transform:none;font-weight:600">30+ gündür almayan</span></div><div class="card" style="padding:${uyuyan.length?'4px 13px':'13px'}">`+(uyuyan.length?uyuyan.map(x=>`<div class="exrow" onclick="cariKart(${x.id})" style="cursor:pointer"><div class="exl"><b>${esc(x.ad)}</b><small>${x.gun} gündür sipariş yok${x.bakiye>0.5?' · ₺'+Math.round(x.bakiye).toLocaleString('tr-TR')+' borcu var':''}</small></div><div class="exb" style="color:var(--warn);font-weight:800">${x.gun}g</div></div>`).join(''):`<div class="mini">Herkes aktif — uyuyan müşteri yok 👍</div>`)+`</div>`;
  return h;
}
function rapUretim(R){let h='';
  const ie=db.isemirleri||[];
  const aktif=ie.filter(i=>i.durum!=='tamam');
  const tamamDonem=ie.filter(i=>i.durum==='tamam'&&R.inRange(i.kapanis||i.baslangic||0));
  let fasondaAdet=0,defoAdet=0;
  ie.forEach(i=>(i.duraklar||[]).forEach(d=>{
    defoAdet+=Object.values(d.renkDefo||{}).reduce((a,b)=>a+(+b||0),0)||(+d.defolu||0);
    const yol=(+d.gonderilen||0)-(+d.gelen||0)-(+d.defolu||0);if(d.durum!=='tamam'&&yol>0)fasondaAdet+=yol;
  }));
  const fasonDonem=ie.reduce((a,i)=>{if(!R.inRange(i.baslangic||0))return a;return a+((i.duraklar||[]).reduce((x,d)=>x+(+d.ucret||0)*(+d.gelen||0)*(ieCarpan?ieCarpan(i):1),0))},0);
  h+=`<div class="sec">Üretim Özeti</div><div class="card" style="padding:6px 4px"><div style="display:flex;text-align:center">
    <div style="flex:1;padding:8px 4px;border-right:1px solid var(--ln2)"><div style="font-weight:800;font-size:19px;color:var(--ind)">${aktif.length}</div><div class="mini">aktif iş emri</div></div>
    <div style="flex:1;padding:8px 4px;border-right:1px solid var(--ln2)"><div style="font-weight:800;font-size:19px;color:var(--good)">${tamamDonem.length}</div><div class="mini">tamamlanan</div></div>
    <div style="flex:1;padding:8px 4px"><div style="font-weight:800;font-size:19px;color:var(--warn)">${fasondaAdet}</div><div class="mini">fasonda mal</div></div>
  </div></div>`;
  if(R.kar)h+=`<div class="mini" style="margin:6px 3px">🧵 ${R.donemAd} fason işçiliği: <b>${TL(fasonDonem)}</b></div>`;
  const fasMap={};ie.forEach(i=>(i.duraklar||[]).forEach(d=>{if(!d.fasonId)return;const c=cari(d.fasonId);if(!c)return;const tut=(+d.ucret||0)*(+d.gelen||0)*(ieCarpan?ieCarpan(i):1);if(tut>0)fasMap[c.ad]=(fasMap[c.ad]||0)+tut}));
  const topFas=Object.entries(fasMap).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([ad,v])=>({ad,v,g:kisaTL(v)}));
  if(topFas.length)h+=`<div class="sec">En Çok İş Verdiğin Fasoncular</div><div class="card" style="padding:14px">${barsHtml(topFas,'linear-gradient(90deg,#7a4fd0,#b9a3ea)')}</div>`;

function kaydetFirma(){db.firma=$('f-ad').value.trim()||db.firma;db.firmaSlogan=$('f-slo').value.trim();db.firmaAdres=$('f-adr').value.trim();db.firmaTel=$('f-tel').value.trim();db.firmaWp=$('f-wp').value.trim();db.satici=$('f-sat').value.trim();save();closeM();render();toast('Firma bilgileri kaydedildi ✓')}
function formKur(){open_('Günün Kuru',`<button class="btn g" style="margin-top:0" onclick="kurGuncelle()">🔄 Otomatik Güncel Kuru Al</button>${db.kurTarih?`<div class="mini" style="text-align:center;margin-top:8px">Son güncelleme: ${kurYas()}</div>`:''}<div class="mini" style="text-align:center;margin:10px 0 4px">— veya elle gir —</div><div class="g2"><div><label>USD ($)</label><input id="k-usd" type="number" step="0.01" value="${db.kurUSD}"></div><div><label>EUR (€)</label><input id="k-eur" type="number" step="0.01" value="${db.kurEUR}"></div></div><div class="infobox">Dolar-endeksli ürünlerin TL fiyatı bu kura göre hesaplanır.</div><button class="btn" onclick="kaydetKur()">Elle Kaydet</button>`)}
function kaydetKur(){db.kurUSD=+$('k-usd').value||db.kurUSD;db.kurEUR=+$('k-eur').value||db.kurEUR;db.kurTarih=Date.now();save();closeM();render();toast('Kur güncellendi ✓')}
async function kurCek(){
  const upd=(usd,eur)=>{if(usd>0){db.kurUSD=+usd.toFixed(2);if(eur>0)db.kurEUR=+eur.toFixed(2);db.kurTarih=Date.now();save();return true}return false};
  try{const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});const d=await r.json();
    if(d&&d.rates&&d.rates.TRY)return upd(d.rates.TRY, d.rates.EUR?d.rates.TRY/d.rates.EUR:0);}catch(e){}
  try{const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',{cache:'no-store'});const d=await r.json();
    if(d&&d.usd&&d.usd.try)return upd(+d.usd.try, d.usd.eur?(+d.usd.try)/(+d.usd.eur):0);}catch(e){}
  return false;
}
async function kurGuncelle(){
  toast('Kur alınıyor...');
  const ok=await kurCek();
  if(ok){render();toast('Güncel kur alındı ✓ $'+db.kurUSD.toFixed(2))}
  else{toast('Otomatik alınamadı — elle girebilirsin');formKur()}
}
function kurYas(){if(!db.kurTarih)return '';const dk=Math.round((Date.now()-db.kurTarih)/60000);return dk<1?'az önce':dk<60?dk+' dk önce':Math.round(dk/60)+' saat önce'}
function yedekAl(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  const d=new Date();const ad=`oztekstil-yedek-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.href=url;a.download=ad;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('Yedek indirildi ✓');
}
function yedekYukle(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d||!d.urunler)throw 0}catch(e){toast('Geçersiz yedek dosyası');inp.value='';return}inp.value='';askConfirm('Mevcut veriler bu yedekle değiştirilsin mi?',()=>{db=d;save();go('panel');toast('Yedek geri yüklendi ✓')},'Yükle')};
  r.readAsText(f);
}

/* =================== MODAL & FAB =================== */
function open_(t,h){$('mT').textContent=t;$('mB').innerHTML=h;$('ov').classList.add('show')}
let _cariReturn=null,_saleStash=null;
function closeM(){$('ov').classList.remove('show');_cariReturn=null}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
function fabShow(v){if(!canSee(v))return false;if(v==='stok')return canUrunYaz()||canHammadde();if(v==='cari'||v==='satis')return true;return false}
function fabAction(){if(cur==='stok'){(stokTab==='hammadde'&&canHammadde())?formHammadde():(canUrunYaz()?formUrun():toast('Bu işlem için yetkiniz yok'))}else if(cur==='cari')formCari(cariTab);else if(cur==='satis')formSatis()}

/* =================== BAŞLAT =================== */
go('panel');
// Müşteri cihazı: #siparis + bulut ayarlı → katalogu buluttan çek, sipariş moduna geç
async function musteriBulutAc(){bulutMusteriMod=true;await bulutKatalogYukle();await bulutAuthBekle();await bulutProfilYukle();await bulutRolVerisiYukle();portalAc();}
function portalHashAc(){const h=location.hash||'';if(h==='#siparis'||h.indexOf('#kayit')===0){portalDavetOku();if(bulutVar()){if(!bulutMusteriMod)setTimeout(musteriBulutAc,300);else portalAc();}else portalAc();return true;}return false;}
portalHashAc();
window.addEventListener('hashchange',()=>{portalHashAc();});
// açılışta kur eskiyse (yok veya 3 saatten eski) sessizce güncelle
if(!db.kurTarih || Date.now()-db.kurTarih > 3*3600000){
  kurCek().then(ok=>{if(ok&&cur==='panel')render()});
}
window.addEventListener('error',e=>{console.log('APPERR:',e.message)});
// Günlük otomatik yedek (son yedek 8 saatten eskiyse)
try{const _yy=JSON.parse(localStorage.getItem('iq_yedekler')||'[]');if(!_yy.length||Date.now()-_yy[0].t>8*3600000)autoYedek('günlük otomatik');}catch(e){}
// 🔐 Güvenli çıkış sonrası: açılışta parola iste (oturum kilidi). Yoksa PIN kilidi.
if(localStorage.getItem('iq_oturumKilit')){
  if(bulutVar())oturumKilidiGoster();
  else{try{localStorage.removeItem('iq_oturumKilit')}catch(e){}if(db.pin)kilitGoster();}
}else if(db.pin)kilitGoster();
// Canlı senkron açıksa: bulut+admin girişi hazır olunca sessizce yeniden bağlan
if(db.canliBulut&&bulutVar()){bulutBaslat();bulutAuthBekle().then(()=>{bulutProfilYukle().then(()=>{if(bulutGirisli())canliBaslat(true);})});}

/* =================== 📱 PWA: kurulum + çevrimdışı =================== */
(function(){
  // Service worker'ı yalnızca gerçek yayında (http/https) kaydet; file:// önizlemede atla
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(reg=>{try{reg.update()}catch(e){}}).catch(()=>{});
    });
    // Yeni sürüm devralınca sayfayı bir kez otomatik tazele (güncel HTML gelsin)
    let _yenilendi=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_yenilendi)return;_yenilendi=true;location.reload();});
  }
  // "Ana ekrana ekle" istemi — Android/Chrome otomatik butonu yakala
  let _prompt=null;
  function kurBtnGoster(){
    if(document.getElementById('pwa-kur'))return;
    const b=document.createElement('button');
    b.id='pwa-kur';
    b.textContent='📲 Uygulamayı Yükle';
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:9999;background:#111;color:#fff;border:1.5px solid #e11d2a;border-radius:24px;padding:11px 20px;font-size:14px;font-weight:800;font-family:inherit;box-shadow:0 6px 22px rgba(0,0,0,.35);cursor:pointer';
    b.onclick=async()=>{
      if(!_prompt)return;
      b.disabled=true; _prompt.prompt();
      try{await _prompt.userChoice}catch(e){}
      _prompt=null; b.remove();
    };
    document.body.appendChild(b);
    // 12 sn sonra kendiliğinden gizlensin (rahatsız etmesin)
    setTimeout(()=>{b&&b.parentNode&&b.remove();},12000);
  }
  window.addEventListener('beforeinstallprompt',(e)=>{
    e.preventDefault(); _prompt=e; kurBtnGoster();
  });
  window.addEventListener('appinstalled',()=>{
    _prompt=null; const b=document.getElementById('pwa-kur'); if(b)b.remove();
  });
})();
</script>
