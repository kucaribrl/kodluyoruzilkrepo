<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2a2a31">
<title>IQ Basics — Toptan Yönetim</title>
<!-- 📱 PWA — ana ekrana kurulabilir uygulama -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IQ Basics">
<meta name="mobile-web-app-capable" content="yes">
<!-- ☁️ Bulut (Firebase) — yayında yüklenir; offline/önizlemede sessizce atlanır -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#f3f2f4; --card:#fff; --ink:#1c1c22; --sub:#71707a; --ln:#e9e8ec; --ln2:#f3f2f5;
    --ind:#33333d; --ind2:#d9534f; --ind-s:#fbeceb; --thr:#c67b2c; --thr-s:#fbf1e3;
    --good:#0f9d63; --good-s:#e3f6ee; --bad:#e0455f; --bad-s:#fdeaee; --warn:#c8891a; --warn-s:#fbf1d8; --pur:#7a4fd0; --pur-s:#efe9fb;
    --sh:0 1px 2px rgba(20,40,70,.05),0 6px 18px rgba(20,40,70,.07);
    --sh2:0 4px 16px rgba(20,40,70,.1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:88px;font-size:15px;line-height:1.5;overflow-x:hidden}
  .tnum{font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit}

  /* HEADER */
  header{background:linear-gradient(135deg,#33333d,#22222a);color:#fff;padding:13px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 16px rgba(20,20,25,.28)}
  header .top{display:flex;align-items:center;gap:11px}
  header .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
  header h1{font-size:16px;font-weight:800}
  header .sub{font-size:11px;opacity:.85;margin-top:1px}
  header .role{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
  header .bkbtn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 6px 0 0;display:none}
  header.sub-view .bkbtn{display:block}
  header.sub-view .logo{display:none}

  main{max-width:820px;margin:0 auto;padding:14px}
  .hide{display:none!important}

  /* generic */
  .card{background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
  .sec{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--sub);margin:18px 3px 9px;display:flex;justify-content:space-between;align-items:center}
  .sec a{font-size:11.5px;color:var(--ind2);font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
  .row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
  .row:last-child{border-bottom:none}.row:active{background:var(--ln2)}
  .av{width:40px;height:40px;border-radius:11px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:var(--ind2)}
  .av.p{background:var(--pur)}.av.g{background:var(--good)}.av.o{background:var(--warn)}.av.r{background:var(--bad)}.av.gray{background:#eef2f7;color:#a9b6c6;font-size:19px}
  .mid{flex:1;min-width:0}.mid .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid .s{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .end{text-align:right;flex:0 0 auto}.end .n{font-weight:800;font-size:14px}.end .u{font-size:10.5px;color:var(--sub)}
  .pos{color:var(--good)}.neg{color:var(--bad)}.warnc{color:var(--warn)}
  .pill{display:inline-block;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px}
  .pill.ok{background:var(--good-s);color:var(--good)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.low{background:var(--warn-s);color:var(--warn)}.pill.n{background:var(--ln2);color:var(--sub)}.pill.p{background:var(--pur-s);color:var(--pur)}
  .chips{display:flex;gap:4px;margin-top:5px}.chip{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.12)}
  .tag{font-size:9.5px;font-weight:800;background:var(--ln2);color:var(--sub);padding:2px 6px;border-radius:5px;margin-left:5px}
  .empty{text-align:center;padding:38px 20px;color:var(--sub)}.empty .i{font-size:40px;opacity:.4}.empty p{margin:11px 0 0;font-size:13.5px}
  .mini{font-size:12px;color:var(--sub)}

  .search{width:100%;padding:11px 13px;border:1px solid var(--ln);border-radius:12px;font-size:14px;background:var(--card);margin-bottom:12px;outline:none;box-shadow:var(--sh)}
  .search:focus{border-color:var(--ind2)}
  .segs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}.segs::-webkit-scrollbar{display:none}
  .seg{font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--ln);color:var(--sub);white-space:nowrap;cursor:pointer}
  .seg.on{background:var(--ind);color:#fff;border-color:var(--ind)}
  .tabs{display:flex;background:var(--ln2);border-radius:12px;padding:3px;margin-bottom:13px}
  .tabs .tb{flex:1;text-align:center;padding:9px 4px;font-size:12.5px;font-weight:800;color:var(--sub);border-radius:9px;cursor:pointer}
  .tabs .tb.on{background:var(--card);color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* PANEL / HOME */
  .greet{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .greet .h{font-size:19px;font-weight:800}.greet .d{font-size:12px;color:var(--sub);margin-top:1px}
  .kur{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;margin-bottom:12px;font-size:12.5px;font-weight:800;box-shadow:var(--sh)}
  .kur .up{margin-left:auto;font-size:11px;color:var(--ind2);cursor:pointer}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .tile{border-radius:15px;padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;color:#fff}
  .tile.b1{background:linear-gradient(135deg,#1c7a52,#12a06a)}
  .tile.b2{background:linear-gradient(135deg,#c14b47,#d9534f)}
  .tile.b3{background:linear-gradient(135deg,#7a4fd0,#9b6ee0)}
  .tile.b4{background:linear-gradient(135deg,#b5701a,#d59433)}
  .tile .l{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;opacity:.9}
  .tile .v{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
  .tile .v.sm{font-size:16px}
  .tile .em{position:absolute;right:-6px;bottom:-10px;font-size:46px;opacity:.16}

  .todo{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
  .todo:last-child{border-bottom:none}
  .todo .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 34px}
  .todo .m{flex:1;min-width:0}.todo .m .t{font-size:13px;font-weight:700}.todo .m .s{font-size:11px;color:var(--sub);margin-top:1px}

  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .mcell{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 4px 9px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative}
  .mcell:active{background:var(--ln2)}
  .mcell .mi{width:36px;height:36px;margin:0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--thr-s)}
  .mcell .mx{font-size:10px;font-weight:700;margin-top:6px;line-height:1.2}
  .mcell .bd{position:absolute;top:6px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .trend{padding:13px}
  .trend .th{display:flex;justify-content:space-between;align-items:baseline}
  .trend .th .a{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--sub)}
  .trend .th .v{font-size:16px;font-weight:800}
  .trend svg{display:block;width:100%;height:46px;margin-top:6px}

  /* NAV / FAB */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 16px rgba(20,40,70,.07)}
  nav button{flex:1;background:none;border:none;padding:5px 2px;color:var(--sub);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button .i{font-size:20px;line-height:1}nav button.on{color:var(--ind2)}
  .fab{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--ind2);color:#fff;border:none;font-size:29px;box-shadow:0 6px 18px rgba(217,83,79,.45);z-index:25;cursor:pointer;display:none;align-items:center;justify-content:center}
  .fab.show{display:flex}.fab:active{transform:scale(.94)}

  /* MODAL */
  .ov{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet .hd{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:2}
  .sheet .hd h3{font-size:17px;font-weight:800}
  .sheet .hd .x{background:var(--ln2);border:none;width:32px;height:32px;border-radius:50%;font-size:17px;color:var(--sub);cursor:pointer}
  .sheet .bd{padding:4px 18px calc(28px + env(safe-area-inset-bottom))}
  label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--sub);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--ln);border-radius:12px;font-size:15px;background:#fbfcfe;outline:none;font-family:inherit;color:var(--ink)}
  input:focus,select:focus{border-color:var(--ind2);background:#fff}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ckrow{display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink);margin:12px 0 2px}
  .ckrow input{width:20px;height:20px;flex:0 0 auto;padding:0}
  .dbox{margin-top:12px;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
  .dline{display:flex;justify-content:space-between;gap:12px;padding:9px 13px;font-size:13.5px;border-top:1px solid var(--ln2)}
  .dline:first-child{border-top:none}.dline span{color:var(--sub)}.dline b{text-align:right;max-width:62%}
  .exhead{display:flex;gap:8px;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--sub);padding:6px 4px;border-bottom:1px solid var(--ln)}
  .exhead span:first-child{flex:1}.exhead span:nth-child(2){width:90px;text-align:right}.exhead span:last-child{width:90px;text-align:right}
  .exrow{display:flex;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ln2)}
  .exl{flex:1;min-width:0}.exl b{font-size:13.5px;font-weight:700}.exl small{display:block;color:var(--sub);font-size:11px}
  .exb{width:90px;text-align:right;font-size:13px;font-weight:700}.exr{width:90px;text-align:right;font-size:13.5px;font-weight:800}
  .exb.neg,.exr.neg{color:var(--bad)}.exb.pos,.exr.pos{color:var(--good)}
  .btn{width:100%;padding:14px;border:none;border-radius:13px;background:var(--ind2);color:#fff;font-size:15px;font-weight:800;margin-top:18px;cursor:pointer}
  .btn:active{opacity:.9}.btn.ghost{background:var(--ln2);color:var(--ind)}.btn.danger{background:var(--bad-s);color:var(--bad)}.btn.g{background:var(--good)}.btn.sm{padding:11px;font-size:13.5px;margin-top:0}
  .seg2{display:flex;background:var(--ln2);border-radius:11px;padding:3px}
  .seg2 .o{flex:1;text-align:center;padding:9px;font-size:12.5px;font-weight:800;color:var(--sub);border-radius:9px;cursor:pointer}
  .seg2 .o.on{background:var(--card);color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}
  .li:last-child{border-bottom:none}
  .li .lt{flex:1;font-size:13.5px}.li .lt small{display:block;color:var(--sub);font-size:11px}
  .del{background:var(--bad-s);color:var(--bad);border:none;width:28px;height:28px;border-radius:8px;font-size:15px;cursor:pointer;flex:0 0 28px}
  .total{background:#eef4fb;border-radius:12px;padding:13px 15px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
  .total .l{font-size:12px;color:var(--sub);font-weight:700}.total .v{font-size:22px;font-weight:800;color:var(--ind)}
  .step{display:flex;align-items:center;gap:9px}
  .step .b{width:34px;height:34px;border-radius:9px;background:var(--ln2);color:var(--ind);border:none;font-size:19px;font-weight:800;cursor:pointer}.step .b.p{background:var(--ind);color:#fff}
  .step input{width:60px;text-align:center;padding:9px}
  .step.sm{gap:5px}.step.sm .b{width:28px;height:28px;font-size:16px;border-radius:7px}.step.sm input{width:44px;padding:6px}
  .renkrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .sw{width:30px;height:30px;flex:0 0 30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
  .sw.sm{width:20px;height:20px;flex:0 0 20px;cursor:default}
  .renkrow .rad{flex:1;margin:0}.renkrow .rst{width:66px;flex:0 0 66px;margin:0;text-align:center}
  .renksel{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--ln)}
  .renksel .rn{font-size:14px;font-weight:700;flex:1}.renksel .rs{font-size:11px;color:var(--sub);font-weight:700;text-align:right}.renksel .rs.bad{color:var(--bad)}
  .bedenbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .bchip{display:inline-flex;align-items:center;gap:5px;background:var(--ind);color:#fff;font-size:12.5px;font-weight:800;padding:6px 8px 6px 11px;border-radius:9px}
  .bchip i{cursor:pointer;font-style:normal;opacity:.75;font-size:11px}
  .binp{width:70px!important;padding:8px 10px!important;margin:0!important}
  .brow{display:flex;align-items:center;gap:8px;margin-top:7px}
  .brow .bn{flex:1;margin:0;font-weight:700}
  .renkcard{border:1px solid var(--ln);border-radius:13px;padding:11px;margin-top:10px;background:#fbfcfe}
  .rc-top{display:flex;align-items:center;gap:8px}.rc-top .rad{flex:1;margin:0}
  .rc-body{display:flex;gap:10px;margin-top:0}
  .rc-foto{width:72px;height:72px;flex:0 0 72px;border:1px dashed var(--ln);border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--sub);font-weight:700;cursor:pointer;overflow:hidden;background:#fff}
  .rc-foto img{width:100%;height:100%;object-fit:cover}
  .rc-fields{flex:1;min-width:0}.rc-fields label{margin:9px 0 4px}.rc-fields input{padding:9px 11px}
  .rc-kirikh{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--ind2);cursor:pointer;user-select:none}
  .rc-kirik{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .kb{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
  .kb span{font-size:11px;font-weight:800;color:var(--sub)}.kb input{width:52px;text-align:center;padding:7px 4px}
  .islemrow{display:flex;gap:7px;align-items:center;margin-top:8px}.islemrow select{flex:1;padding:10px}
  .aclist{display:none;border:1px solid var(--ln);border-radius:11px;margin-top:4px;overflow:hidden;max-height:260px;overflow-y:auto}
  .acitem{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:14px;font-weight:700;cursor:pointer;border-top:1px solid var(--ln2)}
  .acitem:first-child{border-top:none}.acitem:active{background:var(--ln2)}
  .acitem small{display:block;color:var(--sub);font-size:11px;font-weight:600}
  .acitem.yeni{color:var(--ind2)}
  .acav{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--ind2);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .acav img{width:100%;height:100%;object-fit:cover}
  .pchip{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--ln);font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap;cursor:pointer}
  .pchip.on{background:var(--ind2);color:#fff;border-color:var(--ind2)}
  .pstep{display:inline-flex;align-items:center;gap:9px;background:var(--ln2);border-radius:9px;padding:4px 6px}
  .pstep.sm button{width:26px;height:26px}
  .pstep button{width:30px;height:30px;border:none;background:var(--card);border-radius:7px;font-size:17px;font-weight:800;color:var(--ind);cursor:pointer;box-shadow:var(--sh)}
  .pstep b{min-width:20px;text-align:center;font-size:14px}
  /* ---- Pazaryeri (müşteri portalı) ---- */
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .pcard{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(20,29,43,.07);cursor:pointer;position:relative;display:flex;flex-direction:column}
  .pcard .pimg{position:relative;width:100%;aspect-ratio:1;background:linear-gradient(135deg,#eef2f8,#dde6f2);display:flex;align-items:center;justify-content:center;font-size:52px}
  .pcard .pimg img{width:100%;height:100%;object-fit:cover}
  .pcard .pbadge{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px;color:#fff;letter-spacing:.3px}
  .pcard .padd{position:absolute;bottom:8px;right:8px;width:38px;height:38px;border-radius:50%;background:var(--ind2);color:#fff;border:none;font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(217,83,79,.45);cursor:pointer;line-height:1}
  .pcard .pbody{padding:9px 11px 12px}
  .pcard .pnm{font-size:13px;font-weight:700;line-height:1.25;height:2.5em;overflow:hidden}
  .pcard .pfy{font-size:16.5px;font-weight:800;color:var(--ind);margin-top:5px}
  .pcard .pfy small{font-size:11px;font-weight:600;color:var(--sub)}
  .pdots{display:flex;gap:4px;margin-top:7px;align-items:center}
  .pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--ln)}
  .psearch{width:100%;padding:12px 15px 12px 40px;border:none;border-radius:13px;font-size:14px;background:var(--card);box-shadow:0 2px 8px rgba(20,29,43,.06);outline:none}
  .pcartbadge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}

function kademeler(){return (db.kademe&&db.kademe.length)?db.kademe.slice().filter(k=>+k.min>0).sort((a,b)=>a.min-b.min):[]}
function kademeIsk(mik){let ind=0;kademeler().forEach(k=>{if((+mik||0)>=(+k.min||0))ind=+k.ind||0});return ind}
function portalKalemFiyat(k){const u=urun(k.uid);const base=u?portalFiyat(u):(+k.fiyat||0);
  const indirimli=u?portalEskiFiyat(u)>0:false; // zaten promosyonlu ürüne ayrıca kademe indirimi uygulanmaz
  const ind=indirimli?0:kademeIsk(k.mik);return {base,ind,net:ind?Math.round(base*(1-ind/100)):base}}
function portalTotal(){return portalSepet.reduce((a,k)=>{const f=portalKalemFiyat(k);return a+f.net*k.mik},0)}
function portalListeTotal(){return portalSepet.reduce((a,k)=>a+portalKalemFiyat(k).base*k.mik,0)}
function seqFix(d){ // id çakışmasını önle: her sıra numarasını mevcut en yüksek id'nin üstüne çek
  d.seq=d.seq||{};
  d.hareketler=d.hareketler||[];
  const mx=(arr,base)=>{let m=base;(arr||[]).forEach(x=>{if(x&&+x.id>m)m=+x.id});return m+1};
  d.seq.hr=Math.max(d.seq.hr||0,mx(d.hareketler,1000));
  d.seq.c=Math.max(d.seq.c||0,mx(d.cariler,1000));
  d.seq.u=Math.max(d.seq.u||0,mx(d.urunler,1000));
  d.seq.s=Math.max(d.seq.s||0,mx(d.satislar,1000));
  d.seq.cek=Math.max(d.seq.cek||0,mx(d.cekler,1000));
  d.seq.ie=Math.max(d.seq.ie||0,mx(d.isemirleri,1000));
  d.seq.h=Math.max(d.seq.h||0,mx(d.hammadde,1000));
  d.seq.oh=Math.max(d.seq.oh||0,mx(d.hesaplar,1000));
  // eski id-çakışması onarımı: aynı id'li cari varsa yeni id ver, referansları isimle taşı
  const gorulen={};
  (d.cariler||[]).forEach(c=>{
    if(gorulen[c.id]){const oldId=c.id,newId=d.seq.c++;
      (d.satislar||[]).forEach(s=>{if(s.mid===oldId&&s.mus===c.ad)s.mid=newId});
      (d.cekler||[]).forEach(k=>{if(k.cariId===oldId&&k.cari===c.ad)k.cariId=newId});
      c.id=newId;
    }else gorulen[c.id]=1;
  });
  // eski string renkleri obje formuna çevir (renk renk stok için)
  const NM={'#111111':'Siyah','#f2f2ee':'Beyaz','#ffffff':'Beyaz','#1d2f52':'Lacivert','#8a8f98':'Gri','#e8e2d4':'Bej','#5a1220':'Bordo','#2b2b2b':'Antrasit','#0f9d63':'Yeşil','#c8891a':'Hardal','#7a4fd0':'Mor','#e0455f':'Kırmızı'};
  (d.urunler||[]).forEach(u=>{
    if(!Array.isArray(u.renkler))return;
    const hasStr=u.renkler.some(r=>typeof r==='string');
    if(hasStr&&!u.renkler.some(r=>r&&typeof r==='object')){
      const n=u.renkler.length,pay=Math.floor((u.stok||0)/n);
      u.renkler=u.renkler.map((hex,i)=>({ad:NM[hex]||('Renk '+(i+1)),hex,foto:'',barkod:'869'+(100000000+((u.id||0)*100+i)%900000000),stok:i===0?((u.stok||0)-pay*(n-1)):pay,kirik:null}));
    }
  });
}

const CANLI_DOMEN={

// Rol → hangi alanları OKUR / YAZAR (veri seviyesinde sınır; arayüz gizlemesiyle birlikte)
const _CTUM=Object.keys(CANLI_DOMEN);

const ROL_YAZ={admin:_CTUM,ortak:_CTUM,magaza:['stok','cari','satis','ayar'],depocu:['stok'],fason:[],musteri:[],calisan:[]};
// Bilinen rol → kendisi; bilinmeyen/'?' (sahip, kullanicilar belgesi yoksa) → admin (bulut kuralları asıl kapıyı tutar)
function canliRol(){const r=(bulutKul&&bulutKul.rol);return (r&&ROL_OKU[r])?r:'admin';}
let canliAcik=false,_canliUnsub=[],_canliGolge={},_canliUygulaniyor=false,_canliYazT=null,_canliUyari=false;
function canliIzinHata(e){const c=(e&&e.code)||'';if(c==='permission-denied'&&!_canliUyari){_canliUyari=true;toast('☁️ Senkron İZNİ YOK — Firebase Rules güncel mi + yönetici hesabıyla giriş yaptın mı?');}return c;}
function canliAl(obj,domen){const o={};CANLI_DOMEN[domen].forEach(k=>{if(obj[k]!==undefined)o[k]=obj[k];});return o;}
function canliRef(domen){return _fb.collection('isletme').doc(MAGAZA_ID).collection('veri').doc(domen);}
// Dinleyicileri kur — ilk snapshot buluttaki veriyi getirir (başka cihaz katılınca)
function canliBaslat(sessiz){
  if(canliAcik)return true; if(!bulutBaslat())return false;
  try{autoYedek('senkron öncesi')}catch(e){} // buluttan gelen ilk veri yerelin üzerine yazmadan önce güvenlik yedeği
  canliAcik=true; db.canliBulut=true;
  (ROL_OKU[canliRol()]||_CTUM).forEach(domen=>{
    const un=canliRef(domen).onSnapshot(snap=>{
      if(!snap.exists)return; const d=snap.data(); const js=JSON.stringify(canliAl(d,domen));
      if(js===_canliGolge[domen])return; // kendi yazımızın yankısı → atla
      _canliUygulaniyor=true;
      CANLI_DOMEN[domen].forEach(k=>{if(d[k]!==undefined)db[k]=d[k];});
      _canliGolge[domen]=js; localStorage.setItem(KEY,JSON.stringify(db));
      _canliUygulaniyor=false;

    },err=>{console.warn('canlı-dinle',domen,err&&err.code);canliIzinHata(err);});

function canliDur(){_canliUnsub.forEach(u=>{try{u()}catch(e){}});_canliUnsub=[];canliAcik=false;db.canliBulut=false;localStorage.setItem(KEY,JSON.stringify(db));}
// Bu cihazın verisini buluta gönder (ilk kurulum / ana cihaz)
async function canliGonder(){
  if(!bulutBaslat())return false;
  for(const domen of Object.keys(CANLI_DOMEN)){
    const data=canliAl(db,domen); _canliGolge[domen]=JSON.stringify(data);
    try{await canliRef(domen).set(data);}catch(e){toast('Yükleme hatası ('+domen+'): '+(e.message||e).slice(0,60));return false;}
  }

// save() → değişen domenleri buluta yaz (debounce)
function canliYaz(){

  clearTimeout(_canliYazT);
  _canliYazT=setTimeout(()=>{
    (ROL_YAZ[canliRol()]||_CTUM).forEach(domen=>{
      const data=canliAl(db,domen); const js=JSON.stringify(data);
      if(js!==_canliGolge[domen]){_canliGolge[domen]=js;
        canliRef(domen).set(data).catch(e=>{console.warn('canlı-yaz',domen,e&&e.code);if(canliIzinHata(e)!=='permission-denied'&&(''+e).includes('longer than'))toast('⚠️ '+domen+' verisi çok büyük (fotoğraflar) — canlı senkron için küçültün');});}

const ROL_AD={admin:'Yönetici',ortak:'Ortak',magaza:'Mağaza',depocu:'Depocu',musteri:'Müşteri',calisan:'Çalışan',fason:'Fason'};
// Portal kullanıcı: kendi hesabını oluşturur (onaysız — admin onaylayana kadar giremez)
// Giriş kimliği: '@' varsa e-posta; yoksa telefon → sentetik e-posta (Firebase e-posta ister ama kullanıcı telefonla girer)
function kimlikMail(x){x=(''+(x||'')).trim();if(!x)return '';if(x.includes('@'))return x.toLowerCase();const d=x.replace(/\D/g,'');return d?('u'+d+'@iqbasics.app'):'';}
async function bulutKayit(mail,pw,ad,tel,rolIstek,istenenCari){
  if(!bulutBaslat())return {ok:false,hata:'Bulut ayarlı değil'};
  const r=['musteri','calisan','fason','magaza','depocu','ortak'].includes(rolIstek)?rolIstek:'musteri';
  // Telefon birincil kimlik; e-posta yoksa telefondan üretilir
  const authMail=kimlikMail(mail||tel);
  if(!authMail)return {ok:false,hata:'Telefon (veya e-posta) gerekli'};
  try{
    const cred=await firebase.auth().createUserWithEmailAndPassword(authMail,pw);
    const uid=cred.user.uid;
    const prof={rol:r,ad:ad||'',tel:tel||'',mail:(mail||'').trim(),girisMail:authMail,onay:false,cariId:0,istenenCari:+istenenCari||0,olusturma:Date.now()};
    await _fb.collection('kullanicilar').doc(uid).set(prof);
    bulutKul={uid,...prof};
    return {ok:true};
  }catch(e){return {ok:false,hata:e.code==='auth/email-already-in-use'?'Bu telefon/e-posta zaten kayıtlı':(e.code||e.message)}}
}
// Portal kullanıcı / admin: giriş (telefon veya e-posta ile)
async function bulutGirisPortal(mail,pw){
  if(!bulutBaslat())return {ok:false,hata:'Bulut ayarlı değil'};
  const authMail=kimlikMail(mail);
  try{await firebase.auth().signInWithEmailAndPassword(authMail,pw);await bulutProfilYukle();await bulutRolVerisiYukle();return {ok:true};}
  catch(e){return {ok:false,hata:e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'?'Telefon/e-posta veya şifre hatalı':(e.code||e.message)}}
}
// Girişten sonra role göre bulut verisini yükle (müşteri: bakiye+geçmiş+sipariş; fason: iş emirleri)
async function bulutRolVerisiYukle(){
  if(!bulutKul||!bulutKul.onay)return;
  if(bulutKul.rol==='fason')await bulutFasonIsleriYukle();
  else if(bulutKul.rol==='musteri'){if(bulutKul.ad)portalMusAd=bulutKul.ad;await bulutMusteriYukleHepsi();}
}
// Sayfa yüklenince Firebase oturumu asenkron geri gelir — ilk auth durumunu bekle
let _authCozuldu=false;
function bulutAuthBekle(){return new Promise(res=>{
  if(!bulutBaslat())return res(null);
  try{
    if(_authCozuldu||typeof firebase.auth().onAuthStateChanged!=='function')return res(firebase.auth().currentUser||null);
    const unsub=firebase.auth().onAuthStateChanged(u=>{_authCozuldu=true;try{unsub()}catch(e){}res(u||null);});
    setTimeout(()=>res(firebase.auth().currentUser||null),2500);
  }catch(e){res(null)}
})}
async function bulutProfilYukle(){
  if(!bulutBaslat())return null;
  let u;try{u=firebase.auth().currentUser}catch(e){}
  if(!u){bulutKul=null;return null}
  try{const d=await _fb.collection('kullanicilar').doc(u.uid).get();
    bulutKul=d.exists?{uid:u.uid,...d.data()}:{uid:u.uid,mail:u.email,rol:'?',onay:false};
  }catch(e){bulutKul={uid:u.uid,rol:'?',onay:false}}
  return bulutKul;
}
async function bulutCikisPortal(){try{siparisDinlemeDur();siparisMusDur();}catch(e){}try{await firebase.auth().signOut()}catch(e){}bulutKul=null;}
function bulutAdminMi(){return !!(bulutKul&&bulutKul.rol==='admin')}

/* ---- Faz 3: Fason bulut iş emirleri ---- */
let fasonIsler=[];
// Fason: kendi iş emirlerini yükle
async function bulutFasonIsleriYukle(){
  if(!bulutBaslat()||!bulutKul)return [];
  try{const snap=await _fb.collection('fason_isemri').where('fasonUid','==',bulutKul.uid).get();
    fasonIsler=[];snap.forEach(d=>fasonIsler.push({bid:d.id,...d.data()}));
    // Tümünü tut (geçmiş dahil) — aktif/geçmiş ayrımı arayüzde yapılır
    fasonIsler=fasonIsler.sort((a,b)=>(a.termin||0)-(b.termin||0));
    return fasonIsler;
  }catch(e){console.warn('fasonis',e);return []}
}
// Fason: durum bildir (yeni→basladi→bitti→teslim)
async function bulutFasonDurum(bid,durum,teslimAdet){
  if(!bulutBaslat())return false;
  try{const u={durum,guncelleme:Date.now()};if(teslimAdet!=null&&teslimAdet!=='')u.teslimAdet=+teslimAdet;
    await _fb.collection('fason_isemri').doc(bid).update(u);
    const j=fasonIsler.find(x=>x.bid===bid);if(j){j.durum=durum;if(u.teslimAdet!=null)j.teslimAdet=u.teslimAdet;}
    return true;
  }catch(e){toast('Güncellenemedi: '+(e.message||e));return false}
}
// Admin: fason iş emirlerini buluta gönder (yalnız fason carisi + bulut hesabı eşleşen 'devam' duraklar aktif)
async function bulutFasonYayinla(){
  if(!bulutBaslat())return toast('☁️ Bulut ayarlı değil');
  if(!bulutGirisli())return bulutGirisIste('fasonyayin');
  await bulutProfilYukle();if(!bulutAdminMi())return toast('Yönetici hesabıyla giriş gerekli');
  const users=await bulutTumKullanicilar();
  const fmap={};users.filter(u=>u.rol==='fason'&&u.onay&&u.cariId).forEach(u=>fmap[u.cariId]=u.uid);
  const jobs=[];let n=0,atlanan=0;
  db.isemirleri.forEach(ie=>{(ie.duraklar||[]).forEach((d,ix)=>{
    if(!d.fasonId)return;
    if(!fmap[d.fasonId]){if(d.durum==='devam')atlanan++;return;}
    const renk=(d.gonderilenRenk&&Object.keys(d.gonderilenRenk).length)?Object.entries(d.gonderilenRenk).map(([ad,adet])=>({ad,adet})):(ie.renkDagilim||[]);
    const termin=ie.baslangic?ie.baslangic+(+ie.gun||0)*86400000:0;
    jobs.push(_fb.collection('fason_isemri').doc(ie.id+'_'+ix).set({
      fasonUid:fmap[d.fasonId],magaza:MAGAZA_ID,isEmriId:ie.id,durakIx:ix,
      urun:ie.urun||'',kod:ie.kod||'',islem:d.ad||'',adet:+d.gonderilen||+ie.hedef||0,birim:ie.birim||'adet',
      ucret:+d.ucret||0,renk,termin,not:d.not||'',foto:ie.foto||'',
      aktif:d.durum==='devam',guncellemeAdmin:Date.now()
    },{merge:true}));
    if(d.durum==='devam')n++;
  })});
  if(!jobs.length)return toast('Fasona bağlı iş yok. Önce fason kullanıcısını onaylayıp carisini bağlayın.');
  try{await Promise.all(jobs);toast('🧵 '+n+' aktif fason işi gönderildi'+(atlanan?' · '+atlanan+' iş: fason hesabı yok':'')+' ✓');}
  catch(e){toast('Gönderim hatası: '+(e.message||e))}
}
// Admin: fasonların bildirdiği durumları göster

    const users=await bulutTumKullanicilar();const uad={};users.forEach(u=>uad[u.uid]=u.ad||u.mail||'?');

    $('mB').innerHTML=h+'<div class="okbox" style="margin-top:8px">Not: Gerçek teslim alma / stok / ödeme işlemini Üretim ekranından elle yaparsınız. Burası fasonun bildirdiği durumdur.</div>';
  }catch(e){$('mB').innerHTML='<div class="mini" style="color:var(--bad)">Hata: '+esc(e.message||(''+e))+'</div>'}
}

// 🔔 OTOMATİK SİPARİŞ — yönetici: yeni siparişler CANLI düşer (manuel "Çek" gerekmez), bildirim verir
let _sipUnsub=null;
function siparisDinle(){
  if(_sipUnsub)return; if(!bulutBaslat()||!bulutGirisli())return;
  try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})}catch(e){}
  try{
    _sipUnsub=_fb.collection('siparisler').where('magaza','==',MAGAZA_ID).where('durum','==','yeni').onSnapshot(snap=>{
      let n=0;snap.forEach(doc=>{const o=doc.data();if((db.bekleyenPortal||[]).some(x=>x.bulutId===doc.id))return;
        db.bekleyenPortal.push({id:nid('bp'),bulutId:doc.id,mus:o.mus,mid:o.mid||0,tarih:o.tarih||o.olusturma||Date.now(),kalemler:o.kalemler||[],tutar:o.tutar||0,not:o.not||'',tel:o.tel||'',adres:o.adres||'',sehir:o.sehir||'',calisan:o.calisan||''});n++;});
      if(n){save();try{if(typeof render==='function'&&typeof cur!=='undefined')render()}catch(e){}
        toast('🔔 '+n+' yeni sipariş geldi!');
        try{if(navigator.vibrate)navigator.vibrate([90,40,90])}catch(e){}
        try{if('Notification'in window&&Notification.permission==='granted')new Notification('🔔 Yeni sipariş',{body:n+' yeni sipariş geldi — onay bekliyor'});}catch(e){}}
    },err=>{console.warn('sipdinle',err&&err.code);});
  }catch(e){console.warn('sipdinle',e);}
}

function panoGunOzet(){const b=new Date().setHours(0,0,0,0);
  const sat=db.satislar.filter(s=>s.tarih>=b&&s.tip!=='iade');
  const iade=db.satislar.filter(s=>s.tarih>=b&&s.tip==='iade');
  let tah=0;(db.hareketler||[]).filter(h=>h.tarih>=b&&h.tip==='tahsilat').forEach(h=>tah+=(+h.tutar||0));
  db.satislar.filter(s=>s.tarih>=b&&s.odenen>0).forEach(s=>tah+=s.odenen*satisDiv(s));
  const yeniSip=(db.bekleyenPortal||[]).filter(o=>(o.tarih||0)>=b).length;
  return {adet:sat.length,ciro:sat.reduce((a,s)=>a+s.tutar,0),tahsilat:tah,iade:iade.length,yeniSip};}
function enCokSatan(gun,n){const since=Date.now()-gun*86400000;const map={};
  db.satislar.filter(s=>s.tarih>=since&&s.tip!=='iade').forEach(s=>(s.kalemler||[]).forEach(k=>{
    const m=map[k.uid]||(map[k.uid]={uid:k.uid,ad:k.urun,adet:0,ciro:0});
    m.adet+=(+k.mik||0);m.ciro+=(+k.mik||0)*(+k.fiyat||0)*satisDiv(s);}));
  return Object.values(map).sort((a,b)=>b.adet-a.adet).slice(0,n||5);}
function ciroSeri(gun){const arr=[];const bugun=new Date().setHours(0,0,0,0);
  for(let i=gun-1;i>=0;i--){const g0=bugun-i*86400000,g1=g0+86400000;
    arr.push(db.satislar.filter(s=>s.tarih>=g0&&s.tarih<g1&&s.tip!=='iade').reduce((a,s)=>a+s.tutar,0));}
  return arr;}

function canSayim(){return db.rol==='depocu'||canUrunYaz()}
function depoSayim(){if(!canSayim())return toast('Yetkiniz yok');
  const list=[...db.urunler].filter(u=>!u.pasif).sort((a,b)=>(a.sonSayim||0)-(b.sonSayim||0));
  const today=new Date().toDateString();
  const bugunN=list.filter(u=>u.sonSayim&&new Date(u.sonSayim).toDateString()===today).length;
  const rows=list.map(u=>{const st=hasRenkStok(u)?stokTop(u):(u.stok||0);
    const sayilmis=u.sonSayim&&new Date(u.sonSayim).toDateString()===today;
    return `<div class="row" onclick="formSayim(${u.id},1)"><div class="av ${sayilmis?'g':'gray'}">${sayilmis?'✅':'📦'}</div><div class="mid"><div class="t">${esc(u.ad)}</div><div class="s">${esc(u.kod)} · 📍 ${u.raf?esc(u.raf):'<span style="color:var(--bad)">raf yok</span>'} · ${u.sonSayim?'son '+dstr(u.sonSayim):'hiç sayılmadı'}</div></div><div class="end"><div class="n">${st}</div><div class="u">${u.birim}</div></div></div>`}).join('');
  open_('📋 Depo Sayımı',`
    <button class="btn g" style="margin-bottom:10px" onclick="barkodOkutSayim()">📷 Barkod Okutarak Say</button>
    <div class="infobox">Her ürünü tek tek say; adedini ve rafını gir. Fark çıkarsa sistem otomatik düzeltir. En son sayılanlar en altta.</div>
    <div class="depoprog" style="margin-top:10px"><div class="bar"><i style="width:${list.length?Math.round(bugunN/list.length*100):0}%"></i></div><span class="lbl">${bugunN}/${list.length} bugün</span></div>
    <div class="card" style="margin-top:8px">${rows||emp('📦','Ürün yok')}</div>
  `);
}
function formSayim(id,fromList){const u=urun(id);if(!u)return;if(!canSayim())return toast('Yetkiniz yok');
  const cols=hasRenkStok(u);
  const rows=cols?renkObjs(u).map((r,i)=>`<div class="syrow"><span class="sw sm" style="background:${r.hex}"></span><span class="synm">${esc(r.ad||'—')}<small>sistemde ${r.stok||0} ${u.birim}</small></span><input id="sy-${i}" type="number" inputmode="numeric" min="0" value="${r.stok||0}" oninput="sayFark()" class="syin"></div>`).join('')
    :`<div class="syrow"><span class="synm">${esc(u.ad)}<small>sistemde ${u.stok||0} ${u.birim}</small></span><input id="sy-0" type="number" inputmode="numeric" min="0" value="${u.stok||0}" oninput="sayFark()" class="syin"></div>`;
  open_('📋 Sayım · '+u.ad,`
    <label>📍 RAF / Depo Yeri</label><input id="sy-raf" value="${esc(u.raf||'')}" placeholder="A-12">
    <div class="sec" style="margin-top:12px">Saydığın Adet ${cols?'<span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--sub)">— renk renk</span>':''}</div>
    <div class="card" style="padding:6px 12px">${rows}</div>
    <div class="mini" id="sy-fark" style="margin-top:8px"></div>
    <button class="btn" onclick="kaydetSayim(${id},${fromList?1:0})">✓ Sayımı Kaydet</button>
    ${fromList?`<button class="btn ghost sm" style="margin-top:8px" onclick="depoSayim()">← Sayım listesine dön</button>`:''}
  `);
  window._sayU=u; sayFark();
}
function sayFark(){const u=window._sayU;if(!u)return;const el=$('sy-fark');if(!el)return;
  const cols=hasRenkStok(u);let sis=0,say=0;
  if(cols)renkObjs(u).forEach((r,i)=>{sis+=(+r.stok||0);say+=Math.max(0,+($('sy-'+i)?.value||0))});
  else{sis=+u.stok||0;say=Math.max(0,+($('sy-0')?.value||0))}
  const f=say-sis;
  el.innerHTML=`Sistemde <b>${sis}</b> · saydın <b>${say}</b> · fark <b style="color:${f===0?'var(--good)':f<0?'var(--bad)':'var(--thr)'}">${f>0?'+':''}${f}</b>${f?' '+(f<0?'(eksik/kayıp)':'(fazla)'):' ✓'}`;
}
function kaydetSayim(id,fromList){const u=urun(id);if(!u)return;
  u.raf=($('sy-raf')?.value||'').trim();
  const cols=hasRenkStok(u);let sis=0,fark=0;
  if(cols){renkObjs(u).forEach((r,i)=>{sis+=(+r.stok||0);r.stok=Math.max(0,+($('sy-'+i)?.value||0))});u.stok=stokTop(u);fark=u.stok-sis}
  else{const c=Math.max(0,+($('sy-0')?.value||0));sis=+u.stok||0;fark=c-sis;u.stok=c}
  u.sonSayim=Date.now();save();
  toast(fark===0?'Sayım kaydedildi ✓ fark yok':`Sayım kaydedildi · fark ${fark>0?'+':''}${fark} ${u.birim}`);
  if(fromList)depoSayim();else{closeM();render()}
}

function resizeImg(file,cb,max=900,q=0.72){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{cb(c.toDataURL('image/jpeg',q))}catch(e){cb(r.result)}};img.src=r.result};r.readAsDataURL(file)}

function setKaynak(k){uKaynak=k;const a=$('kn-uretim'),b=$('kn-alim');if(a)a.classList.toggle('on',k==='uretim');if(b)b.classList.toggle('on',k==='alim');const tw=$('ted-wrap');if(tw)tw.style.display=k==='alim'?'':'none';const n=$('kaynak-not');if(n)n.textContent=k==='alim'?'Ürünü hazır aldın — geldiği firmayı (tedarikçi) aşağıda seç.':'Ürünü kendin üretiyorsun — kumaş/aksesuar Hammadde\'den, kesim/dikim/nakış takibi Üretim modülünden gelir.'}

function bTot(){const t=$('beden-tot');if(!t)return;const s=fBeden.reduce((a,x)=>a+(+x.adet||0),0);t.innerHTML=fBeden.length?`👕 Bir seri = <b>${s}</b> parça · ${fBeden.map(x=>x.beden+(x.adet>1?'×'+x.adet:'')).join(' + ')}`:''}

function urunAktifToggle(id){const u=urun(id);if(!u)return;u.pasif=!u.pasif;save();render();toast(u.pasif?'Pasife alındı (arşiv) 🗄️':'Aktif edildi ✓')}
function attachSwipe(){
  document.querySelectorAll('#stok-list .row[data-uid]').forEach(row=>{
    let sx=0,dx=0,active=false;
    const start=x=>{sx=x;dx=0;active=true;row.style.transition=''};
    const move=x=>{if(!active)return;dx=x-sx;if(dx<0)dx=0;row.style.transform=`translateX(${Math.min(dx,100)}px)`;row.style.background=dx>60?'var(--good-s)':''};
    const end=()=>{if(!active)return;active=false;row.style.transition='transform .2s';const go=dx>60;row.style.transform='';row.style.background='';if(go)urunAktifToggle(+row.dataset.uid)};
    row.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});
    row.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
    row.addEventListener('touchend',end);
  });
}

function urunSatisOzet(id){let seri=0,ciro=0,sonTarih=0;const renkSay={};
  db.satislar.forEach(s=>s.kalemler.forEach(k=>{if(k.uid===id){seri+=k.mik;ciro+=k.mik*k.fiyat;if(s.tarih>sonTarih)sonTarih=s.tarih;if(k.renkler)k.renkler.forEach(r=>{renkSay[r.ad]=(renkSay[r.ad]||0)+r.mik})}}));
  const best=Object.entries(renkSay).sort((a,b)=>b[1]-a[1])[0];
  return {seri,ciro,sonTarih,best};
}

function odemeSet(i,key,val){const l=sOdemeler[i];if(!l)return;if(key==='tutar')l.tutar=Math.max(0,+val||0);else if(key==='vade')l.vade=val?new Date(val).getTime():0;else if(key==='hesapId')l.hesapId=+val;else l[key]=val;if(key==='tutar'||key==='pb')odemeOzet();}

function odemeKalan(){const div=satisHesap().div;const saleTL=satisHesap().tutar*div;const kalanTL=saleTL-odemeToplamTL();if(kalanTL<=0)return toast('Kalan yok');
  const bos=sOdemeler.find(l=>!(+l.tutar));if(bos){bos.tutar=Math.round(kalanTL/pbKur(bos.pb))}else sOdemeler.push({tur:'Nakit',tutar:Math.round(kalanTL/pbKur(sPB)),pb:sPB,hesapId:(db.hesaplar[0]&&db.hesaplar[0].id)||0,vade:0,foto:''});cizOdeme()}

  </div>`).join('');

function odemeOzet(){const el=$('s-odeme-ozet');if(!el)return;const div=satisHesap().div;const saleTL=satisHesap().tutar*div;const paidTL=odemeToplamTL();const kesikTL=Math.max(0,+($('s-kesik')?.value||0))*div;const kalanTL=saleTL-paidTL-kesikTL;

}

function urunAra(){const q=($('s-urun-in')?.value||'').trim().toLowerCase();const box=$('s-urun-list');if(!box)return;
  if(!q){box.style.display='none';return}
  const list=db.urunler.filter(u=>!u.pasif&&(u.ad.toLowerCase().includes(q)||(u.kod||'').toLowerCase().includes(q)||(u.renkler||[]).some(r=>r&&typeof r==='object'&&(r.barkod||'')===q))).slice(0,10);
  if(list.length===1&&q.length>=2){box.style.display='none';sUrunId=list[0].id;urnBilgi();return}
  box.innerHTML=list.length?list.map(u=>`<div class="acitem" onclick="urunSec(${u.id})">${dots(u.renkler)}<span style="flex:1">${esc(u.ad)}<small>${esc(u.kod||'')} · ${u.stok} ${u.birim} · ${money(u.satis,u.pb||'TL')}</small></span></div>`).join(''):`<div class="acitem" style="color:var(--sub)">Ürün bulunamadı</div>`;

function urunSec(id){sUrunId=id;const u=urun(id);if($('s-urun-in'))$('s-urun-in').value=u?u.ad:'';$('s-urun-list').style.display='none';urnBilgi()}
function urunEnter(){const q=($('s-urun-in')?.value||'').trim().toLowerCase();if(!q)return;
  // renk barkodu tam eşleşirse: ürünü seç + o renkten +1 (okut-ekle)
  for(const u of db.urunler){if(u.pasif)continue;const objs=renkObjs(u);const idx=objs.findIndex(r=>(r.barkod||'').toLowerCase()===q);
    if(idx>=0){urunSec(u.id);setTimeout(()=>{const el=$('rq-'+idx);if(el){el.value=(+el.value||0)+1;if(typeof rqCheck==='function')rqCheck(idx,objs[idx].stok||0);toast('➕ '+esc(u.ad)+' · '+esc(objs[idx].ad))}},70);if($('s-urun-in'))$('s-urun-in').value='';return}}
  const u=db.urunler.find(x=>!x.pasif&&(x.kod||'').toLowerCase()===q)||db.urunler.find(x=>!x.pasif&&x.ad.toLowerCase().includes(q));
  if(u)urunSec(u.id);else toast('Ürün bulunamadı');
}
async function kameraTara(){
  if(!('BarcodeDetector' in window)){toast('Bu cihaz kamerayla taramayı desteklemiyor — kod/isim yazabilirsin');return}
  try{
    const det=new window.BarcodeDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.createElement('video');v.srcObject=stream;v.setAttribute('playsinline','');await v.play();
    open_('Barkod Tara','<div class="mini">Barkodu kameraya gösterin</div><div id="cam-wrap" style="margin-top:10px;border-radius:12px;overflow:hidden;background:#000"></div>');
    $('cam-wrap').appendChild(v);v.style.width='100%';
    let done=false;const tick=async()=>{if(done)return;try{const codes=await det.detect(v);if(codes.length){done=true;stream.getTracks().forEach(t=>t.stop());const val=codes[0].rawValue;closeM();setTimeout(()=>{if($('s-urun-in')){$('s-urun-in').value=val;urunEnter()}},200);return}}catch(e){}requestAnimationFrame(tick)};tick();
    $('ov').addEventListener('click',function h(e){if(e.target.id==='ov'){done=true;stream.getTracks().forEach(t=>t.stop());$('ov').removeEventListener('click',h)}});
  }catch(e){toast('Kameraya erişilemedi')}
}
const MUS_GRUP=['Bayi','Toptancı','Aracı','Perakende','Özel'];
function grupIsk(g){return {Bayi:5,'Toptancı':7,'Aracı':6,'Özel':8,Perakende:0}[g]||0}
function musBilgi(){const m=sMusId?cari(sMusId):null;const el=$('s-musinfo');if(!el)return;if(!m){el.innerHTML='';return}
  const asim=m.bakiye>0&&m.limit&&m.bakiye>m.limit*0.9;
  const gi=grupIsk(m.grup);if($('s-isk')&&!sEdit){$('s-isk').value=gi;cizSepet()}
  let ek='';
  if(m.yabanci){ek=`<div class="warnbox" style="margin-top:8px">🌍 Yabancı müşteri${m.ulke?' · '+esc(m.ulke):''}${m.kod?' · kod '+esc(m.kod):''}<br><b>Kargoda gümrük / marka / fatura masrafı çıkabilir — taşımaya ekle.</b></div>`}
  else if(m.adres||m.ambar){ek=`<div class="infobox" style="margin-top:8px">📍 ${esc([m.adres,m.ambar].filter(Boolean).join(' · '))}</div>`}
  el.innerHTML=`<div class="${asim?'warnbox':'infobox'}" style="margin-top:8px">${asim?'⚠️':'ℹ️'} Borç: <b>${TL(Math.max(0,m.bakiye))}</b>${m.limit?` / limit ${TL(m.limit)}`:''}${m.grup?` · ${m.grup}${gi?' (−%'+gi+' indirim)':''}`:''}${asim?' · limite yakın!':''}</div>${ek}`}
function satisHesap(){
  const ara=sepet.reduce((a,k)=>a+k.mik*k.fiyat,0);
  const isk=Math.min(100,Math.max(0,+($('s-isk')?.value||0))), vf=vadeFarkiYuzde(), kdv=Math.max(0,+($('s-kdv')?.value||0)), tasima=Math.max(0,+($('s-tasima')?.value||0));
  const div=sPB==='USD'?db.kurUSD:sPB==='EUR'?db.kurEUR:1;
  const mal=ara*(1-isk/100)*(1+vf/100);   // TL bazı, indirim + vade farkı sonrası
  const kdvTutar=mal*kdv/100;
  const malPB=mal/div, kdvPB=kdvTutar/div;
  const tutar=malPB+kdvPB+tasima;         // satış para biriminde
  return {ara,isk,vf,kdv,tasima,div,malPB,kdvPB,tutar};
}
function sonFiyat(mid,uid){if(!mid)return 0;const ss=db.satislar.filter(s=>s.mid===mid).sort((a,b)=>b.tarih-a.tarih);for(const s of ss){const k=(s.kalemler||[]).find(x=>x.uid===uid);if(k)return k.fiyat}return 0}
function musUrunFiyat(uid){const u=urun(uid);if(!u)return 0;return sonFiyat(sMusId,uid)||(u.satis*birimAdet(u))}
function urnBilgi(){const u=sUrunId?urun(sUrunId):null;const info=$('s-urninfo'),rb=$('s-renkler'),box=$('s-mikbox');if(!rb)return;
  if(!u){if(box)box.style.display='none';rb.innerHTML='';if(info)info.textContent='';return}
  const objs=renkObjs(u);const eski=sonFiyat(sMusId,u.id);const fy=eski||(u.satis*birimAdet(u));const pb=u.pb||'TL';
  const seriNot=(u.birim==='seri'&&birimAdet(u)>1)?` · ${money(u.satis,pb)}/parça × ${u.seri}`:'';
  const fiyatRow=`<div style="margin:8px 0 2px"><div style="display:flex;gap:8px;align-items:center"><label style="margin:0;flex:0 0 auto">Bu satış fiyatı</label><input id="s-fiyat" type="number" inputmode="numeric" min="0" value="${fy}" style="width:120px;margin:0;padding:9px" oninput="fiyatBilgi()"><span class="mini">/${u.birim} (${pb})${seriNot}</span></div><div class="mini" id="s-fiyat-info" style="margin-top:5px"></div></div>`;
  if(objs.length){
    if(box)box.style.display='none';if(info)info.textContent='';
    rb.innerHTML=`<div class="mini" style="margin:10px 0 2px">🎨 <b>${esc(u.ad)}</b> — renk renk adet gir:</div>`+fiyatRow+objs.map((r,i)=>`<div class="renksel"><span class="sw sm" style="background:${r.hex}"></span><span class="rn">${esc(r.ad||'—')}</span><span class="rs ${r.stok<=0?'bad':''}">stok ${r.stok||0}</span><div class="step sm"><button class="b" onclick="rq(${i},-1)">−</button><input id="rq-${i}" type="number" value="0" inputmode="numeric" min="0" oninput="rqCheck(${i},${r.stok||0})"><button class="b p" onclick="rq(${i},1,${r.stok||0})">+</button></div></div>`).join('')+`<button type="button" class="btn ghost sm" style="margin-top:9px" onclick="sepEkle()">+ Sepete Ekle</button>`;
  }else{
    if(box)box.style.display='block';rb.innerHTML=`<div class="mini" style="margin-top:8px">${esc(u.ad)} · Stok: ${u.stok} ${u.birim}</div>`+fiyatRow;
    if(info)info.innerHTML='';
  }
  fiyatBilgi();
}
function fiyatBilgi(){const u=sUrunId?urun(sUrunId):null;const el=$('s-fiyat-info');if(!u||!el)return;const pb=u.pb||'TL';const fy=+($('s-fiyat')?.value)||0;const eski=sonFiyat(sMusId,u.id);const maliyet=(u.alis||0)*birimAdet(u);const kar=fy-maliyet;const ky=maliyet?Math.round(kar/maliyet*100):0;
  const parts=[];
  if(karGoster())parts.push(`maliyet <b>${money(maliyet,pb)}</b>${u.birim==='seri'&&birimAdet(u)>1?'<span class="mini">/seri</span>':''} · kâr <b class="${kar>=0?'pos':'neg'}">${money(kar,pb)}${maliyet?' (%'+ky+')':''}</b>`);
  if(eski)parts.push(`<span style="color:var(--ind2);font-weight:700">🧠 müşteri en son ${money(eski,pb)} aldı</span>`);
  el.innerHTML=parts.join(' · ');
}
function rq(i,d,stok){const el=$('rq-'+i);if(!el)return;let v=Math.max(0,(+el.value||0)+d);el.value=v;if(stok!=null&&v>stok)toast('⚠️ Stokta '+stok+' var, fazlasını giriyorsun')}
function rqCheck(i,stok){const el=$('rq-'+i);if(!el)return;if(+el.value<0)el.value=0;if((+el.value||0)>stok)toast('⚠️ Stokta '+stok+' var, fazlasını giriyorsun')}
function mik(d){const i=$('s-mik');i.value=Math.max(1,(+i.value||1)+d)}
function setPB(pb){sPB=pb;['TL','USD','EUR'].forEach(x=>$('pb-'+x).classList.toggle('on',x===pb));cizSepet()}
function setVade(g){sVade=+g;cizSepet()}
function satisReset(){sUrunId=0;if($('s-urun-in'))$('s-urun-in').value='';if($('s-renkler'))$('s-renkler').innerHTML='';if($('s-mikbox'))$('s-mikbox').style.display='none';if($('s-urninfo'))$('s-urninfo').textContent='';if($('s-mik'))$('s-mik').value=1}
function sepEkle(){const u=sUrunId?urun(sUrunId):null;if(!u)return toast('Önce ürün seç');
  const fy=($('s-fiyat')&&$('s-fiyat').value!=='')?Math.max(0,+$('s-fiyat').value||0):musUrunFiyat(u.id);
  const objs=renkObjs(u);
  if(objs.length){
    const rl=[];objs.forEach((r,i)=>{const q=+($('rq-'+i)?.value||0);if(q>0)rl.push({ad:r.ad,mik:q})});
    if(!rl.length)return toast('En az bir renk için adet gir');
    const exist=sepet.find(k=>k.uid===u.id&&k.renkler);
    if(exist){rl.forEach(nr=>{const f=exist.renkler.find(x=>x.ad===nr.ad);if(f)f.mik+=nr.mik;else exist.renkler.push(nr)});exist.mik=exist.renkler.reduce((a,x)=>a+x.mik,0)}
    else sepet.push({uid:u.id,urun:u.ad,mik:rl.reduce((a,x)=>a+x.mik,0),birim:u.birim,fiyat:fy,renkler:rl});
    satisReset();cizSepet();return;
  }
  const m=+$('s-mik').value;if(!m||m<=0)return toast('Miktar girin');
  const ex=sepet.find(k=>k.uid===u.id&&!k.renkler);if(ex)ex.mik+=m;else sepet.push({uid:u.id,urun:u.ad,mik:m,birim:u.birim,fiyat:fy});satisReset();cizSepet()}
function vadeFarkiYuzde(){return sVade?Math.round(sVade/30)*2.5:0}
function cizSepet(){
  const el=$('s-sepet');if(!el)return;
  el.innerHTML=sepet.map((k,i)=>{const sub=k.renkler&&k.renkler.length?`${k.renkler.map(r=>esc(r.ad)+' ×'+r.mik).join(' · ')} — ${TL(k.fiyat)}/${k.birim}`:`${k.mik} ${k.birim} × ${TL(k.fiyat)}`;return `<div class="li"><div class="lt">${esc(k.urun)}<small>${sub}</small></div><b style="margin-right:8px">${TL(k.mik*k.fiyat)}</b><button class="del" onclick="sepet.splice(${i},1);cizSepet()">✕</button></div>`}).join('')||'<div class="mini">Sepet boş</div>';
  const h=satisHesap();const parts=[];
  if(h.isk)parts.push(`iskonto −%${h.isk}`);
  if(h.vf)parts.push(`vade +%${h.vf}`);
  if(h.kdv)parts.push(`KDV +${money(h.kdvPB,sPB)}`);
  if(h.tasima)parts.push(`taşıma +${money(h.tasima,sPB)}`);
  $('s-top').innerHTML=money(h.tutar,sPB)+(parts.length?`<div style="font-size:11px;color:var(--thr);font-weight:700">${parts.join(' · ')}</div>`:'');
  if($('s-odeme-ozet'))odemeOzet();
}
function satisDiv(s){return s.satisKur||(s.pb==='USD'?db.kurUSD:s.pb==='EUR'?db.kurEUR:1)}
function stokUygula(k,mult){ // mult=-1 satış (düş), +1 iptal (geri)
  const u=urun(k.uid);if(!u)return;
  if(k.renkler&&k.renkler.length&&Array.isArray(u.renkler)){
    k.renkler.forEach(rr=>{const ro=u.renkler.find(x=>x&&typeof x==='object'&&x.ad===rr.ad);if(ro)ro.stok=(+ro.stok||0)+mult*rr.mik});
    syncStok(u);
  }else{u.stok+=mult*k.mik}
}
function applySatis(s){
  const m=cari(s.mid),div=satisDiv(s);
  s.kalemler.forEach(k=>stokUygula(k,-1));
  if(m)m.bakiye+=(s.tutar-s.odenen-(s.kesik||0))*div;
  if(m&&s.kesik)m.kesikToplam=(m.kesikToplam||0)+s.kesik*div;
  (s.odemeler||[]).forEach(l=>{const lTL=(+l.tutar||0)*pbKur(l.pb);l._tl=lTL;if(lTL<=0)return;
    if(l.tur==='Çek'){const c={id:nid('cek'),tur:'cek',tip:'alinan',cariId:s.mid,cari:s.mus,tutar:lTL,vade:l.vade||(Date.now()+30*86400000),banka:'—',durum:'portfoyde',foto:l.foto||''};db.cekler.push(c);l._cekId=c.id}
    else if(l.tur==='Kredi Kartı'){const c={id:nid('cek'),tur:'kk',tip:'alinan',cariId:s.mid,cari:s.mus,tutar:lTL,vade:l.vade||(Date.now()+34*86400000),banka:'Kredi Kartı POS',durum:'portfoyde'};db.cekler.push(c);l._cekId=c.id}
    else{const h=l.tur==='Havale'?hesap(l.hesapId):(db.hesaplar.find(x=>/nakit|kasa/i.test(x.ad))||db.hesaplar[0]);if(h){h.bakiye+=lTL;l._hesapId=h.id}}
  });
}
function revertSatis(s){
  const m=cari(s.mid),div=satisDiv(s);
  s.kalemler.forEach(k=>stokUygula(k,1));
  if(m)m.bakiye-=(s.tutar-s.odenen-(s.kesik||0))*div;
  if(m&&s.kesik)m.kesikToplam=(m.kesikToplam||0)-s.kesik*div;

  const data={tip:'satis',mid:m.id,mus:m.ad,kalemler:sepet.map(k=>({uid:k.uid,urun:k.urun,mik:k.mik,birim:k.birim,fiyat:k.fiyat,renkler:k.renkler?k.renkler.map(r=>({...r})):undefined})),araToplam:h.ara,iskonto:h.isk,vadeFarki:h.vf,kdv:h.kdv,kdvTutar:h.kdvPB,tasima:h.tasima,sevkiyat:($('s-sevk')?.value||'').trim(),tutar,odenen:oden,kesik,pb:sPB,satisKur:div,durum:'tamam',teslimDurum:sDurum,depo:$('s-depo')?.checked?((old&&old.depo==='hazir')?'hazir':'bekliyor'):null,foto:sFoto||'',odemeler,odemeTur:odetur};
  const commit=()=>{

    if(sEdit&&old){data.id=old.id;data.tarih=old.tarih;Object.assign(old,data);applySatis(old);save();closeM();go('satis');toast('Satış güncellendi ✓')}
    else{data.id=nid('s');data.tarih=Date.now();db.satislar.push(data);applySatis(data);save();closeM();go('satis');toast('Satış kaydedildi ✓ '+money(tutar,sPB))}
  };
  const eskiBorc=old?(old.tutar-old.odenen-(old.kesik||0))*satisDiv(old):0;
  const yeniBorc=m.bakiye-eskiBorc+(tutar-oden-kesik)*div;
  const doLimit=()=>{if(m.limit&&yeniBorc>m.limit)askConfirm(`${m.ad} kredi limitini aşıyor:\nYeni borç ${TL(yeniBorc)} / limit ${TL(m.limit)}\n\nYine de kaydedilsin mi?`,commit,'Kaydet');else commit()};
  // stok yeterlilik kontrolü (düzenlemede eski adet geri sayılır)
  const stokAsim=[];sepet.forEach(k=>{const u=urun(k.uid);if(!u)return;let mevcut=stokTop(u);if(old){const ok=old.kalemler.find(z=>z.uid===k.uid);if(ok)mevcut+=ok.mik}if(k.mik>mevcut+0.001)stokAsim.push(`${u.ad}: elde ${mevcut}, satılan ${k.mik}`)});
  if(stokAsim.length)askConfirm(`⚠️ Stok yetersiz — stok eksiye düşecek:\n${stokAsim.join('\n')}\n\nYine de satılsın mı?`,doLimit,'Yine de Sat');
  else doLimit();

function cariEkstre(id){
  const c=cari(id);const evs=[];const isMus=c.tip==='musteri';
  db.satislar.filter(s=>s.mid===id).forEach(s=>{const div=satisDiv(s);
    evs.push({t:s.tarih,ad:'Satış',det:s.kalemler.map(k=>k.urun).join(', ').slice(0,40),borc:s.tutar*div,sid:s.id});
    if(s.odenen>0)evs.push({t:s.tarih+1,ad:'Ödeme (satışta)',det:s.odemeTur||'',alacak:s.odenen*div});
    if(s.kesik>0)evs.push({t:s.tarih+2,ad:'Kesik',det:'müşteri kırdı',alacak:s.kesik*div});
  });
  (db.hareketler||[]).filter(h=>h.cariId===id).forEach(h=>{
    const isTah=h.tip==='tahsilat';
    if(h.tutar>0)evs.push({t:h.tarih,ad:isTah?'Tahsilat':'Ödeme',det:h.tur||'',[isMus===isTah?'alacak':'borc']:h.tutar});
    if(h.kesik>0)evs.push({t:h.tarih+1,ad:'Kesik',det:'müşteri kırdı',alacak:h.kesik});
  });
  evs.sort((a,b)=>a.t-b.t);
  const net=evs.reduce((a,e)=>a+(e.borc||0)-(e.alacak||0),0);
  const devir=(c.bakiye||0)-net;
  return {evs,devir};
}

function cekTakvim(){
  const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+cekAyOfset);
  const yy=base.getFullYear(),mm=base.getMonth();
  const AYAD=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const dim=new Date(yy,mm+1,0).getDate(),first=(new Date(yy,mm,1).getDay()+6)%7;
  const port=db.cekler.filter(c=>c.durum==='portfoyde');
  const dayMap={};port.forEach(c=>{const d=new Date(c.vade);if(d.getFullYear()===yy&&d.getMonth()===mm){const k=d.getDate(),m=dayMap[k]=dayMap[k]||{in:0,out:0};if(c.tip==='alinan')m.in+=c.tutar;else m.out+=c.tutar}});
  const t=new Date(),isToday=d=>t.getFullYear()===yy&&t.getMonth()===mm&&t.getDate()===d;
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px"><button class="btn ghost sm" style="width:auto;margin:0;padding:6px 14px" onclick="cekAyOfset--;rCek()">‹</button><b style="font-size:15px">${AYAD[mm]} ${yy}</b><button class="btn ghost sm" style="width:auto;margin:0;padding:6px 14px" onclick="cekAyOfset++;rCek()">›</button></div>`;
  h+=`<div class="card" style="padding:10px 8px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:10px;color:var(--sub);font-weight:700;margin-bottom:4px">`+['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>`<div>${d}</div>`).join('')+`</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let i=0;i<first;i++)h+=`<div></div>`;
  for(let d=1;d<=dim;d++){const m=dayMap[d],has=m&&(m.in||m.out);
    const bg=has?(m.out&&m.in?'linear-gradient(135deg,var(--good-s),var(--bad-s))':m.out?'var(--bad-s)':'var(--good-s)'):'var(--ln2)';
    h+=`<div ${has?`onclick="cekGun(${yy},${mm},${d})"`:''} style="aspect-ratio:1;border-radius:8px;background:${bg};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;${has?'cursor:pointer;':''}${isToday(d)?'outline:2px solid var(--ind2);outline-offset:-2px':''}"><div style="font-size:12px;font-weight:${has?'800':'500'};color:${has?'var(--ink)':'var(--sub)'}">${d}</div>${m&&m.in?`<div style="font-size:7.5px;font-weight:800;color:var(--good);line-height:1.1">+${kisaTL(m.in)}</div>`:''}${m&&m.out?`<div style="font-size:7.5px;font-weight:800;color:var(--bad);line-height:1.1">−${kisaTL(m.out)}</div>`:''}</div>`;
  }
  h+=`</div></div>`;
  const ayIn=Object.values(dayMap).reduce((a,m)=>a+m.in,0),ayOut=Object.values(dayMap).reduce((a,m)=>a+m.out,0);
  h+=`<div class="mini" style="margin:9px 3px;text-align:center">Bu ay: <b style="color:var(--good)">+${TL(ayIn)}</b> alacak · <b style="color:var(--bad)">−${TL(ayOut)}</b> borç · net <b style="color:${ayIn-ayOut>=0?'var(--good)':'var(--bad)'}">${ayIn-ayOut>=0?'+':'−'}${TL(Math.abs(ayIn-ayOut))}</b></div>`;
  h+=`<div style="display:flex;gap:16px;justify-content:center;font-size:11px;margin-top:2px"><span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--good-s);vertical-align:middle;border:1px solid var(--good)"></span> alacak</span><span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--bad-s);vertical-align:middle;border:1px solid var(--bad)"></span> borç</span></div>`;
  return h;
}
function cekGun(yy,mm,d){const AYAD=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];

function cekTahsil(id){
  const c=db.cekler.find(x=>x.id===id);let msg;
  if(c.tip==='alinan'){const h=db.hesaplar.find(x=>x.tur==='nakit')||db.hesaplar.find(x=>/nakit|kasa/i.test(x.ad))||db.hesaplar[0];
    if(!h)return toast('⚠️ Tahsilat için bir kasa/hesap tanımlı değil');
    c.durum='tahsil';c.islemTarih=Date.now();h.bakiye+=c.tutar;msg='Tahsil edildi ✓ '+TL(c.tutar)}
  else{
    const h=db.hesaplar.find(x=>x.tur==='banka')||db.hesaplar[0];
    if(!h)return toast('⚠️ Ödeme için bir hesap tanımlı değil');
    if(h.bakiye<c.tutar-0.001)return toast('⚠️ '+h.ad+' bakiyesi yetersiz. Çek ödenemez (hesap eksiye düşemez).');
    c.durum='tahsil';c.islemTarih=Date.now();h.bakiye-=c.tutar;msg='Ödendi ✓ '+TL(c.tutar);
  }
  // kur farkı: çek TL sabit ödendi, ödeme günü döviz farkı cariye eklenir
  // (kurTakipli çek mevcut döviz borcu için de verilebilir; fark cariIsle'den bağımsız gerçekleşir)
  const kf=cekKurFarki(c);

const ISTASYON=['Kesim','Nakış','Baskı','Dikim','Ütü / Paket'];
const MECBURI=['Kesim','Dikim','Ütü / Paket'];
function fasonlar(){return db.cariler.filter(c=>c.tip==='fason')}
function fasonAd(d){return (d.fasonId&&cari(d.fasonId))?cari(d.fasonId).ad:(d.firma||'')}
function ieMalMaliyet(i){return (i.malzeme||[]).reduce((a,m)=>a+(+m.tutar||0)*(m.pb==='USD'?db.kurUSD:m.pb==='EUR'?db.kurEUR:1),0)}
const MAL_BIRIM=['kg','metre','adet','top','paket','düzine'];
function kumasStok(){const list=[...db.hammadde].sort((a,b)=>(a.kat==='Kumaş'?0:1)-(b.kat==='Kumaş'?0:1)||a.ad.localeCompare(b.ad,'tr'));
  $('sT').textContent='🧵 Hammadde / Kumaş Stoğum';
  $('sB').innerHTML=`<div class="mini">Elindeki stoğa göre iş emri çıkar. Bu pencere formu kapatmaz — bakıp geri dönebilirsin.</div>`+(list.length?`<div class="card" style="margin-top:8px">`+list.map(h=>`<div class="row"><div class="av gray">${h.kat==='Kumaş'?'🧵':'📦'}</div><div class="mid"><div class="t">${esc(h.ad)}</div><div class="s">${esc(h.detay||h.kat||'')}</div></div><div class="end"><div class="n ${h.stok<=h.kritik?'warnc':''}">${(+h.stok||0).toLocaleString('tr-TR')}</div><div class="u">${esc(h.birim||'')}</div></div></div>`).join('')+`</div>`:emp('🧵','Hammadde yok'));
  $('sov').classList.add('show');}
function ieCarpan(i){return i.birim==='seri'?Math.max(1,+i.seriAdet||1):1}
function ieFasonMaliyet(i){const c=ieCarpan(i);return (i.duraklar||[]).reduce((a,d)=>a+(+d.ucret||0)*(+d.gelen||0)*c,0)}
function ieGenelGider(i){return (+i.genelGiderBirim||0)*ieSaglam(i)*ieCarpan(i)}
function ieAdet(i,seri){return (seri==null?ieSaglam(i):seri)*ieCarpan(i)}
function ieToplamMaliyet(i){return ieMalMaliyet(i)+ieFasonMaliyet(i)+ieGenelGider(i)}
const RENK_LISTE=['Siyah','Beyaz','Lacivert','Gri','Bej','Bordo','Antrasit','Yeşil','Hardal','Mor','Kırmızı','Mavi','Kahverengi','Sarı','Pembe','Turuncu','Füme','Ekru','Haki','Vizon'];
function ieSaglam(i){const ds=i.duraklar||[];for(let k=ds.length-1;k>=0;k--)if((+ds[k].gelen||0)>0)return +ds[k].gelen;return 0}
function ieBirimMaliyet(i){const s=ieSaglam(i);return s>0?ieToplamMaliyet(i)/s:0}
function ieDefo(i){return (i.duraklar||[]).reduce((a,d)=>a+(+d.defolu||0),0)}
function ieAktifDurak(i){return (i.duraklar||[]).find(d=>d.durum==='devam')||(i.duraklar||[]).find(d=>d.durum==='bekliyor')}
function durakYolda(d){return Math.max(0,(+d.gonderilen||0)-(+d.gelen||0)-(+d.defolu||0))}
function ieFasondaki(i){return (i.duraklar||[]).filter(d=>d.durum==='devam'&&d.fasonId&&(+d.gonderilen||0)>0)}
function ieGecikme(i){return Math.floor((Date.now()-(i.baslangic+(i.gun||0)*86400000))/86400000)}
function ieBorcGuncelle(d,carpan){const c=carpan||1;
  // borç başka fasona kayıtlıysa (fason değişmiş / dışarı alınmış) önce eski fasondan tam geri al
  if(d.borcFasonId&&d.borcFasonId!==d.fasonId){const of=cari(d.borcFasonId);if(of)of.bakiye=(of.bakiye||0)-(+d.borclanan||0);d.borclanan=0;d.borcFasonId=null}
  if(!d.fasonId){d.borclandi=false;return}
  if(d.borclanan==null)d.borclanan=d.borclandi?Math.round((+d.ucret||0)*(+d.gelen||0)*c):0;
  const target=Math.round((+d.ucret||0)*(+d.gelen||0)*c);const delta=target-(+d.borclanan||0);
  if(delta!==0){const f=cari(d.fasonId);if(f)f.bakiye=(f.bakiye||0)+delta}
  d.borclanan=target;d.borclandi=target>0;d.borcFasonId=target>0?d.fasonId:null;
}
const DURAK_IC={'Kesim':'✂️','Nakış':'🎨','Baskı':'🖨️','Dikim':'🧵','Ütü / Paket':'👔'};
function fasonKarne(fid){let is=0,adet=0,defo=0,gunTop=0,gunN=0,acikIs=0,acikAdet=0;
  db.isemirleri.forEach(i=>{(i.duraklar||[]).forEach(d=>{if(d.fasonId!==fid)return;
    const yap=(+d.gelen||0)+(+d.defolu||0);
    if(d.durum==='devam'&&durakYolda(d)>0){acikIs++;acikAdet+=durakYolda(d)}
    if(yap>0){is++;adet+=+d.gelen||0;defo+=+d.defolu||0;
      if(d.baslama&&d.teslimatlar&&d.teslimatlar.length){const son=d.teslimatlar[d.teslimatlar.length-1].tarih;const g=Math.round((son-d.baslama)/86400000);if(g>=0){gunTop+=g;gunN++}}}
  })});
  const firePct=(adet+defo)>0?Math.round(defo/(adet+defo)*100):0;
  return {is,adet,defo,firePct,ortGun:gunN?Math.round(gunTop/gunN):null,acikIs,acikAdet};
}

    }).join(''):emp('🧵','Fason firma yok. Cari › Fason\'dan ekle.')));
}

function msHesap(){const g=id=>+($(id)?.value||0);

  const birim=toplam/saglam;const kar=g('ms-kar');const satis=birim*(1+kar/100);const hazir=g('ms-hazir');
  const el=$('ms-sonuc');if(!el)return;let cmp='';
  if(hazir>0){const fark=hazir-birim;cmp=fark>=0?`<div class="okbox" style="margin-top:8px">✅ Üretim <b>${TL(fark)}/adet</b> daha ucuz (${TL(birim)} vs hazır ${TL(hazir)}) — <b>üretmek mantıklı</b>.</div>`:`<div class="warnbox" style="margin-top:8px">⚠️ Hazır alım <b>${TL(-fark)}/adet</b> daha ucuz (${TL(hazir)} vs üretim ${TL(birim)}) — <b>almak mantıklı</b>.</div>`;}
  el.innerHTML=`<div class="total"><div><div class="l">Net Birim Maliyet</div><div class="v">${TL(birim)}</div></div><div style="text-align:right"><div class="l">Önerilen Satış +%${kar}</div><div class="v pos">${TL(satis)}</div></div></div>

}

/* --- Teslimat: varsayılan tek toplam, istenirse renk renk --- */
function dagit(total,weights){const keys=Object.keys(weights);const sumW=keys.reduce((a,k)=>a+(weights[k]||0),0);const out={};
  if(total<=0)return out;if(sumW<=0){if(keys.length)out[keys[0]]=total;return out}
  let acc=0;keys.forEach((k,idx)=>{if(idx===keys.length-1)out[k]=Math.max(0,total-acc);else{const v=Math.round(total*(weights[k]||0)/sumW);out[k]=v;acc+=v}});return out;
}

    <div id="t-simple" style="display:${_teslimRenk?'none':'block'}"><div class="g2" style="margin-top:8px"><div><label>Gelen (sağlam)</label><input id="t-adet" type="number" inputmode="numeric" value="${kalanTop||''}" oninput="teslimHint()"></div><div><label>Defo / fire</label><input id="t-defo" type="number" inputmode="numeric" value="" oninput="teslimHint()"></div></div><div class="mini" id="t-hint" style="margin-top:5px"></div></div>

function teslimHint(){const el=$('t-hint');if(!el||_teslimRenk)return;const a=(+($('t-adet')?.value||0))+(+($('t-defo')?.value||0));const kalan=window._teslimKalan||0;const bir=window._teslimBirim||'ad';

function durakTeslimKaydet(id,x){
  const i=db.isemirleri.find(v=>v.id===id);const d=i.duraklar[x];const gr=durakGonderRenk(i,x);
  if($('t-uc'))d.ucret=+$('t-uc').value||d.ucret||0;
  d.renkGelen=d.renkGelen||{};d.renkDefo=d.renkDefo||{};
  let tAdet=0,tDefo=0;const bg={},bd={};

    document.querySelectorAll('#mB #t-renkbox input[id^="tr-"]').forEach(el=>{const c=el.getAttribute('data-c');const adet=Math.max(0,+el.value||0);
      const di=el.parentElement.querySelector('input[id^="td-"]');const defo=Math.max(0,+((di&&di.value)||0));

    const ag=dagit(tAdet,kalanW),ad=dagit(tDefo,kalanW);

  const commit=()=>{

    else d.durum='devam';

  };

    if(k.renkler&&k.renkler.length){k.renkler.forEach(r=>{const ro=renkObjs(u).find(x=>x.ad===r.ad);const st=ro?(+ro.stok||0):0;if(r.mik>st)eksik.push(`• ${u.ad} ${r.ad}: ${r.mik} istendi, ${st} var`)})}

  const kalemler=o.kalemler.map(k=>({uid:k.uid,urun:k.urun,mik:k.mik,birim:k.birim,fiyat:oran===1?k.fiyat:Math.round((+k.fiyat||0)*oran),renkler:k.renkler?k.renkler.map(r=>({...r})):undefined}));

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto">

function rapTrend(sat,toTL,karTL){

    const d0=new Date(bas),yy=d0.getFullYear(),mm=d0.getMonth(),dim=new Date(yy,mm+1,0).getDate();
    const last=(rapDonem==='ay'&&now.getFullYear()===yy&&now.getMonth()===mm)?now.getDate():dim;
    const bv=Array(dim+1).fill(0),bk=Array(dim+1).fill(0);sat.forEach(s=>{const d=new Date(s.tarih).getDate();bv[d]+=toTL(s);bk[d]+=(kf(s)||0)});
    for(let i=1;i<=last;i++)pts.push({x:''+i,v:bv[i],k:karTL?bk[i]:null});
  }else if(rapDonem==='yil'){
