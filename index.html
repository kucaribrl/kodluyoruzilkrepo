<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1d3a63">
<title>Öz Tekstil — Toptan Yönetim</title>
<style>
  :root{
    --bg:#eef2f8; --card:#fff; --ink:#141d2b; --sub:#67788d; --ln:#e7ecf3; --ln2:#f0f4f9;
    --ind:#24487a; --ind2:#2d6cdf; --thr:#c67b2c; --thr-s:#fbf1e3;
    --good:#0f9d63; --good-s:#e3f6ee; --bad:#e0455f; --bad-s:#fdeaee; --warn:#c8891a; --warn-s:#fbf1d8; --pur:#7a4fd0; --pur-s:#efe9fb;
    --sh:0 1px 2px rgba(20,40,70,.05),0 6px 18px rgba(20,40,70,.07);
    --sh2:0 4px 16px rgba(20,40,70,.1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:76px;font-size:15px;line-height:1.5;overflow-x:hidden}
  .tnum{font-variant-numeric:tabular-nums}
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit}

  /* HEADER */
  header{background:linear-gradient(135deg,#1c3760,#2d5aa0);color:#fff;padding:13px 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 16px rgba(20,40,70,.22)}
  header .top{display:flex;align-items:center;gap:11px}
  header .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
  header h1{font-size:16px;font-weight:800}
  header .sub{font-size:11px;opacity:.85;margin-top:1px}
  header .role{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
  header .bkbtn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 6px 0 0;display:none}
  header.sub-view .bkbtn{display:block}
  header.sub-view .logo{display:none}

  main{max-width:820px;margin:0 auto;padding:14px}
  .hide{display:none!important}

  /* generic */
  .card{background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
  .sec{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--sub);margin:18px 3px 9px;display:flex;justify-content:space-between;align-items:center}
  .sec a{font-size:11.5px;color:var(--ind2);font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
  .row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
  .row:last-child{border-bottom:none}.row:active{background:var(--ln2)}
  .av{width:40px;height:40px;border-radius:11px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:var(--ind2)}
  .av.p{background:var(--pur)}.av.g{background:var(--good)}.av.o{background:var(--warn)}.av.r{background:var(--bad)}.av.gray{background:#eef2f7;color:#a9b6c6;font-size:19px}
  .mid{flex:1;min-width:0}.mid .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid .s{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .end{text-align:right;flex:0 0 auto}.end .n{font-weight:800;font-size:14px}.end .u{font-size:10.5px;color:var(--sub)}
  .pos{color:var(--good)}.neg{color:var(--bad)}.warnc{color:var(--warn)}
  .pill{display:inline-block;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px}
  .pill.ok{background:var(--good-s);color:var(--good)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.low{background:var(--warn-s);color:var(--warn)}.pill.n{background:var(--ln2);color:var(--sub)}.pill.p{background:var(--pur-s);color:var(--pur)}
  .chips{display:flex;gap:4px;margin-top:5px}.chip{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.12)}
  .tag{font-size:9.5px;font-weight:800;background:var(--ln2);color:var(--sub);padding:2px 6px;border-radius:5px;margin-left:5px}
  .empty{text-align:center;padding:38px 20px;color:var(--sub)}.empty .i{font-size:40px;opacity:.4}.empty p{margin:11px 0 0;font-size:13.5px}
  .mini{font-size:12px;color:var(--sub)}

  .search{width:100%;padding:11px 13px;border:1px solid var(--ln);border-radius:12px;font-size:14px;background:var(--card);margin-bottom:12px;outline:none;box-shadow:var(--sh)}
  .search:focus{border-color:var(--ind2)}
  .segs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}.segs::-webkit-scrollbar{display:none}
  .seg{font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--ln);color:var(--sub);white-space:nowrap;cursor:pointer}
  .seg.on{background:var(--ind);color:#fff;border-color:var(--ind)}
  .tabs{display:flex;background:var(--ln2);border-radius:12px;padding:3px;margin-bottom:13px}
  .tabs .tb{flex:1;text-align:center;padding:9px 4px;font-size:12.5px;font-weight:800;color:var(--sub);border-radius:9px;cursor:pointer}
  .tabs .tb.on{background:var(--card);color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* PANEL / HOME */
  .greet{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .greet .h{font-size:19px;font-weight:800}.greet .d{font-size:12px;color:var(--sub);margin-top:1px}
  .kur{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;margin-bottom:12px;font-size:12.5px;font-weight:800;box-shadow:var(--sh)}
  .kur .up{margin-left:auto;font-size:11px;color:var(--ind2);cursor:pointer}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
  .tile{border-radius:15px;padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden;color:#fff}
  .tile.b1{background:linear-gradient(135deg,#1c7a52,#12a06a)}
  .tile.b2{background:linear-gradient(135deg,#22406e,#2d6cdf)}
  .tile.b3{background:linear-gradient(135deg,#7a4fd0,#9b6ee0)}
  .tile.b4{background:linear-gradient(135deg,#b5701a,#d59433)}
  .tile .l{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;opacity:.9}
  .tile .v{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
  .tile .v.sm{font-size:16px}
  .tile .em{position:absolute;right:-6px;bottom:-10px;font-size:46px;opacity:.16}

  .todo{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
  .todo:last-child{border-bottom:none}
  .todo .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 34px}
  .todo .m{flex:1;min-width:0}.todo .m .t{font-size:13px;font-weight:700}.todo .m .s{font-size:11px;color:var(--sub);margin-top:1px}

  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .mcell{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 4px 9px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative}
  .mcell:active{background:var(--ln2)}
  .mcell .mi{width:36px;height:36px;margin:0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--thr-s)}
  .mcell .mx{font-size:10px;font-weight:700;margin-top:6px;line-height:1.2}
  .mcell .bd{position:absolute;top:6px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .trend{padding:13px}
  .trend .th{display:flex;justify-content:space-between;align-items:baseline}
  .trend .th .a{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--sub)}
  .trend .th .v{font-size:16px;font-weight:800}
  .trend svg{display:block;width:100%;height:46px;margin-top:6px}

  /* NAV / FAB */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 16px rgba(20,40,70,.07)}
  nav button{flex:1;background:none;border:none;padding:5px 2px;color:var(--sub);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button .i{font-size:20px;line-height:1}nav button.on{color:var(--ind2)}
  .fab{position:fixed;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--ind2);color:#fff;border:none;font-size:29px;box-shadow:0 6px 18px rgba(45,108,223,.45);z-index:25;cursor:pointer;display:none;align-items:center;justify-content:center}
  .fab.show{display:flex}.fab:active{transform:scale(.94)}

  /* MODAL */
  .ov{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet .hd{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:2}
  .sheet .hd h3{font-size:17px;font-weight:800}
  .sheet .hd .x{background:var(--ln2);border:none;width:32px;height:32px;border-radius:50%;font-size:17px;color:var(--sub);cursor:pointer}
  .sheet .bd{padding:4px 18px calc(28px + env(safe-area-inset-bottom))}
  label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--sub);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--ln);border-radius:12px;font-size:15px;background:#fbfcfe;outline:none;font-family:inherit;color:var(--ink)}
  input:focus,select:focus{border-color:var(--ind2);background:#fff}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ckrow{display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink);margin:12px 0 2px}
  .ckrow input{width:20px;height:20px;flex:0 0 auto;padding:0}
  .dbox{margin-top:12px;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
  .dline{display:flex;justify-content:space-between;gap:12px;padding:9px 13px;font-size:13.5px;border-top:1px solid var(--ln2)}
  .dline:first-child{border-top:none}.dline span{color:var(--sub)}.dline b{text-align:right;max-width:62%}
  .exhead{display:flex;gap:8px;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--sub);padding:6px 4px;border-bottom:1px solid var(--ln)}
  .exhead span:first-child{flex:1}.exhead span:nth-child(2){width:90px;text-align:right}.exhead span:last-child{width:90px;text-align:right}
  .exrow{display:flex;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ln2)}
  .exl{flex:1;min-width:0}.exl b{font-size:13.5px;font-weight:700}.exl small{display:block;color:var(--sub);font-size:11px}
  .exb{width:90px;text-align:right;font-size:13px;font-weight:700}.exr{width:90px;text-align:right;font-size:13.5px;font-weight:800}
  .exb.neg,.exr.neg{color:var(--bad)}.exb.pos,.exr.pos{color:var(--good)}
  .btn{width:100%;padding:14px;border:none;border-radius:13px;background:var(--ind2);color:#fff;font-size:15px;font-weight:800;margin-top:18px;cursor:pointer}
  .btn:active{opacity:.9}.btn.ghost{background:var(--ln2);color:var(--ind)}.btn.danger{background:var(--bad-s);color:var(--bad)}.btn.g{background:var(--good)}.btn.sm{padding:11px;font-size:13.5px;margin-top:0}
  .seg2{display:flex;background:var(--ln2);border-radius:11px;padding:3px}
  .seg2 .o{flex:1;text-align:center;padding:9px;font-size:12.5px;font-weight:800;color:var(--sub);border-radius:9px;cursor:pointer}
  .seg2 .o.on{background:var(--card);color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}
  .li:last-child{border-bottom:none}
  .li .lt{flex:1;font-size:13.5px}.li .lt small{display:block;color:var(--sub);font-size:11px}
  .del{background:var(--bad-s);color:var(--bad);border:none;width:28px;height:28px;border-radius:8px;font-size:15px;cursor:pointer;flex:0 0 28px}
  .total{background:#eef4fb;border-radius:12px;padding:13px 15px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
  .total .l{font-size:12px;color:var(--sub);font-weight:700}.total .v{font-size:22px;font-weight:800;color:var(--ind)}
  .step{display:flex;align-items:center;gap:9px}
  .step .b{width:34px;height:34px;border-radius:9px;background:var(--ln2);color:var(--ind);border:none;font-size:19px;font-weight:800;cursor:pointer}.step .b.p{background:var(--ind);color:#fff}
  .step input{width:60px;text-align:center;padding:9px}
  .step.sm{gap:5px}.step.sm .b{width:28px;height:28px;font-size:16px;border-radius:7px}.step.sm input{width:44px;padding:6px}
  .renkrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .sw{width:30px;height:30px;flex:0 0 30px;border-radius:8px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
  .sw.sm{width:20px;height:20px;flex:0 0 20px;cursor:default}
  .renkrow .rad{flex:1;margin:0}.renkrow .rst{width:66px;flex:0 0 66px;margin:0;text-align:center}
  .renksel{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed var(--ln)}
  .renksel .rn{font-size:14px;font-weight:700;flex:1}.renksel .rs{font-size:11px;color:var(--sub);font-weight:700;text-align:right}.renksel .rs.bad{color:var(--bad)}
  .bedenbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .bchip{display:inline-flex;align-items:center;gap:5px;background:var(--ind);color:#fff;font-size:12.5px;font-weight:800;padding:6px 8px 6px 11px;border-radius:9px}
  .bchip i{cursor:pointer;font-style:normal;opacity:.75;font-size:11px}
  .binp{width:70px!important;padding:8px 10px!important;margin:0!important}
  .brow{display:flex;align-items:center;gap:8px;margin-top:7px}
  .brow .bn{flex:1;margin:0;font-weight:700}
  .renkcard{border:1px solid var(--ln);border-radius:13px;padding:11px;margin-top:10px;background:#fbfcfe}
  .rc-top{display:flex;align-items:center;gap:8px}.rc-top .rad{flex:1;margin:0}
  .rc-body{display:flex;gap:10px;margin-top:0}
  .rc-foto{width:72px;height:72px;flex:0 0 72px;border:1px dashed var(--ln);border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--sub);font-weight:700;cursor:pointer;overflow:hidden;background:#fff}
  .rc-foto img{width:100%;height:100%;object-fit:cover}
  .rc-fields{flex:1;min-width:0}.rc-fields label{margin:9px 0 4px}.rc-fields input{padding:9px 11px}
  .rc-kirikh{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--ind2);cursor:pointer;user-select:none}
  .rc-kirik{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .kb{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px}
  .kb span{font-size:11px;font-weight:800;color:var(--sub)}.kb input{width:52px;text-align:center;padding:7px 4px}
  .islemrow{display:flex;gap:7px;align-items:center;margin-top:8px}.islemrow select{flex:1;padding:10px}
  .aclist{display:none;border:1px solid var(--ln);border-radius:11px;margin-top:4px;overflow:hidden;max-height:260px;overflow-y:auto}
  .acitem{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:14px;font-weight:700;cursor:pointer;border-top:1px solid var(--ln2)}
  .acitem:first-child{border-top:none}.acitem:active{background:var(--ln2)}
  .acitem small{display:block;color:var(--sub);font-size:11px;font-weight:600}
  .acitem.yeni{color:var(--ind2)}
  .acav{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--ind2);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .acav img{width:100%;height:100%;object-fit:cover}
  .cfoto{width:58px;height:58px;flex:0 0 58px;border:1px dashed var(--ln);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--sub);cursor:pointer;overflow:hidden;background:#fff}
  .cfoto img{width:100%;height:100%;object-fit:cover}
  .odrow{border:1px solid var(--ln);border-radius:12px;padding:9px;margin-top:8px;background:#fbfcfe}
  .odtop{display:flex;gap:6px;align-items:center}
  .odtop .odt{flex:1;margin:0;padding:10px}.odtop .odpb{width:62px;flex:0 0 62px;margin:0;padding:10px 6px}.odtop .odtur{width:112px;flex:0 0 112px;margin:0;padding:10px 6px}
  .odrow select{margin:0}
  .odcek{border:1px dashed var(--ln);border-radius:9px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#fff}
  .odcek img{width:100%;height:100%;object-fit:cover}
  .svbars{display:flex;gap:3px;flex:0 0 auto}
  .svbar{width:5px;height:40px;border-radius:3px;background:var(--ln2)}
  .svbar.teslim{background:var(--ind2)}.svbar.odendi{background:var(--bad)}
  .bkrow{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--ln)}
  .bksvg{flex:0 0 130px;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:5px}.bkinfo{flex:1}
  .pasifrow{opacity:.5}
  #printarea{display:none}
  @media print{
    body.printing>*{display:none!important}
    body.printing #printarea{display:flex!important;flex-wrap:wrap;gap:6px;padding:6px}
    body.printing .lbl{border:1px solid #000;border-radius:5px;padding:7px 8px;width:210px;text-align:center;page-break-inside:avoid;color:#000}
    body.printing .lbl .l-ad{font-size:12px;font-weight:800;line-height:1.3;margin-bottom:2px}
    body.printing .lbl .l-line{font-size:10px;font-weight:700;line-height:1.4}
    body.printing .lbl svg{margin-top:4px}
    body.printing .fis{width:100%;color:#000;font-size:13px;font-family:ui-sans-serif,system-ui,sans-serif}
    body.printing .fis h2{margin:0 0 4px;font-size:20px}
    body.printing .fis table{width:100%;border-collapse:collapse;margin-top:10px}
    body.printing .fis td{padding:5px 0;border-bottom:1px solid #ddd;vertical-align:top}
    body.printing .fis td.r{text-align:right;white-space:nowrap}
    body.printing .fis small{color:#555}
    body.printing .fis .tot td{font-weight:800;font-size:16px;border-top:2px solid #000;border-bottom:none}
    body.thermal #printarea{display:block!important;padding:0}
    body.thermal .lbl{display:none!important}
    .fisT{font-family:'Courier New',ui-monospace,monospace;color:#000;width:100%;font-size:12px;line-height:1.5;letter-spacing:.2px}
  }
  /* Termal fiş iç stilleri (önizleme + baskı ortak) */
  .thermwrap{background:repeating-linear-gradient(45deg,#e6e8ee,#e6e8ee 10px,#e1e3ea 10px,#e1e3ea 20px);border-radius:12px;padding:18px 10px;margin-top:10px;display:flex;justify-content:center}

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d||!d.urunler)return seed();seqFix(d);return d}catch(e){return seed()}}
function seqFix(d){ // id çakışmasını önle: her sıra numarasını mevcut en yüksek id'nin üstüne çek
  d.seq=d.seq||{};
  d.hareketler=d.hareketler||[];
  const mx=(arr,base)=>{let m=base;(arr||[]).forEach(x=>{if(x&&+x.id>m)m=+x.id});return m+1};
  d.seq.hr=Math.max(d.seq.hr||0,mx(d.hareketler,1000));
  d.seq.c=Math.max(d.seq.c||0,mx(d.cariler,1000));
  d.seq.u=Math.max(d.seq.u||0,mx(d.urunler,1000));
  d.seq.s=Math.max(d.seq.s||0,mx(d.satislar,1000));
  d.seq.cek=Math.max(d.seq.cek||0,mx(d.cekler,1000));
  d.seq.ie=Math.max(d.seq.ie||0,mx(d.isemirleri,1000));
  d.seq.h=Math.max(d.seq.h||0,mx(d.hammadde,1000));
  d.seq.oh=Math.max(d.seq.oh||0,mx(d.hesaplar,1000));
  // eski id-çakışması onarımı: aynı id'li cari varsa yeni id ver, referansları isimle taşı
  const gorulen={};
  (d.cariler||[]).forEach(c=>{
    if(gorulen[c.id]){const oldId=c.id,newId=d.seq.c++;
      (d.satislar||[]).forEach(s=>{if(s.mid===oldId&&s.mus===c.ad)s.mid=newId});
      (d.cekler||[]).forEach(k=>{if(k.cariId===oldId&&k.cari===c.ad)k.cariId=newId});
      c.id=newId;
    }else gorulen[c.id]=1;
  });
  // eski string renkleri obje formuna çevir (renk renk stok için)
  const NM={'#111111':'Siyah','#f2f2ee':'Beyaz','#ffffff':'Beyaz','#1d2f52':'Lacivert','#8a8f98':'Gri','#e8e2d4':'Bej','#5a1220':'Bordo','#2b2b2b':'Antrasit','#0f9d63':'Yeşil','#c8891a':'Hardal','#7a4fd0':'Mor','#e0455f':'Kırmızı'};
  (d.urunler||[]).forEach(u=>{
    if(!Array.isArray(u.renkler))return;
    const hasStr=u.renkler.some(r=>typeof r==='string');
    if(hasStr&&!u.renkler.some(r=>r&&typeof r==='object')){
      const n=u.renkler.length,pay=Math.floor((u.stok||0)/n);
      u.renkler=u.renkler.map((hex,i)=>({ad:NM[hex]||('Renk '+(i+1)),hex,foto:'',barkod:'869'+(100000000+((u.id||0)*100+i)%900000000),stok:i===0?((u.stok||0)-pay*(n-1)):pay,kirik:null}));

}

const money=(n,pb)=>pb==='USD'?USD(n):pb==='EUR'?'€'+Math.round(n).toLocaleString('tr-TR'):TL(n);
const ii=s=>(s||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1900)}
let _cYes=null;
function askConfirm(msg,onYes,yesLabel){$('cMsg').textContent=msg;$('cYes').textContent=yesLabel||'Evet';_cYes=onYes;$('cov').classList.add('show')}
$('cYes').onclick=()=>{$('cov').classList.remove('show');const f=_cYes;_cYes=null;if(f)f()};

$('cov').addEventListener('click',e=>{if(e.target.id==='cov'){$('cov').classList.remove('show');_cYes=null}});
function tstr(ts){const d=new Date(ts);return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function dstr(ts){return new Date(ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})}
function gunFark(ts){return Math.round((ts-Date.now())/86400000)}
const cari=id=>db.cariler.find(c=>c.id===id);
const hesap=id=>db.hesaplar.find(h=>h.id===id);
const urun=id=>db.urunler.find(u=>u.id===id);
function stokAdet(u){return u.stok*(u.birim==='seri'?u.seri:1)}
function stokTop(u){return (u.renkler&&u.renkler.length&&typeof u.renkler[0]==='object')?u.renkler.reduce((a,r)=>a+(+r.stok||0),0):(u.stok||0)}
function stokPill(u){const s=stokTop(u);if(s<=0)return '<span class="pill bad">Tükendi</span>';if(s<=u.kritik)return '<span class="pill low">Azaldı</span>';return '<span class="pill ok">Var</span>'}
function renkHex(c){return typeof c==='object'?c.hex:c}
function renkObjs(u){return (u&&u.renkler||[]).filter(r=>r&&typeof r==='object')}
function hasRenkStok(u){return renkObjs(u).length>0}
function syncStok(u){if(hasRenkStok(u))u.stok=renkObjs(u).reduce((a,r)=>a+(+r.stok||0),0)}
function dots(r){return '<div class="chips">'+(r||[]).slice(0,6).map(c=>`<span class="chip" style="background:${renkHex(c)}"></span>`).join('')+'</div>'}
function toplamElimizde(){return db.hesaplar.reduce((a,h)=>a+h.bakiye,0)}
function toplamAlacak(){return db.cariler.filter(c=>c.tip==='musteri').reduce((a,c)=>a+Math.max(0,c.bakiye),0)}
function stokDegeri(){return db.urunler.reduce((a,u)=>a+u.stok*u.alis*(u.birim==='seri'?u.seri:1),0)}
function bugunSatis(){const b=new Date().setHours(0,0,0,0);return db.satislar.filter(s=>s.tarih>=b).reduce((a,s)=>a+s.tutar,0)}

/* Roller ve yetki — merkezi model */
const ROLLER={
  patron:{ad:'Patron',ic:'👑',kar:true,para:true,urunYaz:true,hammadde:true,views:'panel,satis,stok,cari,kasa,cek,uretim,portal,rapor,ayarlar,daha'},
  ortak:{ad:'Ortak',ic:'🤝',kar:true,para:true,urunYaz:true,hammadde:true,views:'panel,satis,stok,cari,kasa,cek,uretim,portal,rapor,ayarlar,daha'},
  magaza:{ad:'Mağaza Elemanı',ic:'🏪',kar:false,para:false,urunYaz:false,hammadde:false,views:'panel,satis,stok,cari,ayarlar,daha'},
  depocu:{ad:'Depocu',ic:'📦',kar:false,para:false,urunYaz:false,hammadde:false,views:'panel,stok,ayarlar,daha'},
  fason:{ad:'Fason Takipçi',ic:'🧵',kar:false,para:false,urunYaz:false,hammadde:true,views:'panel,uretim,ayarlar,daha'},
};
function yetki(){return ROLLER[db.rol]||ROLLER.patron}
function karGoster(){return !!yetki().kar}
function paraGoster(){return !!yetki().para}
function canUrunYaz(){return !!yetki().urunYaz}
function canHammadde(){return !!yetki().hammadde}
function canSee(v){return yetki().views.split(',').includes(v)}
function rolRenk(k){return {patron:'#b5820a',ortak:'#24487a',magaza:'#0f9d63',depocu:'#2d6cdf',fason:'#7a4fd0'}[k]||'#24487a'}
function navFor(){
  const r=db.rol;
  if(r==='depocu')return [['panel','📊','Panel'],['stok','📦','Stok'],['daha','⋯','Daha']];
  if(r==='fason')return [['panel','📊','Panel'],['uretim','🏭','Üretim'],['daha','⋯','Daha']];
  return [['panel','📊','Panel'],['satis','🧾','Satış'],['stok','📦','Stok'],['cari','👥','Cari'],['daha','⋯','Daha']];
}

/* =================== ROUTER =================== */
let cur='panel';
function go(v){
  if(!canSee(v))v='panel';
  cur=v;
  renderNav();
  $('fab').classList.toggle('show',fabShow(v));
  render();window.scrollTo(0,0);
}
function renderNav(){
  $('nav').innerHTML=navFor().map(([v,ic,ad])=>`<button data-v="${v}" onclick="go('${v}')" class="${cur===v?'on':''}"><span class="i">${ic}</span>${ad}</button>`).join('');
}
function back(){go('panel')}
function rolSec(){
  open_('Rol Seç (test)',Object.keys(ROLLER).map(k=>`<div class="row" onclick="setRol('${k}')"><div class="av" style="background:${rolRenk(k)}">${ROLLER[k].ic}</div><div class="mid"><div class="t">${ROLLER[k].ad}</div><div class="s">${ROLLER[k].kar?'kâr görür':'kâr gizli'}</div></div>${db.rol===k?'<span class="pill ok">aktif</span>':''}</div>`).join('')+'<div class="mini" style="text-align:center;margin-top:14px">Bu, farklı rollerin ne gördüğünü denemen için. Gerçekte herkes kendi şifresiyle girer.</div>');
}
function setRol(k){db.rol=k;save();closeM();go('panel');toast(ROLLER[k].ad+' görünümü')}

/* =================== RENDER =================== */
function render(){
  const y=yetki();
  $('hTitle').textContent=db.firma;
  $('hSub').textContent=y.ad;
  $('roleBtn').innerHTML=y.ic+' '+y.ad+' ▾';
  const R={panel:rPanel,satis:rSatis,stok:rStok,cari:rCari,daha:rDaha,kasa:rKasa,cek:rCek,uretim:rUretim,rapor:rRapor,ayarlar:rAyarlar,portal:rPortal};
  (R[cur]||rPanel)();
}

/* ---------- PANEL (yeni ana ekran) ---------- */
function rPanel(){
  const y=yetki(), para=paraGoster();
  const kritik=db.urunler.filter(u=>stokTop(u)<=u.kritik);
  const ayrilan=db.satislar.filter(s=>s.teslimDurum==='ayrildi');

  // BEKLEYEN İŞLER — role göre filtreli
  const bekleyen=[];
  if(para){ // patron/ortak
    db.bekleyenPortal.forEach(o=>bekleyen.push({ic:'📮',bg:'var(--thr-s)',t:o.mus+' · portal siparişi',s:o.kalemler.length+' kalem · '+TL(o.tutar),act:()=>portalOnay(o.id)}));
    db.isemirleri.filter(i=>i.durum==='devam').forEach(i=>{const gec=-gunFark(i.baslangic+i.gun*86400000);if(gec>0)bekleyen.push({ic:'⏱️',bg:'var(--bad-s)',t:'İş Emri #'+i.id+' gecikti',s:i.urun+' · '+gec+' gün geç',act:()=>uretimDetay(i.id)})});
    db.cekler.filter(c=>c.tip==='alinan'&&c.durum==='portfoyde'&&gunFark(c.vade)<=7).forEach(c=>bekleyen.push({ic:'🏷️',bg:'var(--good-s)',t:'Çek vadesi yaklaştı',s:c.cari+' · '+TL(c.tutar)+' · '+dstr(c.vade),act:()=>go('cek')}));
  }
  if(db.rol==='magaza'||db.rol==='depocu'){ // teslim bekleyen (ayrılan) siparişler
    ayrilan.forEach(s=>bekleyen.push({ic:'🔖',bg:'var(--warn-s)',t:s.mus+' · mal ayrıldı',s:'teslim bekliyor · '+s.kalemler.length+' kalem',act:()=>{go('satis');setTimeout(()=>satisFis(s.id),150)}}));
  }
  // TOPLAMA EMİRLERİ — depocu hazırlasın işaretli satışlar
  if(db.rol==='depocu'||db.rol==='magaza'||para){
    depoBekleyen().forEach(s=>bekleyen.push({ic:'📦',bg:'var(--thr-s)',t:s.mus+' · toplama emri',s:'ayrılacak · İrsaliye #'+s.id+' · '+s.kalemler.length+' kalem',act:()=>depoEmri(s.id)}));
  }
  if(db.rol==='fason'){
    db.isemirleri.filter(i=>i.durum==='devam').forEach(i=>{const gec=-gunFark(i.baslangic+i.gun*86400000);bekleyen.push({ic:gec>0?'⏱️':'🏭',bg:gec>0?'var(--bad-s)':'var(--thr-s)',t:'İş Emri #'+i.id+(gec>0?' gecikti':''),s:i.urun+(gec>0?' · '+gec+' gün geç':' · devam'),act:()=>uretimDetay(i.id)})});
  }

  // TILES — role göre
  let tiles='';
  if(para){
    tiles=`<div class="tile b1"><div class="l">Toplam Alacak</div><div class="v">${TL(toplamAlacak())}</div><div class="em">📈</div></div>
      <div class="tile b2"><div class="l">Bugünkü Satış</div><div class="v">${TL(bugunSatis())}</div><div class="em">🧾</div></div>
      <div class="tile b3"><div class="l">Elimizdeki Para</div><div class="v sm">${TL(toplamElimizde())}</div><div class="em">🏦</div></div>
      <div class="tile b4"><div class="l">Stok Değeri</div><div class="v sm">${TL(stokDegeri())}</div><div class="em">📦</div></div>`;
  }else if(db.rol==='magaza'){
    tiles=`<div class="tile b2"><div class="l">Bugünkü Satış</div><div class="v">${TL(bugunSatis())}</div><div class="em">🧾</div></div>
      <div class="tile b3"><div class="l">Müşteri</div><div class="v sm">${db.cariler.filter(c=>c.tip==='musteri').length}</div><div class="em">👥</div></div>`;
  }else if(db.rol==='depocu'){
    tiles=`<div class="tile b4"><div class="l">Ürün Çeşidi</div><div class="v sm">${db.urunler.length}</div><div class="em">📦</div></div>
      <div class="tile b1" style="background:linear-gradient(135deg,#b5701a,#d59433)"><div class="l">Kritik Stok</div><div class="v sm">${kritik.length}</div><div class="em">⚠️</div></div>`;
  }else if(db.rol==='fason'){
    const aktif=db.isemirleri.filter(i=>i.durum==='devam').length;
    const gecik=db.isemirleri.filter(i=>i.durum==='devam'&&gunFark(i.baslangic+i.gun*86400000)<0).length;
    tiles=`<div class="tile b3" style="background:linear-gradient(135deg,#7a4fd0,#9b6ee0)"><div class="l">Aktif İş Emri</div><div class="v sm">${aktif}</div><div class="em">🏭</div></div>
      <div class="tile b1" style="background:linear-gradient(135deg,#c0392b,#e0455f)"><div class="l">Geciken</div><div class="v sm">${gecik}</div><div class="em">⏱️</div></div>`;
  }

  const mods=modulListe();
  const gorKur=para||db.rol==='magaza';
  let html=`
    <div class="greet"><div><div class="h">Merhaba, ${esc(y.ad)} 👋</div><div class="d">${new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>`;
  if(gorKur)html+=`<div class="kur">💵 $ ${db.kurUSD.toFixed(2)} <span style="color:var(--ln)">|</span> 💶 € ${db.kurEUR.toFixed(2)}${db.kurTarih?`<span style="font-size:10px;color:var(--sub);font-weight:600;margin-left:6px">${kurYas()}</span>`:''}<span class="up" onclick="kurGuncelle()">🔄 Güncelle</span></div>`;
  html+=`<div class="tiles">${tiles}</div>`;
  if(bekleyen.length){
    html+=`<div class="sec">Bekleyen İşler</div><div class="card">`+bekleyen.slice(0,5).map((b,i)=>`<div class="todo" onclick="bekAct(${i})"><div class="ic" style="background:${b.bg}">${b.ic}</div><div class="m"><div class="t">${esc(b.t)}</div><div class="s">${esc(b.s)}</div></div><span style="color:var(--sub)">›</span></div>`).join('')+`</div>`;
    window._bek=bekleyen;
  }
  html+=`<div class="sec">Modüller</div><div class="mgrid">`+mods.map(m=>`<div class="mcell" onclick="${m.act}">${m.bd?`<span class="bd">${m.bd}</span>`:''}<div class="mi">${m.ic}</div><div class="mx">${m.ad}</div></div>`).join('')+`</div>`;
  if(y.kar){
    const pts=[30,28,32,22,26,18,24,14,20,10,16,8,12,6];
    const path=pts.map((p,i)=>`${i*(300/(pts.length-1))},${p}`).join(' ');
    html+=`<div class="sec">Son 30 Gün Cirosu</div><div class="card trend"><div class="th"><span class="a">Ciro trendi</span><span class="v">${TL(bugunSatis()*22+2100000)}</span></div><svg viewBox="0 0 300 40" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d6cdf" stop-opacity=".25"/><stop offset="1" stop-color="#2d6cdf" stop-opacity="0"/></linearGradient></defs><polygon points="${path} 300,40 0,40" fill="url(#g)"/><polyline points="${path}" fill="none" stroke="#2d6cdf" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg></div>`;
  }
  html+=`<div class="sec">Kritik Stok</div><div class="card">`+(kritik.length?kritik.map(u=>`<div class="row" onclick="go('stok')"><div class="av o">📦</div><div class="mid"><div class="t">${esc(u.ad)}</div><div class="s">${esc(u.kod)}</div></div><div class="end"><div class="n ${u.stok<=0?'neg':'warnc'}">${u.stok}</div><div class="u">${u.birim}</div></div></div>`).join(''):emp('✅','Kritik stok yok'))+`</div>`;
  $('app').innerHTML=html;
}
function bekAct(i){if(window._bek&&window._bek[i])window._bek[i].act()}
function modulListe(){
  const onay=db.bekleyenPortal.length;
  const all=[
    {ic:'🧾',ad:'Satış',v:'satis'},
    {ic:'📦',ad:'Stok',v:'stok'},
    {ic:'🏭',ad:'Üretim',v:'uretim'},
    {ic:'👥',ad:'Cari',v:'cari'},
    {ic:'🏦',ad:'Kasa',v:'kasa'},
    {ic:'🏷️',ad:'Çek',v:'cek'},
    {ic:'🛍️',ad:'Portal',v:'portal',bd:onay||''},
    {ic:'📊',ad:'Rapor',v:'rapor'},
  ];
  return all.filter(m=>canSee(m.v)).map(m=>({ic:m.ic,ad:m.ad,bd:m.bd,act:`go('${m.v}')`}));
}

/* ---------- STOK ---------- */
let stokTab='mamul', stokKat='Tümü';
function rStok(){
  if(!canHammadde())stokTab='mamul';
  let html=canHammadde()?`<div class="tabs"><div class="tb ${stokTab==='mamul'?'on':''}" onclick="stokTab='mamul';rStok()">👕 Mamül</div><div class="tb ${stokTab==='hammadde'?'on':''}" onclick="stokTab='hammadde';rStok()">🧵 Hammadde</div></div>`:'';
  if(stokTab==='mamul'){
    const kats=['Tümü',...new Set(db.urunler.map(u=>u.kat).filter(Boolean))];
    html+=`<input class="search" id="ara-stok" placeholder="🔍 Ürün, kod, marka ara..." oninput="rStokList()"><div class="segs">`+kats.map(k=>`<div class="seg ${k===stokKat?'on':''}" onclick="stokKat='${esc(k)}';rStok()">${esc(k)}</div>`).join('')+`</div>${canSayim()?`<button class="btn ghost sm" style="margin-bottom:10px" onclick="depoSayim()">📋 Depo Sayımı Yap</button>`:''}<div class="card" id="stok-list"></div>`;
    $('app').innerHTML=html; rStokList();
  }else{
    const kats=['Tümü','Kumaş','Aksesuar','Etiket','Ambalaj'];
    html+=`<div class="card">`+db.hammadde.map(h=>`<div class="row" onclick="formHammadde(${h.id})"><div class="av gray">🧵</div><div class="mid"><div class="t">${esc(h.ad)}</div><div class="s">${esc(h.detay||'')}</div></div><div class="end"><div class="n ${h.stok<=h.kritik?'warnc':''}">${h.stok.toLocaleString('tr-TR')}</div><div class="u">${h.birim}</div>${h.stok<=h.kritik?'<span class="pill low">Az</span>':'<span class="pill ok">Var</span>'}</div></div>`).join('')+`</div><div class="infobox">🏭 İş emri açınca bu malzemeler otomatik düşer.</div>`;
    $('app').innerHTML=html;
  }
}
function rStokList(){
  const q=($('ara-stok')?.value||'').toLowerCase();
  const list=db.urunler.filter(u=>(stokKat==='Tümü'||u.kat===stokKat)&&(u.ad.toLowerCase().includes(q)||u.kod.toLowerCase().includes(q)||(u.marka||'').toLowerCase().includes(q))).sort((a,b)=>(a.pasif?1:0)-(b.pasif?1:0));
  const wip={}; db.isemirleri.filter(i=>i.durum==='devam').forEach(i=>{wip[i.urunId]=(wip[i.urunId]||0)+i.hedef});
  $('stok-list').innerHTML=list.length?list.map(u=>{const kap=urunKapak(u);return `<div class="row${u.pasif?' pasifrow':''}" data-uid="${u.id}" onclick="urunDetay(${u.id})"><div class="av gray" style="overflow:hidden;padding:0">${kap?`<img src="${kap}" style="width:100%;height:100%;object-fit:cover">`:'👕'}</div><div class="mid"><div class="t">${esc(u.ad)}${u.pasif?'<span class="tag" style="background:var(--bad-s);color:var(--bad)">Pasif</span>':u.marka?`<span class="tag">${esc(u.marka)}</span>`:''}</div><div class="s">${esc(u.kod)} · ${money(u.satis,u.pb||'TL')}/${u.birim}${u.kaynak==='alim'?' · hazır alım':''}</div>${dots(u.renkler)}${wip[u.id]?`<div style="font-size:10px;color:var(--ind2);font-weight:700;margin-top:3px">🏭 +${wip[u.id]} üretimde</div>`:''}</div><div class="end"><div class="n" style="${u.stok<=0?'color:var(--bad)':u.stok<=u.kritik?'color:var(--warn)':''}">${u.stok}</div><div class="u">${u.birim}${u.birim==='seri'?' ×'+u.seri:''}</div>${stokPill(u)}</div></div>`}).join(''):emp('📦','Ürün yok');
  attachSwipe();
}
function emp(i,t){return `<div class="empty"><div class="i">${i}</div><p>${t}</p></div>`}

function urunKapak(u){const r=(u.renkler||[]).find(x=>x&&typeof x==='object'&&x.foto);return r?r.foto:''}
function urunDetay(id){
  const u=urun(id);const pb=u.pb||'TL';const kar=u.satis-u.alis, karY=u.alis?Math.round((kar/u.alis)*100):0;
  const kapak=urunKapak(u);
  const kirikTop=r=>r.kirik?Object.values(r.kirik).reduce((a,x)=>a+(+x||0),0):0;
  const infoRows=[
    ['Kod',u.kod],['Kategori · Marka',[u.kat,u.marka].filter(Boolean).join(' · ')],
    ['Yıl · Mevsim',[u.yil,u.sezon].filter(Boolean).join(' · ')],
    ['Kumaş',u.kumas],u.agirlik?['Ağırlık',u.agirlik+' gr']:null,
    u.birim==='seri'&&u.bedenler&&u.bedenler.length?['Seri İçeriği',u.bedenler.map(x=>typeof x==='object'?x.beden+(x.adet>1?'×'+x.adet:''):x).join(' · ')+' = '+u.seri+' parça']:null,
    ['Tedarikçi',(u.tedarikciId&&cari(u.tedarikciId))?cari(u.tedarikciId).ad:''],
    ['RAF',u.raf],['Kaynak',u.kaynak==='alim'?'Hazır Alınan':'Kendi Üretimi'],
  ].filter(x=>x&&x[1]);
  const oz=urunSatisOzet(id);
  open_(u.ad,`
    ${kapak?`<img src="${kapak}" style="width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}
    <div class="total"><div><div class="l">Satış${u.promosyon?' · promo '+money(u.promosyon,pb):''}</div><div class="v">${money(u.satis,pb)}<span style="font-size:12px;color:var(--sub)">/${u.birim}</span></div></div><div style="text-align:right"><div class="l">Toplam Stok</div><div class="v ${u.stok<=0?'neg':u.stok<=u.kritik?'':'pos'}">${u.stok} ${u.birim}</div></div></div>
    ${karGoster()?`<div class="kv" style="margin-top:8px"><span class="k">Alış / Kâr</span><span class="v">${money(u.alis,pb)} · <span class="pos">${money(kar,pb)} (%${karY})</span></span></div>`:''}
    ${oz.seri>0?`<div class="infobox" style="margin-top:10px;background:var(--good-s);color:var(--good)">📈 Bu üründen <b>${oz.seri} ${u.birim}</b> satıldı${oz.best?` · en çok <b>${esc(oz.best[0])}</b> (${oz.best[1]})`:''}${karGoster()?` · ciro <b>${TL(oz.ciro)}</b>`:''}${oz.sonTarih?` · son ${dstr(oz.sonTarih)}`:''}</div>`:'<div class="mini" style="margin-top:10px">📈 Bu üründen henüz satış yok</div>'}

/* ---- Depo Sayımı (raf + fiziksel sayım, depocu girer) ---- */
function canSayim(){return db.rol==='depocu'||canUrunYaz()}
function depoSayim(){if(!canSayim())return toast('Yetkiniz yok');
  const list=[...db.urunler].filter(u=>!u.pasif).sort((a,b)=>(a.sonSayim||0)-(b.sonSayim||0));
  const today=new Date().toDateString();
  const bugunN=list.filter(u=>u.sonSayim&&new Date(u.sonSayim).toDateString()===today).length;
  const rows=list.map(u=>{const st=hasRenkStok(u)?stokTop(u):(u.stok||0);
    const sayilmis=u.sonSayim&&new Date(u.sonSayim).toDateString()===today;
    return `<div class="row" onclick="formSayim(${u.id},1)"><div class="av ${sayilmis?'g':'gray'}">${sayilmis?'✅':'📦'}</div><div class="mid"><div class="t">${esc(u.ad)}</div><div class="s">${esc(u.kod)} · 📍 ${u.raf?esc(u.raf):'<span style="color:var(--bad)">raf yok</span>'} · ${u.sonSayim?'son '+dstr(u.sonSayim):'hiç sayılmadı'}</div></div><div class="end"><div class="n">${st}</div><div class="u">${u.birim}</div></div></div>`}).join('');
  open_('📋 Depo Sayımı',`
    <div class="infobox">Her ürünü tek tek say; adedini ve rafını gir. Fark çıkarsa sistem otomatik düzeltir. En son sayılanlar en altta.</div>
    <div class="depoprog" style="margin-top:10px"><div class="bar"><i style="width:${list.length?Math.round(bugunN/list.length*100):0}%"></i></div><span class="lbl">${bugunN}/${list.length} bugün</span></div>
    <div class="card" style="margin-top:8px">${rows||emp('📦','Ürün yok')}</div>
  `);
}
function formSayim(id,fromList){const u=urun(id);if(!u)return;if(!canSayim())return toast('Yetkiniz yok');
  const cols=hasRenkStok(u);
  const rows=cols?renkObjs(u).map((r,i)=>`<div class="syrow"><span class="sw sm" style="background:${r.hex}"></span><span class="synm">${esc(r.ad||'—')}<small>sistemde ${r.stok||0} ${u.birim}</small></span><input id="sy-${i}" type="number" inputmode="numeric" min="0" value="${r.stok||0}" oninput="sayFark()" class="syin"></div>`).join('')
    :`<div class="syrow"><span class="synm">${esc(u.ad)}<small>sistemde ${u.stok||0} ${u.birim}</small></span><input id="sy-0" type="number" inputmode="numeric" min="0" value="${u.stok||0}" oninput="sayFark()" class="syin"></div>`;
  open_('📋 Sayım · '+u.ad,`
    <label>📍 RAF / Depo Yeri</label><input id="sy-raf" value="${esc(u.raf||'')}" placeholder="A-12">
    <div class="sec" style="margin-top:12px">Saydığın Adet ${cols?'<span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--sub)">— renk renk</span>':''}</div>
    <div class="card" style="padding:6px 12px">${rows}</div>
    <div class="mini" id="sy-fark" style="margin-top:8px"></div>
    <button class="btn" onclick="kaydetSayim(${id},${fromList?1:0})">✓ Sayımı Kaydet</button>
    ${fromList?`<button class="btn ghost sm" style="margin-top:8px" onclick="depoSayim()">← Sayım listesine dön</button>`:''}
  `);
  window._sayU=u; sayFark();
}
function sayFark(){const u=window._sayU;if(!u)return;const el=$('sy-fark');if(!el)return;
  const cols=hasRenkStok(u);let sis=0,say=0;
  if(cols)renkObjs(u).forEach((r,i)=>{sis+=(+r.stok||0);say+=Math.max(0,+($('sy-'+i)?.value||0))});
  else{sis=+u.stok||0;say=Math.max(0,+($('sy-0')?.value||0))}
  const f=say-sis;
  el.innerHTML=`Sistemde <b>${sis}</b> · saydın <b>${say}</b> · fark <b style="color:${f===0?'var(--good)':f<0?'var(--bad)':'var(--thr)'}">${f>0?'+':''}${f}</b>${f?' '+(f<0?'(eksik/kayıp)':'(fazla)'):' ✓'}`;
}
function kaydetSayim(id,fromList){const u=urun(id);if(!u)return;
  u.raf=($('sy-raf')?.value||'').trim();
  const cols=hasRenkStok(u);let sis=0,fark=0;
  if(cols){renkObjs(u).forEach((r,i)=>{sis+=(+r.stok||0);r.stok=Math.max(0,+($('sy-'+i)?.value||0))});u.stok=stokTop(u);fark=u.stok-sis}
  else{const c=Math.max(0,+($('sy-0')?.value||0));sis=+u.stok||0;fark=c-sis;u.stok=c}
  u.sonSayim=Date.now();save();
  toast(fark===0?'Sayım kaydedildi ✓ fark yok':`Sayım kaydedildi · fark ${fark>0?'+':''}${fark} ${u.birim}`);
  if(fromList)depoSayim();else{closeM();render()}
}

function resizeImg(file,cb,max=900,q=0.72){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{cb(c.toDataURL('image/jpeg',q))}catch(e){cb(r.result)}};img.src=r.result};r.readAsDataURL(file)}
function genBarkod(){let s='869';for(let i=0;i<10;i++)s+=Math.floor(Math.random()*10);return s}

function setKaynak(k){uKaynak=k;const a=$('kn-uretim'),b=$('kn-alim');if(a)a.classList.toggle('on',k==='uretim');if(b)b.classList.toggle('on',k==='alim');const tw=$('ted-wrap');if(tw)tw.style.display=k==='alim'?'':'none';const n=$('kaynak-not');if(n)n.textContent=k==='alim'?'Ürünü hazır aldın — geldiği firmayı (tedarikçi) aşağıda seç.':'Ürünü kendin üretiyorsun — kumaş/aksesuar Hammadde\'den, kesim/dikim/nakış takibi Üretim modülünden gelir.'}
function urunTab(t){uTab=t;$('upane-genel').style.display=t==='genel'?'':'none';$('upane-stok').style.display=t==='stok'?'':'none';$('ut-genel').classList.toggle('on',t==='genel');$('ut-stok').classList.toggle('on',t==='stok')}
function setUPB(v){uPB=v;const seg=$('u-pb-seg');if(seg)[...seg.children].forEach(c=>c.classList.toggle('on',c.textContent.trim().startsWith(PBSYM[v])));karInfo()}
function cizBeden(){const b=$('beden-box');if(!b)return;
  b.innerHTML=fBeden.map((x,i)=>`<div class="brow"><input class="bn" value="${esc(x.beden)}" oninput="fBeden[${i}].beden=this.value.toUpperCase()"><div class="step sm"><button class="b" onclick="bAdet(${i},-1)">−</button><input type="number" inputmode="numeric" value="${x.adet}" oninput="fBeden[${i}].adet=Math.max(1,+this.value||1);bTot()"><button class="b p" onclick="bAdet(${i},1)">+</button></div><button class="del" onclick="fBeden.splice(${i},1);cizBeden()">✕</button></div>`).join('')+`<div style="display:flex;gap:6px;margin-top:8px"><input id="beden-in" class="binp" placeholder="+beden" onkeydown="if(event.key==='Enter'){event.preventDefault();bedenEkle()}"><button type="button" class="btn ghost sm" style="width:auto;padding:8px 13px;margin:0" onclick="bedenEkle()">Ekle</button></div><div class="mini" id="beden-tot" style="margin-top:7px"></div>`;
  bTot();
}
function bTot(){const t=$('beden-tot');if(!t)return;const s=fBeden.reduce((a,x)=>a+(+x.adet||0),0);t.innerHTML=fBeden.length?`👕 Bir seri = <b>${s}</b> parça · ${fBeden.map(x=>x.beden+(x.adet>1?'×'+x.adet:'')).join(' + ')}`:''}
function bAdet(i,d){fBeden[i].adet=Math.max(1,(+fBeden[i].adet||1)+d);cizBeden()}
function bedenEkle(){const el=$('beden-in');const v=(el.value||'').trim().toUpperCase();if(v&&!fBeden.some(x=>x.beden===v))fBeden.push({beden:v,adet:1});el.value='';cizBeden();$('beden-in')&&$('beden-in').focus()}
function bedenPreset(list){fBeden=list.map(b=>({beden:b,adet:1}));cizBeden()}
function cizRenk(){
  const box=$('renk-box');if(!box)return;
  box.innerHTML=fRenk.map((r,i)=>{
    const kirikOpen=r._kirikOpen||(r.kirik&&Object.keys(r.kirik).length);
    const kirikTop=r.kirik?Object.values(r.kirik).reduce((a,x)=>a+(+x||0),0):0;
    return `<div class="renkcard">
      <div class="rc-body">
        <div class="rc-foto" onclick="renkFotoSec(${i})">${r.foto?`<img src="${r.foto}">`:'<span>📷<br>Foto</span>'}<input type="file" accept="image/*" id="rf-${i}" style="display:none" onchange="renkFoto(${i},this)"></div>
        <div class="rc-fields">
          <div class="rc-top"><input class="rad" value="${esc(r.ad||'')}" placeholder="Renk adı (Siyah, Bordo...)" oninput="fRenk[${i}].ad=this.value"><button class="del" onclick="fRenk.splice(${i},1);cizRenk()">✕</button></div>
          <label>Seri Adedi</label><input type="number" inputmode="numeric" min="0" value="${r.stok||0}" oninput="if(+this.value<0)this.value=0;fRenk[${i}].stok=+this.value||0;renkTot()">
        </div>
      </div>
      <div class="rc-kirikh" onclick="renkKirik(${i})">${kirikOpen?'▾':'▸'} Kırık seri (tek beden)${kirikTop?` · ${kirikTop} adet`:''}</div>
      ${kirikOpen?`<div class="rc-kirik">${fBeden.length?fBeden.map(x=>{const bd=x.beden;return `<div class="kb"><span>${esc(bd)}</span><input type="number" inputmode="numeric" value="${(r.kirik&&r.kirik[bd])||''}" placeholder="0" oninput="setKirik(${i},'${esc(bd)}',this.value)"></div>`}).join(''):'<div class="mini">Önce Genel Bilgi sekmesinde seri içeriği (beden) ekle</div>'}</div>`:''}
    </div>`;
  }).join('')+`<button type="button" class="btn ghost sm" onclick="renkEkle()" style="margin-top:10px">+ Renk Ekle</button><div class="mini" id="renk-tot" style="margin-top:8px"></div>`;

const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128Bseq(text){const codes=[104];let sum=104;for(let i=0;i<text.length;i++){const v=text.charCodeAt(i)-32;codes.push(v);sum+=v*(i+1)}codes.push(sum%103);codes.push(106);return codes.map(c=>C128[c]).join('')}
function barkodSVG(text,h=48){const seq=code128Bseq(''+text);const q=10;let x=q,rects='',bar=true;for(const ch of seq){const w=+ch;if(bar)rects+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w;bar=!bar}const W=x+q;return `<svg viewBox="0 0 ${W} ${h+15}" preserveAspectRatio="xMidYMid meet" style="width:100%;max-width:230px;height:auto"><rect x="0" y="0" width="${W}" height="${h+15}" fill="#fff"/><g fill="#000">${rects}</g><text x="${W/2}" y="${h+12}" font-size="11" text-anchor="middle" fill="#000" font-family="monospace" letter-spacing="1">${esc(''+text)}</text></svg>`}

function odemeEkle(){sOdemeler.push({tur:'Nakit',tutar:0,pb:sPB,hesapId:(db.hesaplar[0]&&db.hesaplar[0].id)||0,vade:0,foto:''});cizOdeme()}
function odemeSil(i){sOdemeler.splice(i,1);if(!sOdemeler.length)sOdemeler=[{tur:'Nakit',tutar:0,pb:sPB,hesapId:(db.hesaplar[0]&&db.hesaplar[0].id)||0,vade:0,foto:''}];cizOdeme()}
function odemeSet(i,key,val){const l=sOdemeler[i];if(!l)return;if(key==='tutar')l.tutar=Math.max(0,+val||0);else if(key==='vade')l.vade=val?new Date(val).getTime():0;else if(key==='hesapId')l.hesapId=+val;else l[key]=val;if(key==='tutar'||key==='pb')odemeOzet();}

function odemeKalan(){const div=satisHesap().div;const saleTL=satisHesap().tutar*div;const kalanTL=saleTL-odemeToplamTL();if(kalanTL<=0)return toast('Kalan yok');
  const bos=sOdemeler.find(l=>!(+l.tutar));if(bos){bos.tutar=Math.round(kalanTL/pbKur(bos.pb))}else sOdemeler.push({tur:'Nakit',tutar:Math.round(kalanTL/pbKur(sPB)),pb:sPB,hesapId:(db.hesaplar[0]&&db.hesaplar[0].id)||0,vade:0,foto:''});cizOdeme()}

    ${l.tur==='Havale'?`<select style="margin-top:6px" onchange="odemeSet(${i},'hesapId',this.value)">${db.hesaplar.map(h=>`<option value="${h.id}" ${l.hesapId===h.id?'selected':''}>${esc(h.ad)}</option>`).join('')}</select>`:''}
    ${l.tur==='Kredi Kartı'?`<div class="infobox" style="margin-top:6px">💳 ≈34 gün sonra hesaba geçer (${dstr(Date.now()+34*86400000)})</div>`:''}

function odemeOzet(){const el=$('s-odeme-ozet');if(!el)return;const div=satisHesap().div;const saleTL=satisHesap().tutar*div;const paidTL=odemeToplamTL();const kesikTL=Math.max(0,+($('s-kesik')?.value||0))*div;const kalanTL=saleTL-paidTL-kesikTL;

function urunAra(){const q=($('s-urun-in')?.value||'').trim().toLowerCase();const box=$('s-urun-list');if(!box)return;
  if(!q){box.style.display='none';return}

async function kameraTara(){
  if(!('BarcodeDetector' in window)){toast('Bu cihaz kamerayla taramayı desteklemiyor — kod/isim yazabilirsin');return}
  try{
    const det=new window.BarcodeDetector();
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.createElement('video');v.srcObject=stream;v.setAttribute('playsinline','');await v.play();
    open_('Barkod Tara','<div class="mini">Barkodu kameraya gösterin</div><div id="cam-wrap" style="margin-top:10px;border-radius:12px;overflow:hidden;background:#000"></div>');
    $('cam-wrap').appendChild(v);v.style.width='100%';
    let done=false;const tick=async()=>{if(done)return;try{const codes=await det.detect(v);if(codes.length){done=true;stream.getTracks().forEach(t=>t.stop());const val=codes[0].rawValue;closeM();setTimeout(()=>{if($('s-urun-in')){$('s-urun-in').value=val;urunEnter()}},200);return}}catch(e){}requestAnimationFrame(tick)};tick();
    $('ov').addEventListener('click',function h(e){if(e.target.id==='ov'){done=true;stream.getTracks().forEach(t=>t.stop());$('ov').removeEventListener('click',h)}});
  }catch(e){toast('Kameraya erişilemedi')}
}
const MUS_GRUP=['Bayi','Toptancı','Aracı','Perakende','Özel'];
function grupIsk(g){return {Bayi:5,'Toptancı':7,'Aracı':6,'Özel':8,Perakende:0}[g]||0}
function musBilgi(){const m=sMusId?cari(sMusId):null;const el=$('s-musinfo');if(!el)return;if(!m){el.innerHTML='';return}
  const asim=m.bakiye>0&&m.limit&&m.bakiye>m.limit*0.9;

function satisHesap(){
  const ara=sepet.reduce((a,k)=>a+k.mik*k.fiyat,0);
  const isk=+($('s-isk')?.value||0), vf=vadeFarkiYuzde(), kdv=+($('s-kdv')?.value||0), tasima=+($('s-tasima')?.value||0);
  const div=sPB==='USD'?db.kurUSD:sPB==='EUR'?db.kurEUR:1;
  const mal=ara*(1-isk/100)*(1+vf/100);   // TL bazı, indirim + vade farkı sonrası
  const kdvTutar=mal*kdv/100;
  const malPB=mal/div, kdvPB=kdvTutar/div;
  const tutar=malPB+kdvPB+tasima;         // satış para biriminde
  return {ara,isk,vf,kdv,tasima,div,malPB,kdvPB,tutar};
}
function sonFiyat(mid,uid){if(!mid)return 0;const ss=db.satislar.filter(s=>s.mid===mid).sort((a,b)=>b.tarih-a.tarih);for(const s of ss){const k=(s.kalemler||[]).find(x=>x.uid===uid);if(k)return k.fiyat}return 0}
function musUrunFiyat(uid){const u=urun(uid);if(!u)return 0;return sonFiyat(sMusId,uid)||u.satis}
function urnBilgi(){const u=sUrunId?urun(sUrunId):null;const info=$('s-urninfo'),rb=$('s-renkler'),box=$('s-mikbox');if(!rb)return;
  if(!u){if(box)box.style.display='none';rb.innerHTML='';if(info)info.textContent='';return}
  const objs=renkObjs(u);const eski=sonFiyat(sMusId,u.id);const fy=eski||u.satis;const pb=u.pb||'TL';
  const fiyatRow=`<div style="margin:8px 0 2px"><div style="display:flex;gap:8px;align-items:center"><label style="margin:0;flex:0 0 auto">Bu satış fiyatı</label><input id="s-fiyat" type="number" inputmode="numeric" min="0" value="${fy}" style="width:120px;margin:0;padding:9px" oninput="fiyatBilgi()"><span class="mini">/${u.birim} (${pb})</span></div><div class="mini" id="s-fiyat-info" style="margin-top:5px"></div></div>`;
  if(objs.length){
    if(box)box.style.display='none';if(info)info.textContent='';
    rb.innerHTML=`<div class="mini" style="margin:10px 0 2px">🎨 <b>${esc(u.ad)}</b> — renk renk adet gir:</div>`+fiyatRow+objs.map((r,i)=>`<div class="renksel"><span class="sw sm" style="background:${r.hex}"></span><span class="rn">${esc(r.ad||'—')}</span><span class="rs ${r.stok<=0?'bad':''}">stok ${r.stok||0}</span><div class="step sm"><button class="b" onclick="rq(${i},-1)">−</button><input id="rq-${i}" type="number" value="0" inputmode="numeric" min="0" oninput="rqCheck(${i},${r.stok||0})"><button class="b p" onclick="rq(${i},1,${r.stok||0})">+</button></div></div>`).join('')+`<button type="button" class="btn ghost sm" style="margin-top:9px" onclick="sepEkle()">+ Sepete Ekle</button>`;
  }else{
    if(box)box.style.display='block';rb.innerHTML=`<div class="mini" style="margin-top:8px">${esc(u.ad)} · Stok: ${u.stok} ${u.birim}</div>`+fiyatRow;
    if(info)info.innerHTML='';
  }

function fiyatBilgi(){const u=sUrunId?urun(sUrunId):null;const el=$('s-fiyat-info');if(!u||!el)return;const pb=u.pb||'TL';const fy=+($('s-fiyat')?.value)||0;const eski=sonFiyat(sMusId,u.id);const kar=fy-(u.alis||0);const ky=u.alis?Math.round(kar/u.alis*100):0;
  const parts=[];
  if(karGoster())parts.push(`maliyet <b>${money(u.alis||0,pb)}</b> · kâr <b class="${kar>=0?'pos':'neg'}">${money(kar,pb)}${u.alis?' (%'+ky+')':''}</b>`);
  if(eski)parts.push(`<span style="color:var(--ind2);font-weight:700">🧠 müşteri en son ${money(eski,pb)} aldı</span>`);
  el.innerHTML=parts.join(' · ');
}
function rq(i,d,stok){const el=$('rq-'+i);if(!el)return;let v=Math.max(0,(+el.value||0)+d);el.value=v;if(stok!=null&&v>stok)toast('⚠️ Stokta '+stok+' var, fazlasını giriyorsun')}
function rqCheck(i,stok){const el=$('rq-'+i);if(!el)return;if(+el.value<0)el.value=0;if((+el.value||0)>stok)toast('⚠️ Stokta '+stok+' var, fazlasını giriyorsun')}
function mik(d){const i=$('s-mik');i.value=Math.max(1,(+i.value||1)+d)}
function setPB(pb){sPB=pb;['TL','USD','EUR'].forEach(x=>$('pb-'+x).classList.toggle('on',x===pb));cizSepet()}

function satisReset(){sUrunId=0;if($('s-urun-in'))$('s-urun-in').value='';if($('s-renkler'))$('s-renkler').innerHTML='';if($('s-mikbox'))$('s-mikbox').style.display='none';if($('s-urninfo'))$('s-urninfo').textContent='';if($('s-mik'))$('s-mik').value=1}
function sepEkle(){const u=sUrunId?urun(sUrunId):null;if(!u)return toast('Önce ürün seç');
  const fy=($('s-fiyat')&&$('s-fiyat').value!=='')?Math.max(0,+$('s-fiyat').value||0):musUrunFiyat(u.id);
  const objs=renkObjs(u);

    const rl=[];objs.forEach((r,i)=>{const q=+($('rq-'+i)?.value||0);if(q>0)rl.push({ad:r.ad,mik:q})});
    if(!rl.length)return toast('En az bir renk için adet gir');
    const exist=sepet.find(k=>k.uid===u.id&&k.renkler);
    if(exist){rl.forEach(nr=>{const f=exist.renkler.find(x=>x.ad===nr.ad);if(f)f.mik+=nr.mik;else exist.renkler.push(nr)});exist.mik=exist.renkler.reduce((a,x)=>a+x.mik,0)}
    else sepet.push({uid:u.id,urun:u.ad,mik:rl.reduce((a,x)=>a+x.mik,0),birim:u.birim,fiyat:fy,renkler:rl});

  }
  const m=+$('s-mik').value;if(!m||m<=0)return toast('Miktar girin');
  const ex=sepet.find(k=>k.uid===u.id&&!k.renkler);if(ex)ex.mik+=m;else sepet.push({uid:u.id,urun:u.ad,mik:m,birim:u.birim,fiyat:fy});satisReset();cizSepet()}
function vadeFarkiYuzde(){return sVade?Math.round(sVade/30)*2.5:0}

  if($('s-odeme-ozet'))odemeOzet();
}
function satisDiv(s){return s.pb==='USD'?db.kurUSD:s.pb==='EUR'?db.kurEUR:1}
function stokUygula(k,mult){ // mult=-1 satış (düş), +1 iptal (geri)
  const u=urun(k.uid);if(!u)return;
  if(k.renkler&&k.renkler.length&&Array.isArray(u.renkler)){
    k.renkler.forEach(rr=>{const ro=u.renkler.find(x=>x&&typeof x==='object'&&x.ad===rr.ad);if(ro)ro.stok=(+ro.stok||0)+mult*rr.mik});
    syncStok(u);
  }else{u.stok+=mult*k.mik}
}
function applySatis(s){
  const m=cari(s.mid),div=satisDiv(s);
  s.kalemler.forEach(k=>stokUygula(k,-1));
  if(m)m.bakiye+=(s.tutar-s.odenen-(s.kesik||0))*div;
  if(m&&s.kesik)m.kesikToplam=(m.kesikToplam||0)+s.kesik*div;
  (s.odemeler||[]).forEach(l=>{const lTL=(+l.tutar||0)*pbKur(l.pb);l._tl=lTL;if(lTL<=0)return;
    if(l.tur==='Çek'){const c={id:nid('cek'),tur:'cek',tip:'alinan',cariId:s.mid,cari:s.mus,tutar:lTL,vade:l.vade||(Date.now()+30*86400000),banka:'—',durum:'portfoyde',foto:l.foto||''};db.cekler.push(c);l._cekId=c.id}
    else if(l.tur==='Kredi Kartı'){const c={id:nid('cek'),tur:'kk',tip:'alinan',cariId:s.mid,cari:s.mus,tutar:lTL,vade:l.vade||(Date.now()+34*86400000),banka:'Kredi Kartı POS',durum:'portfoyde'};db.cekler.push(c);l._cekId=c.id}
    else{const h=l.tur==='Havale'?hesap(l.hesapId):(db.hesaplar.find(x=>/nakit|kasa/i.test(x.ad))||db.hesaplar[0]);if(h){h.bakiye+=lTL;l._hesapId=h.id}}
  });
}
function revertSatis(s){
  const m=cari(s.mid),div=satisDiv(s);
  s.kalemler.forEach(k=>stokUygula(k,1));
  if(m)m.bakiye-=(s.tutar-s.odenen-(s.kesik||0))*div;
  if(m&&s.kesik)m.kesikToplam=(m.kesikToplam||0)-s.kesik*div;
  if(s.odemeler&&s.odemeler.length){
    s.odemeler.forEach(l=>{const lTL=l._tl!=null?l._tl:(+l.tutar||0)*pbKur(l.pb);
      if(l._cekId){db.cekler=db.cekler.filter(c=>c.id!==l._cekId);l._cekId=null}
      else if(l._hesapId){const h=hesap(l._hesapId);if(h)h.bakiye-=lTL;l._hesapId=null}
    });
  }else if(s.odenen>0){ // eski kayıt uyumu
    if(s.odemeCekId){db.cekler=db.cekler.filter(c=>c.id!==s.odemeCekId);s.odemeCekId=null}
    else{const h=hesap(s.odemeHesapId);if(h)h.bakiye-=s.odenen*div}
  }
}
function kaydetSatis(){
  if(!sepet.length)return toast('Sepet boş');
  const typed=($('s-mus-in')?.value||'').trim();
  if(!sMusId){
    if(typed)return askConfirm(`"${typed}" kayıtlı müşteri değil.\nÖnce müşteri olarak kaydedilsin mi?`,()=>satisMusteriEkle(typed),'Müşteri Ekle');
    return toast('Müşteri seç');
  }
  const m=cari(sMusId);if(!m)return toast('Müşteri seç');
  const h=satisHesap();
  const div=h.div, tutar=h.tutar, saleTL=tutar*div;
  const odemeler=sOdemeler.filter(l=>+l.tutar>0).map(l=>({tur:l.tur,tutar:+l.tutar,pb:l.pb,hesapId:l.hesapId||0,vade:l.vade||0,foto:l.foto||''}));
  let paidTL=odemeler.reduce((a,l)=>a+l.tutar*pbKur(l.pb),0);
  if(paidTL>saleTL+0.5)toast('⚠️ Ödeme toplamdan fazla — fazlası müşteri alacağına yazıldı');
  const oden=paidTL/div; // satış para biriminde
  let kesik=Math.max(0,+($('s-kesik')?.value||0));kesik=Math.min(kesik,Math.max(0,tutar-oden)); // kalanı aşamaz
  const odetur=odemeler.length>1?'Karışık':(odemeler[0]?odemeler[0].tur:'—');
  const old=sEdit?db.satislar.find(x=>x.id===sEdit):null;
  const data={tip:'satis',mid:m.id,mus:m.ad,kalemler:sepet.map(k=>({uid:k.uid,urun:k.urun,mik:k.mik,birim:k.birim,fiyat:k.fiyat,renkler:k.renkler?k.renkler.map(r=>({...r})):undefined})),araToplam:h.ara,iskonto:h.isk,vadeFarki:h.vf,kdv:h.kdv,kdvTutar:h.kdvPB,tasima:h.tasima,sevkiyat:($('s-sevk')?.value||'').trim(),tutar,odenen:oden,kesik,pb:sPB,durum:'tamam',teslimDurum:sDurum,depo:$('s-depo')?.checked?((old&&old.depo==='hazir')?'hazir':'bekliyor'):null,odemeler,odemeTur:odetur};
  const commit=()=>{
    if(old)revertSatis(old);
    if(sEdit&&old){data.id=old.id;data.tarih=old.tarih;Object.assign(old,data);applySatis(old);save();closeM();go('satis');toast('Satış güncellendi ✓')}
    else{data.id=nid('s');data.tarih=Date.now();db.satislar.push(data);applySatis(data);save();closeM();go('satis');toast('Satış kaydedildi ✓ '+money(tutar,sPB))}
  };
  const eskiBorc=old?(old.tutar-old.odenen-(old.kesik||0))*satisDiv(old):0;
  const yeniBorc=m.bakiye-eskiBorc+(tutar-oden-kesik)*div;
  if(m.limit&&yeniBorc>m.limit)askConfirm(`${m.ad} kredi limitini aşıyor:\nYeni borç ${TL(yeniBorc)} / limit ${TL(m.limit)}\n\nYine de kaydedilsin mi?`,commit,'Kaydet');
  else commit();
}

function depoLines(s){ // rafa göre sıralı, tek tek toplanacak satırlar
  const lines=[];
  s.kalemler.forEach((k,ki)=>{const u=urun(k.uid);const raf=(u&&u.raf)?u.raf:'—';
    if(k.renkler&&k.renkler.length)k.renkler.forEach((r,ri)=>lines.push({key:ki+'_'+ri,urun:k.urun,renk:r.ad,mik:r.mik,birim:k.birim,raf}));
    else lines.push({key:ki+'_x',urun:k.urun,renk:'',mik:k.mik,birim:k.birim,raf});
  });
  return lines.sort((a,b)=>(''+a.raf).localeCompare(''+b.raf,'tr')||a.urun.localeCompare(b.urun,'tr'));
}

function cariEkstre(id){
  const c=cari(id);const evs=[];const isMus=c.tip==='musteri';
  db.satislar.filter(s=>s.mid===id).forEach(s=>{const div=satisDiv(s);
    evs.push({t:s.tarih,ad:'Satış',det:s.kalemler.map(k=>k.urun).join(', ').slice(0,40),borc:s.tutar*div,sid:s.id});
    if(s.odenen>0)evs.push({t:s.tarih+1,ad:'Ödeme (satışta)',det:s.odemeTur||'',alacak:s.odenen*div});
    if(s.kesik>0)evs.push({t:s.tarih+2,ad:'Kesik',det:'müşteri kırdı',alacak:s.kesik*div});
  });
  (db.hareketler||[]).filter(h=>h.cariId===id).forEach(h=>{
    const isTah=h.tip==='tahsilat';
    if(h.tutar>0)evs.push({t:h.tarih,ad:isTah?'Tahsilat':'Ödeme',det:h.tur||'',[isMus===isTah?'alacak':'borc']:h.tutar});
    if(h.kesik>0)evs.push({t:h.tarih+1,ad:'Kesik',det:'müşteri kırdı',alacak:h.kesik});
  });
  evs.sort((a,b)=>a.t-b.t);
  const net=evs.reduce((a,e)=>a+(e.borc||0)-(e.alacak||0),0);
  const devir=(c.bakiye||0)-net;
  return {evs,devir};
}

  h+=`<div class="sec" style="margin-top:16px">💳 Ödeme Geçmişi (${odemeGec.length})</div>`;
  h+=odemeGec.length?odemeGec.slice(0,10).map(o=>`<div class="li"><div class="lt">${esc(o.tur)}${o.satis?' <small style="display:inline;color:var(--sub)">(satışta)</small>':''}<small>${tstr(o.tarih)}</small></div><b class="pos">${TL(o.tutar)}</b></div>`).join(''):'<div class="mini">Ödeme yok</div>';
  if(cekGec.length){h+=`<div class="sec" style="margin-top:16px">🏷️ Verdiği Çek / Kart (${cekGec.length})</div>`;

  return h;
}
function cekFotoGoster(cekId){const k=db.cekler.find(x=>x.id===cekId);if(!k||!k.foto)return;open_('Çek Resmi',`<img src="${k.foto}" style="width:100%;border-radius:12px"><div class="kv" style="margin-top:10px"><span class="k">Tutar</span><span class="v">${TL(k.tutar)}</span></div><div class="kv"><span class="k">Vade</span><span class="v">${dstr(k.vade)}</span></div>`)}
function sonTahsilat(id){let t=0;(db.hareketler||[]).filter(h=>h.cariId===id&&h.tip==='tahsilat'&&h.tutar>0).forEach(h=>{if(h.tarih>t)t=h.tarih});db.satislar.filter(s=>s.mid===id&&s.odenen>0).forEach(s=>{if(s.tarih>t)t=s.tarih});return t}
function gecikmeGun(id){const t=sonTahsilat(id);if(t)return Math.floor((Date.now()-t)/86400000);const ilk=db.satislar.filter(s=>s.mid===id).map(s=>s.tarih).sort((a,b)=>a-b)[0];return ilk?Math.floor((Date.now()-ilk)/86400000):0}
function waHatirlat(id){const m=cari(id);if(!m)return;let ph=((m.tel)||'').replace(/\D/g,'');if(ph){if(ph.length===10)ph='90'+ph;else if(ph[0]==='0')ph='9'+ph}
  const msg=`Merhaba ${m.ad}, Öz Tekstil. Güncel bakiyeniz ${TL(Math.max(0,m.bakiye))}. Uygun olduğunuzda ödeme yapabilirseniz seviniriz. Teşekkürler 🙏`;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`,'_blank');
}
function tahsilatHatirlat(){
  const list=db.cariler.filter(c=>c.tip==='musteri'&&c.bakiye>0).map(c=>({c,g:gecikmeGun(c.id)})).sort((a,b)=>b.g-a.g);
  const cuma=new Date().getDay()===5;
  open_('🔔 Tahsilat Hatırlatma',`
    ${cuma?'<div class="okbox" style="margin-bottom:8px">📅 Bugün Cuma — tahsilat günü!</div>':''}

    <div style="margin-top:10px">${list.length?list.map(({c,g})=>`<div class="li"><div class="lt">${esc(c.ad)}<small class="${g>=15?'':''}" style="${g>=15?'color:var(--bad);font-weight:700':''}">${g?g+' gündür ödeme yok':'ödeme yok'} · ${TL(c.bakiye)} borç</small></div><button class="btn g sm" style="width:auto;padding:8px 12px;margin:0" onclick="waHatirlat(${c.id})">📱</button></div>`).join(''):'<div class="mini">Borçlu müşteri yok 🎉</div>'}</div>
  `);
}
function ekstreGoster(id){
  const c=cari(id);const {evs,devir}=cariEkstre(id);let run=devir;
  const rows=evs.map(e=>{run+=(e.borc||0)-(e.alacak||0);return `<div class="exrow"><div class="exl"><b>${e.ad}</b><small>${tstr(e.t)}${e.det?' · '+esc(e.det):''}</small></div><div class="exb ${e.borc?'neg':'pos'}">${e.borc?'+'+TL(e.borc):'−'+TL(e.alacak)}</div><div class="exr ${run>0?'neg':run<0?'pos':''}">${TL(Math.abs(run))}${run<0?' A':''}</div></div>`}).join('');
  open_('Ekstre · '+c.ad,`
    <div class="exhead"><span>Hareket</span><span>Tutar</span><span>Bakiye</span></div>
    <div class="exrow"><div class="exl"><b>Devir (önceki bakiye)</b></div><div class="exb"></div><div class="exr ${devir>0?'neg':devir<0?'pos':''}">${TL(Math.abs(devir))}${devir<0?' A':''}</div></div>
    ${rows||'<div class="mini" style="padding:10px">Hareket yok</div>'}
    <div class="total" style="margin-top:12px"><div class="l">GÜNCEL BAKİYE</div><div class="v ${c.bakiye>0?'neg':c.bakiye<0?'pos':''}">${TL(Math.abs(c.bakiye||0))}${c.bakiye<0?' (alacaklı)':c.bakiye>0?' (borçlu)':''}</div></div>
    <div class="mini" style="margin-top:6px">Borç kırmızı (+), tahsilat/ödeme yeşil (−). "A" = müşteri alacaklı.</div>
  `);

function formOdeme(id){

  open_((isMus?'Tahsilat · ':'Ödeme · ')+c.ad,`
    <div class="mini">${isMus?'Güncel borç':'Ona borcun'}: <b>${c.doviz==='USD'?USD(c.bakiyeUSD||0):TL(Math.max(0,c.bakiye))}</b></div>
    <label>Tutar (₺)</label><input id="o-t" type="number" inputmode="numeric" placeholder="0">

    ${isMus?`<label>Kesik <span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--sub)">— müşteri kırdı, borçtan düşülür (zarar)</span></label><input id="o-kesik" type="number" inputmode="numeric" min="0" placeholder="0">`:''}
    <button class="btn ${isMus?'g':''}" onclick="kaydetOdeme(${id})">${isMus?'Tahsilatı Kaydet':'Ödemeyi Kaydet'}</button>
  `);

function kaydetOdeme(id){
  const t=+$('o-t').value||0;const kesik=Math.max(0,+($('o-kesik')?.value||0));if(t<=0&&kesik<=0)return toast('Tutar girin');
  const c=cari(id);const isMus=c.tip==='musteri';const tur=$('o-tur').value;const h=hesap(+$('o-hesap').value);
  if(isMus){c.bakiye-=(t+kesik);if(kesik>0)c.kesikToplam=(c.kesikToplam||0)+kesik;if(t>0){if(tur==='Çek'){db.cekler.push({id:nid('cek'),tur:'cek',tip:'alinan',cariId:c.id,cari:c.ad,tutar:t,vade:Date.now()+30*86400000,banka:'—',durum:'portfoyde'})}else if(tur==='Kredi Kartı'){db.cekler.push({id:nid('cek'),tur:'kk',tip:'alinan',cariId:c.id,cari:c.ad,tutar:t,vade:Date.now()+34*86400000,banka:'Kredi Kartı POS',durum:'portfoyde'})}else if(h){h.bakiye+=t}}}
  else{ // tedarikçi/fason/gider ödeme
    if(c.doviz==='USD'){c.bakiyeUSD=(c.bakiyeUSD||0)-(t/db.kurUSD)}else{c.bakiye-=t}
    if(tur==='Çek'){db.cekler.push({id:nid('cek'),tip:'verilen',cariId:c.id,cari:c.ad,tutar:t,vade:Date.now()+90*86400000,banka:'—',durum:'portfoyde',verilisKur:db.kurUSD})}else if(h){h.bakiye-=t}
  }
  db.hareketler.push({id:nid('hr'),cariId:id,tip:isMus?'tahsilat':'odeme',tutar:t,kesik,tur,tarih:Date.now()});
  save();closeM();rCari();toast((isMus?'Tahsilat':'Ödeme')+' kaydedildi ✓ '+TL(t)+(isMus&&kesik>0?' + kesik '+TL(kesik):''))}
function formAlim(id){
