const RAP_PAL=['#2d6cdf','#e0455f','#0f9d63','#c67b2c','#7a4fd0','#2fa8bd','#d9639a','#8a97a8'];
function rapAralik(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(rapDonem==='ay')return [new Date(y,m,1).getTime(),Infinity,'Bu Ay'];
  if(rapDonem==='gecen')return [new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime(),'Geçen Ay'];
  if(rapDonem==='yil')return [new Date(y,0,1).getTime(),Infinity,'Bu Yıl'];
  return [0,Infinity,'Tüm Zamanlar'];
}
function rapOncekiAralik(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(rapDonem==='ay')return [new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime()];
  if(rapDonem==='gecen')return [new Date(y,m-2,1).getTime(),new Date(y,m-1,1).getTime()];
  if(rapDonem==='yil')return [new Date(y-1,0,1).getTime(),new Date(y,0,1).getTime()];
  return null;
}
function rapDon(d){rapDonem=d;rRapor()}
function kisaTL(n){n=Math.round(+n||0);const a=Math.abs(n);if(a>=1e6)return '₺'+(n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+'M';if(a>=1000)return '₺'+Math.round(n/1000)+'B';return '₺'+n}
function rapDelta(cur,prev){if(prev==null)return '';if(!prev)return cur>0?`<span style="color:var(--good);font-weight:800">▲ yeni</span>`:`<span style="color:var(--sub)">—</span>`;
  const p=Math.round((cur-prev)/Math.abs(prev)*100);const up=p>=0;return `<span style="color:${up?'var(--good)':'var(--bad)'};font-weight:800">${up?'▲':'▼'} %${Math.abs(p)}</span>`;}
function barsHtml(rows,renk){const mx=rows.length?Math.max(...rows.map(r=>r.v)):1;
  return rows.length?`<div class="bars">`+rows.map(r=>`<div class="bar"><div class="nm">${esc(r.ad)}</div><div class="tr"><i style="width:${Math.max(4,Math.round(r.v/(mx||1)*100))}%;background:${renk||'linear-gradient(90deg,var(--ind2),#8fb3ec)'}"></i></div><div class="am">${r.g}</div></div>`).join('')+`</div>`:`<div class="mini">Bu dönemde veri yok</div>`;
}
// SVG alan/çizgi grafiği — pts:[{x,v}]
function svgArea(pts,renk){
  if(!pts.length)return `<div class="mini" style="text-align:center;padding:26px 0">Bu dönemde satış yok</div>`;
  if(pts.length===1)pts=[{x:'',v:0},pts[0]];
  const W=328,H=132,PB=20,PT=14,max=Math.max(...pts.map(p=>p.v),1),n=pts.length;
  const X=i=>(i/(n-1))*(W-14)+7,Y=v=>H-PB-(v/max)*(H-PB-PT);
  const lp=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const ap=`M${X(0).toFixed(1)} ${H-PB} `+pts.map((p,i)=>`L${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ')+` L${X(n-1).toFixed(1)} ${H-PB} Z`;
  const pk=pts.reduce((mi,p,i,a)=>p.v>a[mi].v?i:mi,0);
  const step=Math.max(1,Math.ceil(n/6));let lbl='';
  for(let i=0;i<n;i+=step)lbl+=`<text x="${X(i).toFixed(1)}" y="${H-5}" font-size="8.5" fill="var(--sub)" text-anchor="middle">${esc(pts[i].x)}</text>`;
  const gid='ga'+Math.round(max%99999)+n;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${renk}" stop-opacity=".32"/><stop offset="1" stop-color="${renk}" stop-opacity="0"/></linearGradient></defs>
    <line x1="7" y1="${H-PB}" x2="${W-7}" y2="${H-PB}" stroke="var(--ln)" stroke-width="1"/>
    <path d="${ap}" fill="url(#${gid})"/><path d="${lp}" fill="none" stroke="${renk}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pk).toFixed(1)}" cy="${Y(pts[pk].v).toFixed(1)}" r="3.4" fill="${renk}" stroke="#fff" stroke-width="1.5"/>
    <text x="${X(pk).toFixed(1)}" y="${Math.max(11,Y(pts[pk].v)-6).toFixed(1)}" font-size="9" font-weight="800" fill="${renk}" text-anchor="middle">${kisaTL(pts[pk].v)}</text>
    ${lbl}</svg>`;
}
// SVG halka grafiği — rows:[{ad,v}]
function svgDonut(rows){
  const tot=rows.reduce((a,r)=>a+r.v,0);if(!tot)return `<div class="mini">veri yok</div>`;
  const S=132,cx=66,cy=66,r=48,C=2*Math.PI*r;let acc=0;
  const segs=rows.map((row,i)=>{const frac=row.v/tot,dash=frac*C,off=-acc*C;acc+=frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${RAP_PAL[i%RAP_PAL.length]}" stroke-width="16" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`}).join('');
  return `<svg viewBox="0 0 ${S} ${S}" width="120" height="120" style="flex:0 0 120px">${segs}
    <text x="${cx}" y="${cy-3}" font-size="10" fill="var(--sub)" text-anchor="middle">Toplam</text>
    <text x="${cx}" y="${cy+13}" font-size="14" font-weight="800" fill="var(--ink)" text-anchor="middle">${kisaTL(tot)}</text></svg>`;
}
function rapTrend(sat,toTL){
  const now=new Date(),AY=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'],pts=[];
  const [bas]=rapAralik();
  if(rapDonem==='ay'||rapDonem==='gecen'){
    const d0=new Date(bas),yy=d0.getFullYear(),mm=d0.getMonth(),dim=new Date(yy,mm+1,0).getDate();
    const last=(rapDonem==='ay'&&now.getFullYear()===yy&&now.getMonth()===mm)?now.getDate():dim;
    const buk=Array(dim+1).fill(0);sat.forEach(s=>{const d=new Date(s.tarih);buk[d.getDate()]+=toTL(s)});
    for(let i=1;i<=last;i++)pts.push({x:''+i,v:buk[i]});
  }else if(rapDonem==='yil'){
    const buk=Array(12).fill(0);sat.forEach(s=>{buk[new Date(s.tarih).getMonth()]+=toTL(s)});
    for(let i=0;i<=now.getMonth();i++)pts.push({x:AY[i],v:buk[i]});
  }else{
    const map={};sat.forEach(s=>{const d=new Date(s.tarih),k=d.getFullYear()*12+d.getMonth();map[k]=(map[k]||0)+toTL(s)});
    Object.keys(map).map(Number).sort((a,b)=>a-b).slice(-12).forEach(k=>pts.push({x:AY[k%12]+' '+(''+Math.floor(k/12)).slice(2),v:map[k]}));
  }
  return pts;
}
function rapCtx(){
  const [bas,bit,donemAd]=rapAralik();
  const inRange=ts=>ts>=bas&&ts<bit;
  const onc=rapOncekiAralik();
  const kar=karGoster();
  const toTL=s=>(+s.tutar||0)*pbKur(s.pb);
  const filt=r=>db.satislar.filter(s=>s.tip!=='iade'&&r(s.tarih));
  const sat=filt(inRange);
  const satOnc=onc?filt(ts=>ts>=onc[0]&&ts<onc[1]):null;
  const ciroOf=arr=>arr.reduce((a,s)=>a+toTL(s),0);
  const karOf=arr=>{let m=0;arr.forEach(s=>s.kalemler.forEach(k=>{const u=urun(k.uid);if(u)m+=(+u.alis||0)*k.mik*(k.birim==='seri'?(u.seri||1):1)}));return ciroOf(arr)-m};
  const ciro=ciroOf(sat),brutKar=karOf(sat),marj=ciro?Math.round(brutKar/ciro*100):0;
  const adet=sat.reduce((a,s)=>a+s.kalemler.reduce((x,k)=>x+(+k.mik||0),0),0);
  const kesikTop=sat.reduce((a,s)=>a+(+s.kesik||0)*pbKur(s.pb),0);
  const tahsil=sat.reduce((a,s)=>a+(+s.odenen||0)*pbKur(s.pb),0);
  const acikDonem=Math.max(0,ciro-tahsil-kesikTop);
  const tahOran=ciro?Math.round(tahsil/ciro*100):0;
  const acikAlacak=db.cariler.filter(c=>c.tip==='musteri'&&c.bakiye>0).reduce((a,c)=>a+c.bakiye,0);
  const kdv=sat.reduce((a,s)=>a+(+s.kdvTutar||0)*pbKur(s.pb),0);
  const giderTop=(db.hareketler||[]).filter(x=>x.yon==='out'&&x.tur!=='Transfer'&&inRange(x.tarih)).reduce((a,x)=>a+(+x.tutar||0),0);
  return {bas,bit,donemAd,inRange,onc,kar,toTL,sat,satOnc,ciroOf,karOf,ciro,brutKar,marj,adet,kesikTop,tahsil,acikDonem,tahOran,acikAlacak,kdv,giderTop,
    ciroOnc:satOnc?ciroOf(satOnc):null,karOncV:satOnc?karOf(satOnc):null,islemOnc:satOnc?satOnc.length:null,tahOnc:satOnc?satOnc.reduce((a,s)=>a+(+s.odenen||0)*pbKur(s.pb),0):null};
}

    <div class="exrow"><div class="exl"><b>Müşteri kesik/kırma</b><small>satışta verilen indirim/eksik (${R.donemAd})</small></div><div class="exb neg">−${TL(R.kesikTop)}</div></div>
    <div class="exrow"><div class="exl"><b>Üretim defo (fire)</b><small>tüm iş emirlerinde defolu adet</small></div><div class="exb neg">${defoAdet} adet</div></div>
    ${db.kirmaToplam?`<div class="exrow"><div class="exl"><b>Tahsilat kırması</b><small>tahsilatta müşterinin kırdığı</small></div><div class="exb neg">−${TL(db.kirmaToplam)}</div></div>`:''}
  </div>`;
  return h;
}
function rapMetni(){
  const R=rapCtx();
  const net=R.brutKar-R.giderTop;
  let t=`📊 ${db.firma||'Öz Tekstil'} — ${R.donemAd} Raporu\n\n`;
  t+=`💰 Ciro: ${TL(R.ciro)}\n`;
  if(R.kar)t+=`📈 Brüt kâr: ${TL(R.brutKar)} (%${R.marj})\n💸 Gider: ${TL(R.giderTop)}\n✅ Net kâr: ${TL(net)}\n`;
  t+=`🧾 İşlem: ${R.sat.length} · Satılan: ${R.adet} adet\n`;
  t+=`📥 Tahsilat: ${TL(R.tahsil)} (%${R.tahOran}) · Açık alacak: ${TL(R.acikAlacak)}\n`;
  const satMap={};R.sat.forEach(s=>s.kalemler.forEach(k=>{satMap[k.urun]=(satMap[k.urun]||0)+(+k.mik||0)}));
  const top=Object.entries(satMap).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(top.length)t+=`\n🏆 En çok satan:\n`+top.map((x,i)=>`${i+1}. ${x[0]} (${x[1]})`).join('\n');
  return t;
}
async function rapPaylas(){
  const t=rapMetni();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Rapor panoya kopyalandı ✓')}catch(e){open_('Rapor Özeti',`<textarea readonly style="width:100%;height:230px;font-size:12px">${esc(t)}</textarea><div class="mini" style="margin-top:6px">Metni kopyalayıp WhatsApp'tan gönderebilirsin.</div>`)}
}
function rRapor(){
  const R=rapCtx();
  const sel=[['ay','Bu Ay'],['gecen','Geçen Ay'],['yil','Bu Yıl'],['tum','Tümü']];
  let html=`<div class="tabs" style="overflow-x:auto">`+sel.map(([k,l])=>`<div class="tb ${rapDonem===k?'on':''}" onclick="rapDon('${k}')" style="white-space:nowrap">${l}</div>`).join('')+`</div>`;
  const tabs=[['ozet','📈','Özet'],['satis','🛒','Satış'],['para','💰','Tahsilat'],['gider','💸','Gider'],['stok','📦','Stok'],['musteri','👥','Müşteri'],['uretim','🏭','Üretim']];
  if(!tabs.some(t=>t[0]===rapTab))rapTab='ozet';
  html+=`<div class="tabs" style="overflow-x:auto;margin-top:6px">`+tabs.map(([k,ic,l])=>`<div class="tb ${rapTab===k?'on':''}" onclick="rapSek('${k}')" style="white-space:nowrap">${ic} ${l}</div>`).join('')+`</div>`;
  const R2={...R};
  const body={ozet:rapOzet,satis:rapSatis,para:rapPara,gider:rapGider,stok:rapStok,musteri:rapMusteri,uretim:rapUretim}[rapTab](R2);
  html+=`<div style="margin-top:4px">${body}</div><div style="height:8px"></div>`;
  $('app').innerHTML=html;
}

/* ---------- AYARLAR ---------- */
function rAyarlar(){
  const y=yetki();
  let html=`<div class="sec">Firma</div><div class="card"><div class="row" onclick="formFirma()"><div class="av" style="background:var(--ind)">🏢</div><div class="mid"><div class="t">${esc(db.firma)}</div><div class="s">${esc(db.firmaSlogan||'firma bilgileri · fişte görünür')}</div></div><span style="color:var(--sub)">›</span></div>
    <div class="row" onclick="formKur()"><div class="av o">💱</div><div class="mid"><div class="t">Kur</div><div class="s">$ ${db.kurUSD.toFixed(2)} · € ${db.kurEUR.toFixed(2)}</div></div><span style="color:var(--sub)">›</span></div></div>`;
  html+=`<div class="sec">Kullanıcılar & Roller</div><div class="card">`+Object.keys(ROLLER).map(k=>`<div class="row" onclick="setRol('${k}')"><div class="av" style="background:${rolRenk(k)}">${ROLLER[k].ic}</div><div class="mid"><div class="t">${ROLLER[k].ad}</div><div class="s">${ROLLER[k].kar?'kâr görür':'kâr gizli'}</div></div>${db.rol===k?'<span class="pill ok">aktif</span>':''}</div>`).join('')+`</div>`;
  html+=`<div class="sec">Veri Güvenliği</div><div class="card">
    <div class="row" onclick="yedekAl()"><div class="av g">💾</div><div class="mid"><div class="t">Yedek Al (indir)</div><div class="s">tüm verini dosya olarak kaydet</div></div><span style="color:var(--sub)">›</span></div>
    <div class="row" onclick="$('yedekFile').click()"><div class="av" style="background:var(--ind2)">📂</div><div class="mid"><div class="t">Yedekten Yükle</div><div class="s">daha önce aldığın yedeği geri yükle</div></div><span style="color:var(--sub)">›</span></div>
    <div class="row" onclick="sifirla()"><div class="av r">🔄</div><div class="mid"><div class="t">Örnek verilere sıfırla</div></div></div>
  </div><input type="file" id="yedekFile" accept="application/json" style="display:none" onchange="yedekYukle(this)">
  <div class="mini" style="margin:8px 3px">💡 Veriler telefonunun tarayıcısında saklanır. Önemli verini ara sıra <b>yedek al</b> — tarayıcı geçmişini silsen bile kaybolmaz.</div>`;
  html+=`<div class="mini" style="text-align:center;margin-top:18px">Öz Tekstil Toptan Yönetim · prototip v2</div>`;
  $('app').innerHTML=html;
}
function formFirma(){open_('Firma Bilgileri',`<div class="mini">Bu bilgiler termal fiş / sipariş fişi çıktısının başlığında görünür.</div>
  <label>Logo (fişin en üstünde)</label>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:4px"><div class="logobox" onclick="$('f-logo-in').click()">${db.firmaLogo?`<img src="${db.firmaLogo}">`:'📷 Logo'}</div>${db.firmaLogo?`<button type="button" class="btn ghost sm" style="width:auto;margin:0" onclick="db.firmaLogo='';save();closeM();formFirma()">Kaldır</button>`:'<span class="mini">Yoksa firma adı yazı olarak basılır</span>'}</div>
  <input type="file" id="f-logo-in" accept="image/*" style="display:none" onchange="firmaLogoSec(this)">
  <label>Firma Adı</label><input id="f-ad" value="${esc(db.firma)}">
  <label>Slogan / Alt başlık</label><input id="f-slo" value="${esc(db.firmaSlogan||'')}" placeholder="Toptan Tekstil · Erkek Giyim">
  <label>Adres</label><input id="f-adr" value="${esc(db.firmaAdres||'')}" placeholder="Ulubatlı Hasan Sk. No:53/A · Güngören / İstanbul">
  <label>Telefon</label><input id="f-tel" value="${esc(db.firmaTel||'')}" placeholder="0212 000 00 00">
  <label>WhatsApp</label><input id="f-wp" value="${esc(db.firmaWp||'')}" placeholder="0538 000 00 00">
  <label>Satıcı Adı (fişte görünür)</label><input id="f-sat" value="${esc(db.satici||'')}" placeholder="Örn. Ayşegül">
  <button class="btn" onclick="kaydetFirma()">Kaydet</button>`)}
function firmaLogoSec(input){const f=input.files&&input.files[0];if(!f)return;resizeImg(f,d=>{db.firmaLogo=d;save();closeM();formFirma()},400,0.85)}
function kaydetFirma(){db.firma=$('f-ad').value.trim()||db.firma;db.firmaSlogan=$('f-slo').value.trim();db.firmaAdres=$('f-adr').value.trim();db.firmaTel=$('f-tel').value.trim();db.firmaWp=$('f-wp').value.trim();db.satici=$('f-sat').value.trim();save();closeM();render();toast('Firma bilgileri kaydedildi ✓')}
function formKur(){open_('Günün Kuru',`<button class="btn g" style="margin-top:0" onclick="kurGuncelle()">🔄 Otomatik Güncel Kuru Al</button>${db.kurTarih?`<div class="mini" style="text-align:center;margin-top:8px">Son güncelleme: ${kurYas()}</div>`:''}<div class="mini" style="text-align:center;margin:10px 0 4px">— veya elle gir —</div><div class="g2"><div><label>USD ($)</label><input id="k-usd" type="number" step="0.01" value="${db.kurUSD}"></div><div><label>EUR (€)</label><input id="k-eur" type="number" step="0.01" value="${db.kurEUR}"></div></div><div class="infobox">Dolar-endeksli ürünlerin TL fiyatı bu kura göre hesaplanır.</div><button class="btn" onclick="kaydetKur()">Elle Kaydet</button>`)}
function kaydetKur(){db.kurUSD=+$('k-usd').value||db.kurUSD;db.kurEUR=+$('k-eur').value||db.kurEUR;db.kurTarih=Date.now();save();closeM();render();toast('Kur güncellendi ✓')}
async function kurCek(){
  const upd=(usd,eur)=>{if(usd>0){db.kurUSD=+usd.toFixed(2);if(eur>0)db.kurEUR=+eur.toFixed(2);db.kurTarih=Date.now();save();return true}return false};
  try{const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});const d=await r.json();
    if(d&&d.rates&&d.rates.TRY)return upd(d.rates.TRY, d.rates.EUR?d.rates.TRY/d.rates.EUR:0);}catch(e){}
  try{const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',{cache:'no-store'});const d=await r.json();
    if(d&&d.usd&&d.usd.try)return upd(+d.usd.try, d.usd.eur?(+d.usd.try)/(+d.usd.eur):0);}catch(e){}
  return false;
}
async function kurGuncelle(){
  toast('Kur alınıyor...');
  const ok=await kurCek();
  if(ok){render();toast('Güncel kur alındı ✓ $'+db.kurUSD.toFixed(2))}
  else{toast('Otomatik alınamadı — elle girebilirsin');formKur()}
}
function kurYas(){if(!db.kurTarih)return '';const dk=Math.round((Date.now()-db.kurTarih)/60000);return dk<1?'az önce':dk<60?dk+' dk önce':Math.round(dk/60)+' saat önce'}
function yedekAl(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  const d=new Date();const ad=`oztekstil-yedek-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.href=url;a.download=ad;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('Yedek indirildi ✓');
}
function yedekYukle(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d||!d.urunler)throw 0}catch(e){toast('Geçersiz yedek dosyası');inp.value='';return}inp.value='';askConfirm('Mevcut veriler bu yedekle değiştirilsin mi?',()=>{db=d;save();go('panel');toast('Yedek geri yüklendi ✓')},'Yükle')};
  r.readAsText(f);
}

/* =================== MODAL & FAB =================== */
function open_(t,h){$('mT').textContent=t;$('mB').innerHTML=h;$('ov').classList.add('show')}
let _cariReturn=null,_saleStash=null;
function closeM(){$('ov').classList.remove('show');_cariReturn=null}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
function fabShow(v){if(!canSee(v))return false;if(v==='stok')return canUrunYaz()||canHammadde();if(v==='cari'||v==='satis')return true;return false}
function fabAction(){if(cur==='stok'){(stokTab==='hammadde'&&canHammadde())?formHammadde():(canUrunYaz()?formUrun():toast('Bu işlem için yetkiniz yok'))}else if(cur==='cari')formCari(cariTab);else if(cur==='satis')formSatis()}

/* =================== BAŞLAT =================== */
go('panel');
// açılışta kur eskiyse (yok veya 3 saatten eski) sessizce güncelle
if(!db.kurTarih || Date.now()-db.kurTarih > 3*3600000){
  kurCek().then(ok=>{if(ok&&cur==='panel')render()});
}
window.addEventListener('error',e=>{console.log('APPERR:',e.message)});
</script>
