<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1d3a63">
<title>Tekstil Toptan</title>
<style>
  :root{
    --bg:#f2f5fa; --card:#fff; --ink:#141d2b; --sub:#67788d; --ln:#e6ebf1; --ln2:#eef2f7;
    --ind:#24487a; --ind2:#2d6cdf; --thr:#c67b2c; --thr-s:#fbf1e3;
    --good:#0f9d63; --good-s:#e3f6ee; --bad:#e0455f; --bad-s:#fdeaee; --warn:#c8891a; --warn-s:#fbf1d8;
    --sh:0 1px 2px rgba(20,40,70,.05),0 6px 18px rgba(20,40,70,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:74px;font-size:15px;line-height:1.5;overflow-x:hidden}
  h1,h2,h3{margin:0}
  .tnum{font-variant-numeric:tabular-nums}

  header{background:linear-gradient(135deg,#1d3a63,#2d5aa0);color:#fff;padding:14px 16px 15px;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(20,40,70,.2)}
  header .top{display:flex;align-items:center;gap:11px}
  header .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:19px}
  header h1{font-size:16px;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:11px;opacity:.82;margin-top:1px}
  header .bell{margin-left:auto;font-size:18px}

  main{padding:14px;max-width:760px;margin:0 auto}
  .view{display:none;animation:fade .22s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .tile{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 13px;box-shadow:var(--sh)}
  .tile .l{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--sub)}
  .tile .v{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
  .tile .v.g{color:var(--good)}.tile .v.i{color:var(--ind)}.tile .v.sm{font-size:15px}

  .sec{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--sub);margin:18px 3px 9px;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
  .row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--ln2)}
  .av{width:40px;height:40px;border-radius:11px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:var(--ind2)}
  .av.p{background:#7a4fd0}.av.g{background:var(--good)}.av.o{background:var(--warn)}.av.gray{background:#eef2f7;color:#a9b6c6;font-size:19px}
  .mid{flex:1;min-width:0}
  .mid .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid .s{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .end{text-align:right;flex:0 0 auto}
  .end .n{font-weight:800;font-size:14px}
  .end .u{font-size:10.5px;color:var(--sub)}
  .pos{color:var(--good)}.neg{color:var(--bad)}
  .pill{display:inline-block;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:20px}
  .pill.ok{background:var(--good-s);color:var(--good)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.low{background:var(--warn-s);color:var(--warn)}
  .chips{display:flex;gap:4px;margin-top:5px}
  .chip{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.12)}
  .tag{font-size:9.5px;font-weight:800;background:var(--ln2);color:var(--sub);padding:2px 6px;border-radius:5px;margin-left:5px}

  .search{width:100%;padding:11px 13px;border:1px solid var(--ln);border-radius:12px;font-size:14px;background:var(--card);margin-bottom:12px;outline:none;box-shadow:var(--sh)}
  .search:focus{border-color:var(--ind2)}
  .segs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
  .segs::-webkit-scrollbar{display:none}
  .seg{font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--ln);color:var(--sub);white-space:nowrap;cursor:pointer}
  .seg.on{background:var(--ind);color:#fff;border-color:var(--ind)}

  .empty{text-align:center;padding:40px 20px;color:var(--sub)}
  .empty .i{font-size:40px;opacity:.4}.empty p{margin:12px 0 0;font-size:13.5px}

  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 16px rgba(20,40,70,.07)}
  nav button{flex:1;background:none;border:none;padding:5px 2px;color:var(--sub);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button .i{font-size:20px;line-height:1}
  nav button.on{color:var(--ind2)}

  .fab{position:fixed;right:16px;bottom:82px;width:56px;height:56px;border-radius:50%;background:var(--ind2);color:#fff;border:none;font-size:29px;box-shadow:0 6px 18px rgba(45,108,223,.45);z-index:25;cursor:pointer;display:none;align-items:center;justify-content:center}
  .fab.show{display:flex}.fab:active{transform:scale(.94)}

  .ov{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:93vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .sheet .hd{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:2}
  .sheet .hd h3{font-size:17px;font-weight:800}
  .sheet .hd button{background:var(--ln2);border:none;width:32px;height:32px;border-radius:50%;font-size:17px;color:var(--sub);cursor:pointer}
  .sheet .bd{padding:4px 18px 22px}
  label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--sub);margin:12px 0 5px}
  input,select{width:100%;padding:12px 13px;border:1px solid var(--ln);border-radius:12px;font-size:15px;background:#fbfcfe;outline:none;font-family:inherit;color:var(--ink)}
  input:focus,select:focus{border-color:var(--ind2);background:#fff}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .btn{width:100%;padding:14px;border:none;border-radius:13px;background:var(--ind2);color:#fff;font-size:15px;font-weight:800;margin-top:18px;cursor:pointer}
  .btn:active{opacity:.9}
  .btn.ghost{background:var(--ln2);color:var(--ind)}
  .btn.danger{background:var(--bad-s);color:var(--bad)}
  .btn.g{background:var(--good)}
  .seg2{display:flex;background:var(--ln2);border-radius:11px;padding:3px;margin-top:5px}
  .seg2 .o{flex:1;text-align:center;padding:9px;font-size:13px;font-weight:800;color:var(--sub);border-radius:9px;cursor:pointer}
  .seg2 .o.on{background:var(--card);color:var(--ind);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  .li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--ln)}
  .li .lt{flex:1;font-size:13.5px}.li .lt small{display:block;color:var(--sub);font-size:11px}
  .li b{font-size:13.5px}
  .del{background:var(--bad-s);color:var(--bad);border:none;width:28px;height:28px;border-radius:8px;font-size:15px;cursor:pointer;flex:0 0 28px}
  .total{background:#eef4fb;border-radius:12px;padding:13px 15px;margin-top:14px;display:flex;justify-content:space-between;align-items:center}
  .total .l{font-size:12px;color:var(--sub);font-weight:700}.total .v{font-size:22px;font-weight:800;color:var(--ind)}
  .step{display:flex;align-items:center;gap:10px}
  .step .b{width:34px;height:34px;border-radius:9px;background:var(--ln2);color:var(--ind);border:none;font-size:19px;font-weight:800;cursor:pointer}
  .step .b.p{background:var(--ind);color:#fff}
  .step input{width:64px;text-align:center;padding:9px}
  .mini{font-size:12px;color:var(--sub);margin-top:5px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#141d2b;color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:700;z-index:99;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .toast.show{opacity:1;bottom:170px}
  .stat-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--sub)}
  .stat-line b{color:var(--ink)}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">🧵</div>
    <div><h1 id="firma">Öz Tekstil</h1><div class="sub" id="hsub">Patron · prototip</div></div>
    <div class="bell">🔔</div>
  </div>
</header>

<main>
  <!-- PANEL -->
  <section class="view on" id="v-panel">
    <div class="tiles">
      <div class="tile"><div class="l">Toplam Alacak</div><div class="v g" id="t-alacak">₺0</div></div>
      <div class="tile"><div class="l">Bugünkü Satış</div><div class="v i" id="t-bugun">₺0</div></div>
      <div class="tile"><div class="l">Stok Değeri</div><div class="v sm" id="t-stok">₺0</div></div>
      <div class="tile"><div class="l">Müşteri</div><div class="v sm" id="t-mus">0</div></div>
    </div>
    <div class="sec">Son Satışlar</div>
    <div class="card" id="p-satis"></div>
    <div class="sec">Kritik Stok</div>
    <div class="card" id="p-kritik"></div>
  </section>

  <!-- STOK -->
  <section class="view" id="v-stok">
    <input class="search" id="ara-stok" placeholder="🔍 Ürün, kod veya renk ara...">
    <div class="segs" id="stok-segs"></div>
    <div class="card" id="liste-stok"></div>
  </section>

  <!-- SATIŞ -->
  <section class="view" id="v-satis">
    <div class="card" id="liste-satis"></div>
  </section>

  <!-- CARİ -->
  <section class="view" id="v-cari">
    <input class="search" id="ara-cari" placeholder="🔍 Müşteri ara...">
    <div class="card" id="liste-cari"></div>
  </section>
</main>

<button class="fab show" id="fab" onclick="fab()">+</button>

<nav>
  <button data-v="panel" class="on" onclick="go('panel')"><span class="i">📊</span>Panel</button>
  <button data-v="stok" onclick="go('stok')"><span class="i">📦</span>Stok</button>
  <button data-v="satis" onclick="go('satis')"><span class="i">🧾</span>Satış</button>
  <button data-v="cari" onclick="go('cari')"><span class="i">👥</span>Cari</button>
</nav>

<div class="ov" id="ov"><div class="sheet"><div class="hd"><h3 id="m-t">Başlık</h3><button onclick="close_()">✕</button></div><div class="bd" id="m-b"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ VERİ ============ */
const KEY='tekstil_proto_v1';
const seed={
  firma:'Öz Tekstil',
  urunler:[
    {id:1,ad:'Polo Yaka Triko',kod:'2026Y118',kat:'Polo',marka:'Öz Marka',birim:'seri',seri:5,renkler:['#1d2f52','#8a8f98','#e8e2d4'],stok:157,alis:95,satis:133,kritik:15},
    {id:2,ad:'Basic Tişört',kod:'2026Y087',kat:'Tişört',marka:'',birim:'seri',seri:5,renkler:['#f2f2ee','#111111'],stok:8,alis:78,satis:118,kritik:15},
    {id:3,ad:'Sweatshirt Kanguru',kod:'2026Y110',kat:'Sweat',marka:'Öz Marka',birim:'seri',seri:5,renkler:['#8a8f98','#1d2f52'],stok:3,alis:180,satis:245,kritik:10},
    {id:4,ad:'Eşofman Altı',kod:'2026Y052',kat:'Eşofman',marka:'',birim:'adet',seri:1,renkler:['#111111'],stok:240,alis:60,satis:95,kritik:40},
  ],
  musteriler:[
    {id:1,ad:'Yılmaz Tekstil',tel:'0532 111 22 33',sehir:'İstanbul / Laleli',bakiye:12500},
    {id:2,ad:'Aksoy Konfeksiyon',tel:'0505 777 88 99',sehir:'İzmir / Kemeraltı',bakiye:8750},
    {id:3,ad:'Demir Kumaş',tel:'0533 444 55 66',sehir:'Bursa / İnegöl',bakiye:-3200},
  ],
  satislar:[
    {id:1,mid:1,mus:'Yılmaz Tekstil',tarih:Date.now()-86400000,kalemler:[{urun:'Polo Yaka Triko',mik:20,birim:'seri',fiyat:133}],tutar:2660,odenen:0},
  ],
  seq:{u:5,m:4,s:2}
};
let db=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(seed))}catch(e){return JSON.parse(JSON.stringify(seed))}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function nid(k){return db.seq[k]++}

/* ============ YARDIMCI ============ */
const TL=n=>'₺'+Math.round(Number(n||0)).toLocaleString('tr-TR');
const $=id=>document.getElementById(id);
const init=s=>(s||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1900)}
function tstr(ts){const d=new Date(ts);return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function stokPill(u){if(u.stok<=0)return '<span class="pill bad">Tükendi</span>';if(u.stok<=u.kritik)return '<span class="pill low">Azaldı</span>';return '<span class="pill ok">Var</span>'}
function dots(r){return '<div class="chips">'+(r||[]).slice(0,4).map(c=>`<span class="chip" style="background:${c}"></span>`).join('')+'</div>'}

/* ============ NAV ============ */
let cur='panel';
function go(v){cur=v;document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));$('v-'+v).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('fab').classList.toggle('show',v!=='panel');render();window.scrollTo(0,0)}
function fab(){if(cur==='stok')formUrun();else if(cur==='cari')formMusteri();else formSatis()}

/* ============ RENDER ============ */
function render(){$('firma').textContent=db.firma;
  if(cur==='panel')rPanel();if(cur==='stok')rStok();if(cur==='satis')rSatis();if(cur==='cari')rCari()}

function rPanel(){
  const alacak=db.musteriler.reduce((a,m)=>a+Math.max(0,m.bakiye),0);
  const b0=new Date().setHours(0,0,0,0);
  const bugun=db.satislar.filter(s=>s.tarih>=b0).reduce((a,s)=>a+s.tutar,0);
  const sd=db.urunler.reduce((a,u)=>a+u.stok*u.alis*(u.birim==='seri'?u.seri:1),0);
  $('t-alacak').textContent=TL(alacak);$('t-bugun').textContent=TL(bugun);
  $('t-stok').textContent=TL(sd);$('t-mus').textContent=db.musteriler.length;
  const ss=[...db.satislar].sort((a,b)=>b.tarih-a.tarih).slice(0,4);
  $('p-satis').innerHTML=ss.length?ss.map(s=>`<div class="row" onclick="satisDet(${s.id})"><div class="av g">🧾</div><div class="mid"><div class="t">${esc(s.mus)}</div><div class="s">${tstr(s.tarih)} · ${s.kalemler.length} kalem</div></div><div class="end"><div class="n">${TL(s.tutar)}</div><div class="u">${s.odenen>=s.tutar?'<span class="pill ok">Ödendi</span>':'<span class="pill bad">Açık</span>'}</div></div></div>`).join(''):emp('🧾','Henüz satış yok');
  const kr=db.urunler.filter(u=>u.stok<=u.kritik);
  $('p-kritik').innerHTML=kr.length?kr.map(u=>`<div class="row" onclick="go('stok')"><div class="av o">📦</div><div class="mid"><div class="t">${esc(u.ad)}</div><div class="s">${esc(u.kod)}</div></div><div class="end"><div class="n ${u.stok<=0?'neg':''}">${u.stok}</div><div class="u">${u.birim}</div></div></div>`).join(''):emp('✅','Kritik stok yok');
}
function emp(i,t){return `<div class="empty"><div class="i">${i}</div><p>${t}</p></div>`}

let stokKat='Tümü';
function rStok(){
  const kats=['Tümü',...new Set(db.urunler.map(u=>u.kat).filter(Boolean))];
  $('stok-segs').innerHTML=kats.map(k=>`<div class="seg ${k===stokKat?'on':''}" onclick="stokKat='${k}';rStok()">${esc(k)}</div>`).join('');
  const q=($('ara-stok').value||'').toLowerCase();
  let list=db.urunler.filter(u=>(stokKat==='Tümü'||u.kat===stokKat)&&(u.ad.toLowerCase().includes(q)||u.kod.toLowerCase().includes(q)||(u.marka||'').toLowerCase().includes(q)));
  $('liste-stok').innerHTML=list.length?list.map(u=>`<div class="row" onclick="formUrun(${u.id})"><div class="av gray">👕</div><div class="mid"><div class="t">${esc(u.ad)}${u.marka?`<span class="tag">${esc(u.marka)}</span>`:''}</div><div class="s">${esc(u.kod)} · ${TL(u.satis)}/${u.birim}</div>${dots(u.renkler)}</div><div class="end"><div class="n ${u.stok<=0?'neg':u.stok<=u.kritik?'':''}" style="${u.stok<=u.kritik&&u.stok>0?'color:var(--warn)':u.stok<=0?'color:var(--bad)':''}">${u.stok}</div><div class="u">${u.birim}${u.birim==='seri'?' ×'+u.seri:''}</div>${stokPill(u)}</div></div>`).join(''):emp('📦','Ürün yok. Sağ alttaki + ile ekle.');
}

function rSatis(){
  const list=[...db.satislar].sort((a,b)=>b.tarih-a.tarih);
  $('liste-satis').innerHTML=list.length?list.map(s=>`<div class="row" onclick="satisDet(${s.id})"><div class="av g">🧾</div><div class="mid"><div class="t">${esc(s.mus)}</div><div class="s">${tstr(s.tarih)} · ${s.kalemler.map(k=>esc(k.urun)).join(', ')}</div></div><div class="end"><div class="n">${TL(s.tutar)}</div><div class="u">${s.odenen>=s.tutar?'<span class="pill ok">Ödendi</span>':'<span class="pill bad">'+TL(s.tutar-s.odenen)+' açık</span>'}</div></div></div>`).join(''):emp('🧾','Henüz satış yok. + ile yeni satış.');
}

function rCari(){
  const q=($('ara-cari').value||'').toLowerCase();
  const list=db.musteriler.filter(m=>m.ad.toLowerCase().includes(q)||(m.tel||'').includes(q));
  $('liste-cari').innerHTML=list.length?list.map(m=>{const b=m.bakiye,cls=b>0?'neg':b<0?'pos':'',lbl=b>0?'borç':b<0?'alacaklı':'kapalı';
    return `<div class="row" onclick="musDet(${m.id})"><div class="av">${init(m.ad)}</div><div class="mid"><div class="t">${esc(m.ad)}</div><div class="s">${esc(m.sehir||'')}${m.tel?' · '+esc(m.tel):''}</div></div><div class="end"><div class="n ${cls}">${TL(Math.abs(b))}</div><div class="u">${lbl}</div></div></div>`}).join(''):emp('👥','Müşteri yok. + ile ekle.');
}

/* ============ MODAL ============ */
function open_(t,h){$('m-t').textContent=t;$('m-b').innerHTML=h;$('ov').classList.add('show')}
function close_(){$('ov').classList.remove('show')}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')close_()});

/* ---- ÜRÜN ---- */
let formRenkler=[];
function formUrun(id){
  const u=id?db.urunler.find(x=>x.id===id):{birim:'seri',seri:5,renkler:[]};
  formRenkler=[...(u.renkler||[])];
  open_(id?'Ürün Düzenle':'Yeni Ürün',`
    <label>Ürün Adı</label><input id="u-ad" value="${esc(u.ad||'')}" placeholder="Örn: Polo Yaka Triko">
    <div class="g2"><div><label>Kod</label><input id="u-kod" value="${esc(u.kod||'')}" placeholder="2026Y001"></div><div><label>Kategori</label><input id="u-kat" value="${esc(u.kat||'')}" placeholder="Tişört"></div></div>
    <label>Marka (opsiyonel)</label><input id="u-marka" value="${esc(u.marka||'')}" placeholder="Öz Marka">
    <label>Satış Şekli</label>
    <div class="seg2"><div class="o ${u.birim==='seri'?'on':''}" onclick="setBirim('seri')" id="sb-seri">Seri</div><div class="o ${u.birim==='adet'?'on':''}" onclick="setBirim('adet')" id="sb-adet">Tekli (adet)</div></div>
    <div class="g2"><div id="seri-wrap" style="${u.birim==='adet'?'display:none':''}"><label>Seride kaç beden</label><input id="u-seri" type="number" value="${u.seri||5}"></div><div><label>Stok (${u.birim==='seri'?'seri':'adet'})</label><input id="u-stok" type="number" value="${u.stok||0}"></div></div>
    <div class="g2"><div><label>Alış Fiyatı</label><input id="u-alis" type="number" value="${u.alis||0}"></div><div><label>Satış Fiyatı</label><input id="u-satis" type="number" value="${u.satis||0}"></div></div>
    <label>Kritik Stok Uyarısı</label><input id="u-kritik" type="number" value="${u.kritik||10}">
    <label>Renkler</label>
    <div id="renk-box" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div>
    <button class="btn" onclick="kaydetUrun(${id||0})">Kaydet</button>
    ${id?`<button class="btn danger" onclick="silUrun(${id})">Ürünü Sil</button>`:''}
  `);
  cizRenk();
}
const RENKLER=['#111111','#ffffff','#1d2f52','#8a8f98','#e8e2d4','#5a1220','#0f9d63','#c8891a','#7a4fd0','#e0455f'];
function cizRenk(){
  $('renk-box').innerHTML=formRenkler.map((c,i)=>`<span class="chip" onclick="formRenkler.splice(${i},1);cizRenk()" style="width:26px;height:26px;background:${c};cursor:pointer;border-radius:7px"></span>`).join('')+
    `<span style="width:26px;height:26px;border:1px dashed var(--sub);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer" onclick="renkEkle()">+</span>`;
}
function renkEkle(){const c=RENKLER.find(x=>!formRenkler.includes(x))||RENKLER[0];formRenkler.push(c);cizRenk()}
function setBirim(b){$('sb-seri').classList.toggle('on',b==='seri');$('sb-adet').classList.toggle('on',b==='adet');$('seri-wrap').style.display=b==='seri'?'':'none';$('u-stok')._b=b}
function kaydetUrun(id){
  const ad=$('u-ad').value.trim();if(!ad)return toast('Ürün adı gerekli');
  const birim=$('sb-seri').classList.contains('on')?'seri':'adet';
  const o={ad,kod:$('u-kod').value.trim(),kat:$('u-kat').value.trim(),marka:$('u-marka').value.trim(),birim,seri:+$('u-seri').value||1,stok:+$('u-stok').value||0,alis:+$('u-alis').value||0,satis:+$('u-satis').value||0,kritik:+$('u-kritik').value||10,renkler:[...formRenkler]};
  if(id){Object.assign(db.urunler.find(x=>x.id===id),o)}else{o.id=nid('u');db.urunler.push(o)}
  save();close_();render();toast('Ürün kaydedildi ✓');
}
function silUrun(id){if(!confirm('Ürün silinsin mi?'))return;db.urunler=db.urunler.filter(x=>x.id!==id);save();close_();render();toast('Silindi')}

/* ---- MÜŞTERİ ---- */
function formMusteri(id){
  const m=id?db.musteriler.find(x=>x.id===id):{};
  open_(id?'Müşteri Düzenle':'Yeni Müşteri',`
    <label>Firma / Ad Soyad</label><input id="m-ad" value="${esc(m.ad||'')}" placeholder="Yılmaz Tekstil">
    <div class="g2"><div><label>Telefon</label><input id="m-tel" value="${esc(m.tel||'')}" placeholder="0532..."></div><div><label>Şehir / Bölge</label><input id="m-sehir" value="${esc(m.sehir||'')}" placeholder="İstanbul"></div></div>
    <label>Açılış Bakiyesi (borç +, alacaklı −)</label><input id="m-bak" type="number" value="${m.bakiye||0}">
    <button class="btn" onclick="kaydetMus(${id||0})">Kaydet</button>
    ${id?`<button class="btn danger" onclick="silMus(${id})">Müşteriyi Sil</button>`:''}
  `);
}
function kaydetMus(id){
  const ad=$('m-ad').value.trim();if(!ad)return toast('Ad gerekli');
  const o={ad,tel:$('m-tel').value.trim(),sehir:$('m-sehir').value.trim(),bakiye:+$('m-bak').value||0};
  if(id){Object.assign(db.musteriler.find(x=>x.id===id),o)}else{o.id=nid('m');db.musteriler.push(o)}
  save();close_();render();toast('Müşteri kaydedildi ✓');
}
function silMus(id){if(!confirm('Müşteri silinsin mi?'))return;db.musteriler=db.musteriler.filter(x=>x.id!==id);save();close_();render();toast('Silindi')}
function musDet(id){
  const m=db.musteriler.find(x=>x.id===id);
  const sat=db.satislar.filter(s=>s.mid===id).sort((a,b)=>b.tarih-a.tarih);
  const b=m.bakiye,cls=b>0?'neg':b<0?'pos':'',lbl=b>0?'Borçlu':b<0?'Alacaklı':'Bakiye kapalı';
  open_(m.ad,`
    <div class="total"><div><div class="l">${lbl}</div><div class="v ${cls}">${TL(Math.abs(b))}</div></div><div style="text-align:right"><div class="mini">${esc(m.sehir||'')}</div><div class="mini">${esc(m.tel||'')}</div></div></div>
    <div class="g2" style="margin-top:14px"><button class="btn g" style="margin:0" onclick="formTahsilat(${id})">💰 Tahsilat Al</button><button class="btn ghost" style="margin:0" onclick="formMusteri(${id})">✏️ Düzenle</button></div>
    <div class="sec" style="margin-top:18px">Satışlar (${sat.length})</div>
    ${sat.length?sat.map(s=>`<div class="li"><div class="lt">${tstr(s.tarih)}<small>${s.kalemler.length} kalem</small></div><b>${TL(s.tutar)}</b></div>`).join(''):'<div class="mini">Bu müşteriye ait satış yok.</div>'}
  `);
}
function formTahsilat(id){
  const m=db.musteriler.find(x=>x.id===id);
  open_('Tahsilat · '+m.ad,`
    <div class="mini">Güncel borç: <b>${TL(Math.max(0,m.bakiye))}</b></div>
    <label>Tahsil Edilen Tutar</label><input id="th-t" type="number" placeholder="0" inputmode="numeric">
    <label>Ödeme Türü</label><select id="th-tur"><option>Nakit</option><option>Havale</option><option>Kredi Kartı</option><option>Çek</option></select>
    <button class="btn g" onclick="kaydetTahsilat(${id})">Tahsilatı Kaydet</button>
  `);
}
function kaydetTahsilat(id){
  const t=+$('th-t').value;if(!t||t<=0)return toast('Tutar girin');
  const m=db.musteriler.find(x=>x.id===id);m.bakiye-=t;save();close_();render();toast('Tahsilat alındı ✓ '+TL(t));
}

/* ---- SATIŞ ---- */
let sepet=[];
function formSatis(){
  sepet=[];
  if(!db.musteriler.length)return toast('Önce müşteri ekle (Cari)');
  if(!db.urunler.length)return toast('Önce ürün ekle (Stok)');
  open_('Yeni Satış',`
    <label>Müşteri</label><select id="s-mus">${db.musteriler.map(m=>`<option value="${m.id}">${esc(m.ad)}</option>`).join('')}</select>
    <label>Ürün Ekle</label>
    <select id="s-urun" onchange="urunSecildi()">${db.urunler.map(u=>`<option value="${u.id}">${esc(u.ad)} (${u.stok} ${u.birim})</option>`).join('')}</select>
    <div style="display:flex;gap:10px;align-items:flex-end;margin-top:10px">
      <div class="step"><button class="b" onclick="mik(-1)">−</button><input id="s-mik" type="number" value="1" inputmode="numeric"><button class="b p" onclick="mik(1)">+</button></div>
      <button class="btn ghost" style="margin:0;flex:1" onclick="sepEkle()">+ Sepete Ekle</button>
    </div>
    <div class="mini" id="s-stokinfo"></div>
    <div id="sep-liste" style="margin-top:14px"></div>
    <div class="total"><div class="l">TOPLAM</div><div class="v" id="s-top">₺0</div></div>
    <label>Bu Satışta Ödenen (0 = tamamı borç)</label><input id="s-oden" type="number" value="0" inputmode="numeric">
    <button class="btn" onclick="kaydetSatis()">Satışı Tamamla</button>
  `);
  urunSecildi();cizSep();
}
function urunSecildi(){const u=db.urunler.find(x=>x.id==+$('s-urun').value);if(u)$('s-stokinfo').textContent=`Stok: ${u.stok} ${u.birim} · fiyat ${TL(u.satis)}/${u.birim}`}
function mik(d){const i=$('s-mik');i.value=Math.max(1,(+i.value||1)+d)}
function sepEkle(){
  const u=db.urunler.find(x=>x.id==+$('s-urun').value);const m=+$('s-mik').value;
  if(!m||m<=0)return toast('Miktar girin');
  const ex=sepet.find(k=>k.uid===u.id);
  if(ex)ex.mik+=m;else sepet.push({uid:u.id,urun:u.ad,mik:m,birim:u.birim,fiyat:u.satis});
  $('s-mik').value=1;cizSep();
}
function cizSep(){
  $('sep-liste').innerHTML=sepet.map((k,i)=>`<div class="li"><div class="lt">${esc(k.urun)}<small>${k.mik} ${k.birim} × ${TL(k.fiyat)}</small></div><b style="margin-right:8px">${TL(k.mik*k.fiyat)}</b><button class="del" onclick="sepet.splice(${i},1);cizSep()">✕</button></div>`).join('')||'<div class="mini">Sepet boş</div>';
  $('s-top').textContent=TL(sepet.reduce((a,k)=>a+k.mik*k.fiyat,0));
}
function kaydetSatis(){
  if(!sepet.length)return toast('Sepet boş');
  const m=db.musteriler.find(x=>x.id==+$('s-mus').value);
  const tutar=sepet.reduce((a,k)=>a+k.mik*k.fiyat,0);
  const oden=Math.min(Math.max(0,+$('s-oden').value||0),tutar);
  db.satislar.push({id:nid('s'),mid:m.id,mus:m.ad,tarih:Date.now(),kalemler:sepet.map(k=>({urun:k.urun,mik:k.mik,birim:k.birim,fiyat:k.fiyat})),tutar,odenen:oden});
  sepet.forEach(k=>{const u=db.urunler.find(x=>x.id===k.uid);if(u)u.stok-=k.mik});
  m.bakiye+=(tutar-oden);
  save();close_();go('satis');toast('Satış kaydedildi ✓ '+TL(tutar));
}
function satisDet(id){
  const s=db.satislar.find(x=>x.id===id);
  open_('Satış Fişi',`
    <div class="mini">${esc(s.mus)} · ${tstr(s.tarih)}</div>
    <div style="margin-top:12px">${s.kalemler.map(k=>`<div class="li"><div class="lt">${esc(k.urun)}<small>${k.mik} ${k.birim} × ${TL(k.fiyat)}</small></div><b>${TL(k.mik*k.fiyat)}</b></div>`).join('')}</div>
    <div class="total"><div class="l">TOPLAM</div><div class="v">${TL(s.tutar)}</div></div>
    <div class="g2" style="margin-top:10px"><div class="stat-line">Ödenen: <b>${TL(s.odenen)}</b></div><div class="stat-line" style="justify-content:flex-end">Kalan: <b class="${s.tutar-s.odenen>0?'neg':'pos'}">${TL(s.tutar-s.odenen)}</b></div></div>
    <button class="btn danger" onclick="silSatis(${id})">Satışı İptal Et</button>
  `);
}
function silSatis(id){
  if(!confirm('Satış iptal edilsin mi? Stok ve bakiye geri alınır.'))return;
  const s=db.satislar.find(x=>x.id===id);
  s.kalemler.forEach(k=>{const u=db.urunler.find(x=>x.ad===k.urun);if(u)u.stok+=k.mik});
  const m=db.musteriler.find(x=>x.id===s.mid);if(m)m.bakiye-=(s.tutar-s.odenen);
  db.satislar=db.satislar.filter(x=>x.id!==id);save();close_();render();toast('Satış iptal edildi');
}

/* arama */
$('ara-stok').addEventListener('input',rStok);
$('ara-cari').addEventListener('input',rCari);

render();
</script>
</body>
</html>
